function generateMirrorWords(word){
  const consonants='bcdfghjklmnpqrstvwxyz';
  const w=word.toLowerCase();
  const skel=w.split('').filter(c=>consonants.includes(c)).join('');
  const families={
    'fl':['feel','fall','full','fill','flow'],
    'fr':['fear','fire','four','fare','fore'],
    'dr':['dear','door','dare','draw','drop'],
    'st':['stay','star','step','stop','stem'],
    'br':['bare','born','burn','bind','bone'],
    'gr':['grow','glow','give','gate','gaze'],
    'tr':['true','turn','tear','tide','time'],
    'sl':['slow','silk','soul','soil','salt'],
    'sp':['spin','spot','span','spar','spur'],
    'cr':['care','core','cure','call','calm'],
    'wr':['warm','wake','wave','wild','wish'],
    'bl':['blue','bell','bolt','bind','beam'],
    'pr':['pure','pour','pull','push','pray'],
    'wt':['wait','want','what','wilt','whet'],
    'th':['this','them','then','thus','that'],
    'sh':['show','shed','shin','shut','ship'],
    'ht':['heat','halt','hint','hurt','hunt'],
    'rn':['rain','ruin','ring','roam','root'],
    'lv':['love','live','leaf','lift','lake'],
    'lk':['look','like','luck','lack','lick'],
    'nd':['need','nod','node','nude','name'],
    'wn':['wane','wine','worn','wand','wind'],
    'mn':['moon','mine','mane','mean','moan'],
    'lt':['lost','last','list','lust','loft'],
    'rc':['race','rock','rich','rack','ruck'],
    'dp':['deep','dip','drip','drop','dump'],
    'ld':['lead','loud','load','lord','land']
  };
  const key=skel.substring(0,2);
  if(families[key])return families[key];
  const keys=Object.keys(families);
  const idx=w.length%keys.length;
  return families[keys[idx]];
}

}

// FRACTURE SYSTEM — cracks radiating from center (EARTH visual language)
// ============================================================
const fractures=[];
function initFractures(){
  for(let i=0;i<16;i++){
    const angle=Math.PI*2*i/16+Math.random()*0.3;
    const len=maxR*(1.0+Math.random()*0.8);
    const branches=[];
    const nb=1+Math.floor(Math.random()*2);
    for(let b=0;b<nb;b++){
      const startP=0.3+Math.random()*0.4;
      const bAngle=angle+(Math.random()-0.5)*0.8;
      const bLen=len*(0.3+Math.random()*0.3);
      branches.push({startP,angle:bAngle,len:bLen});
    }
    fractures.push({angle,len,branches,width:1+Math.random()*2});
  }
}

function drawFractures(progress,alpha){
  if(progress<=0||alpha<=0)return;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=hsl(BINDU_HUE,60,85,1);
  ctx.shadowColor=hsl(BINDU_HUE,80,70,1);
  ctx.shadowBlur=8;
  for(const f of fractures){
    const drawLen=f.len*Math.min(progress*2,1);
    ctx.lineWidth=f.width*(1-progress*0.5);
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(f.angle)*drawLen,cy+Math.sin(f.angle)*drawLen);
    ctx.stroke();
    if(progress>0.3){
      const bp=Math.min((progress-0.3)/0.4,1);
      for(const b of f.branches){
        const sx=cx+Math.cos(f.angle)*f.len*b.startP;
        const sy=cy+Math.sin(f.angle)*f.len*b.startP;
        const bl=b.len*bp;
        ctx.lineWidth=f.width*0.5;
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+Math.cos(b.angle)*bl,sy+Math.sin(b.angle)*bl);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function startBinaural(){
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    binauralOsc=audioCtx.createOscillator();
    binauralGain=audioCtx.createGain();
    binauralPanner=audioCtx.createStereoPanner();
    binauralOsc.type='sine';
    binauralOsc.frequency.value=BINAURAL_HZ;
    binauralGain.gain.value=0;
    binauralPanner.pan.value=0;
    binauralOsc.connect(binauralGain);
    binauralGain.connect(binauralPanner);
    binauralPanner.connect(audioCtx.destination);
    binauralOsc.start();
    binauralGain.gain.linearRampToValueAtTime(0.06,audioCtx.currentTime+2);
  }catch(e){}
}
function updateBinauralPan(){
  if(!binauralPanner||!audioCtx)return;
  try{
    const pan=Math.max(-1,Math.min(1,(gyroGamma||0)/45));
    binauralPanner.pan.value=pan;
    const now=audioCtx.currentTime;
    const trem=0.04+Math.sin(now*3)*0.01;
    binauralGain.gain.value=Math.max(0,trem);
  }catch(e){}
}
function fadeBinaural(out){
  if(!binauralGain||!audioCtx)return;
  try{
    binauralGain.gain.cancelScheduledValues(audioCtx.currentTime);
    binauralGain.gain.linearRampToValueAtTime(out?0:0.04,audioCtx.currentTime+3);
  }catch(e){}
}

class Dancer{
  constructor(hue,baseR,orbitR,mxG){
    this.hue=hue;this.r=baseR;this.x=cx;this.y=cy;this.tx=cx;this.ty=cy;
    this.glow=0;this.p=0;this.tp=0;this.oR=orbitR;this.oA=Math.random()*Math.PI*2;
    this.mxG=mxG||30;this.aG=[];this.rG=4;this.ds=1;
  }
  updateGhost(){
    if(this.p>0.05){
      this.aG.push({x:this.x,y:this.y,a:0.4*this.p});
      while(this.aG.length>this.mxG)this.aG.shift();
    }
    for(let i=this.aG.length-1;i>=0;i--){this.aG[i].a*=0.94;if(this.aG[i].a<0.01)this.aG.splice(i,1)}
  }
  draw(t,e,ed,tn){
    if(this.p<0.01)return;
    const a=this.p;
    const dx=this.x-(this.aG.length>0?this.aG[this.aG.length-1].x:this.x);
    const dy=this.y-(this.aG.length>0?this.aG[this.aG.length-1].y:this.y);
    const spd=Math.hypot(dx,dy);
    const stretchX=1+Math.min(spd*0.02,0.3);
    const stretchY=1/stretchX;
    const moveAngle=Math.atan2(dy,dx);
    const tremor=(tn||0)*2;
    const tx=tremor?Math.sin(t*15+this.hue)*tremor:0;
    const ty=tremor?Math.cos(t*17+this.hue)*tremor:0;
    const px=this.x+tx,py=this.y+ty;
    // DOT ghost trail — individual ghost dots (EARTH, not ribbon)
    for(const g of this.aG){
      ctx.save();ctx.globalAlpha=g.a*a*(1+postMirrorBoost);
      ctx.fillStyle=hsl(this.hue,50,60,1);
      ctx.beginPath();ctx.arc(g.x,g.y,this.r*0.6,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    // Outer glow — VX expanded (14r)
    ctx.save();ctx.globalAlpha=a*0.2*(1+postMirrorBoost);
    const gr2=ctx.createRadialGradient(px,py,0,px,py,this.r*14);
    gr2.addColorStop(0,hsl(this.hue,60,65,0.3));gr2.addColorStop(0.5,hsl(this.hue,60,65,0.08));gr2.addColorStop(1,hsl(this.hue,60,65,0));
    ctx.fillStyle=gr2;ctx.beginPath();ctx.arc(px,py,this.r*14,0,Math.PI*2);ctx.fill();ctx.restore();
    // Inner glow
    ctx.save();ctx.globalAlpha=a*0.35*(1+postMirrorBoost);
    const gr=ctx.createRadialGradient(px,py,0,px,py,this.r*5);
    gr.addColorStop(0,hsl(this.hue,60,70,0.5));gr.addColorStop(1,hsl(this.hue,60,65,0));
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,this.r*5,0,Math.PI*2);ctx.fill();ctx.restore();
    // Dot with stretch
    ctx.save();ctx.globalAlpha=a;
    ctx.translate(px,py);ctx.rotate(moveAngle);ctx.scale(stretchX*this.ds,stretchY*this.ds);
    ctx.fillStyle=hsl(this.hue,55,60,1);
    ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=a*0.5;ctx.fillStyle=hsl(this.hue,20,92,1);
    ctx.beginPath();ctx.arc(0,0,this.r*0.3,0,Math.PI*2);ctx.fill();ctx.restore();
    this.ds+=(1-this.ds)*0.08;
  }
}

// ============================================================
// ENSEMBLE — VX expanded ranges
// ============================================================
const bindu=new Dancer(BINDU_HUE,7,0,55);
const gaia=new Dancer(25,5.5,maxR*0.15,40);
const sid=new Dancer(40,5,maxR*0.25,30);
const arch=new Dancer(330,5,maxR*0.2,40);
const karishma=new Dancer(45,4.5,0,30);
const sakshi=new Dancer(220,4.5,maxR*0.38,25);
const ashrey=new Dancer(0,4,0,30);
const allDancers=[bindu,gaia,sid,arch,karishma,sakshi,ashrey];
const AD=allDancers;

// Bloom ring system
const rings=[];
function spawnRing(i,x,y){
  rings.push({x,y,r:4+i*3,mr:maxR*(0.3+i*0.5),spd:60+i*220,op:0.1+i*0.5,lw:0.6+i*2.5,b:performance.now()});
  if(rings.length>40)rings.shift();
}
// Particle system
const particles=[];
function spawnParticles(x,y,n,hue,energy){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const spd=1.5+Math.random()*4*energy;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:0.006+Math.random()*0.012,r:1.5+Math.random()*3,hue});
  }
  if(particles.length>350)particles.splice(0,particles.length-350);
}
let orbitalBase=0;
const gaiaRings=[];
function spawnGaiaRing(x,y,intensity){
  gaiaRings.push({x,y,r:5,mr:maxR*(0.25+intensity*0.55),op:intensity*0.7,b:performance.now()});
  if(gaiaRings.length>15)gaiaRings.shift();
}

// VX: Word-derived params (set on start)
let wp={wavePeriod:0.5,fluidity:0.5,density:0.5};

// EARTH IMPACT SYSTEMS
let screenShakeX=0,screenShakeY=0; // screen jitter on heavy hits
const dustParticles=[]; // rise from below on bass
let underglowAlpha=0; // warm light from below
let binduDropForce=0; // gravity slam on impact
const seismicLines=[]; // horizontal distortion waves
const aftershockRings=[]; // rings from the GROUND, not from Bindu

// ============================================================
// MAIN ANIMATE
// ============================================================
function animate(){
  const song=document.getElementById('song');
  const t=song.currentTime;
  const p=t/DUR;
  const e=SC(E,t);
  const eb=SC(EB,t);
  const em=SC(EM,t);
  const eh=SC(EH,t);
  const br=SC(B,t);
  const pi=SC(P,t);
  const tn=SC(T,t);
  const ed=SC(ED,t);

  // VX: Update accelerometer smoothing
  accelSmoothed+=(Math.abs(accelMag)-accelSmoothed)*0.1;
  if(accelSmoothed<0.5)motionLabel='still';
  else if(accelSmoothed<2)motionLabel='swaying';
  else motionLabel='moving';

  // SCREEN SHAKE decay
  screenShakeX*=0.85;screenShakeY*=0.85;
  if(Math.abs(screenShakeX)<0.1)screenShakeX=0;
  if(Math.abs(screenShakeY)<0.1)screenShakeY=0;

  // BINDU DROP FORCE decay — gravity, then spring back
  binduDropForce*=0.88;

  // UNDERGLOW decay
  underglowAlpha*=0.92;

  // VX: Update spatial binaural pan
  updateBinauralPan();

  // Bloom
  const bt=Math.min(e*1.2,1);
  if(bt>bloom)bloom+=(bt-bloom)*0.06;
  else bloom+=(bt-bloom)*0.012;

  // Spatial narrative — Bindu CLIMBS from bottom to top (EARTH, not orbit)
  if(t<15)binduBaseY=0;
  else if(t<PEAK_T)binduBaseY=Math.min((t-15)/(PEAK_T-15),1);
  else if(t>DUR-3)binduBaseY=Math.max(0,(DUR-t-0.5)/2.5);

  // Background
  ctx.clearRect(0,0,W,HT);

  // SCREEN SHAKE — translate entire canvas
  if(screenShakeX||screenShakeY){
    ctx.save();ctx.translate(screenShakeX,screenShakeY);
  }

  // Warm earth gradient — breathes with energy
  const bgBright=0.08+e*0.06;
  const bgG=ctx.createRadialGradient(cx,cy+HT*0.2,0,cx,cy,Math.max(W,HT)*0.8);
  bgG.addColorStop(0,hsl(BINDU_HUE,40,bgBright*100+8,1));
  bgG.addColorStop(0.6,hsl(BINDU_HUE,30,bgBright*100+3,1));
  bgG.addColorStop(1,hsl(BINDU_HUE,20,bgBright*100,1));
  ctx.fillStyle=bgG;
  ctx.fillRect(-10,-10,W+20,HT+20);

  // UNDERGLOW — warm molten light from below on bass impacts
  if(underglowAlpha>0.01){
    const ugG=ctx.createLinearGradient(cx,HT,cx,HT*0.5);
    ugG.addColorStop(0,hsl(BINDU_HUE-5,60,35,underglowAlpha));
    ugG.addColorStop(0.4,hsl(BINDU_HUE,50,25,underglowAlpha*0.4));
    ugG.addColorStop(1,hsl(BINDU_HUE,40,15,0));
    ctx.fillStyle=ugG;ctx.fillRect(0,0,W,HT);
  }

  // Mirror darkness
  checkMirrorWords(t);
  if(tn<-0.1&&mirrorTarget<0.3)mirrorTarget=DARK_RATIO*0.4;
  if(e>0.4&&SC(E,t-2)<0.15)mirrorTarget=DARK_RATIO*0.6;

  if(mirrorTarget>mirrorDark)mirrorDark+=(mirrorTarget-mirrorDark)*0.08;
  else mirrorDark+=(mirrorTarget-mirrorDark)*0.03;
  mirrorTarget*=0.96;

  if(mirrorDark>0.01){
    ctx.save();ctx.globalAlpha=mirrorDark;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,HT);
    ctx.restore();postMirrorBoost=0.4;
  }else{postMirrorBoost*=0.97}

  // ============================================================
  // DUST FROM BELOW — particles rising from the ground on bass
  // ============================================================
  for(let i=dustParticles.length-1;i>=0;i--){
    const dp=dustParticles[i];
    dp.x+=dp.vx;dp.y+=dp.vy;
    dp.vy*=0.995; // slow rise
    dp.vx+=(Math.random()-0.5)*0.1; // drift
    dp.life-=dp.decay;
    if(dp.life<=0||dp.y<-10){dustParticles.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=dp.life*0.35;
    ctx.fillStyle=hsl(dp.hue,35,55,1);
    ctx.beginPath();ctx.arc(dp.x,dp.y,dp.r*dp.life,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // ============================================================
  // SEISMIC LINES — horizontal distortion on heavy impacts
  // ============================================================
  for(let i=seismicLines.length-1;i>=0;i--){
    const sl=seismicLines[i];
    sl.life-=0.03;
    sl.y+=sl.speed*(Math.random()-0.5);
    if(sl.life<=0){seismicLines.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=sl.alpha*sl.life;
    ctx.strokeStyle=hsl(BINDU_HUE,40,65,1);
    ctx.lineWidth=1+sl.life;
    ctx.beginPath();
    const startX=(W-sl.width)/2;
    ctx.moveTo(startX,sl.y);
    // Jagged seismic line
    const segs=12;
    for(let s=1;s<=segs;s++){
      const sx=startX+sl.width*s/segs;
      const sy=sl.y+(Math.random()-0.5)*6*sl.life;
      ctx.lineTo(sx,sy);
    }
    ctx.stroke();ctx.restore();
  }

  // ============================================================
  // AFTERSHOCK RINGS — from the GROUND upward on strongest hits
  // ============================================================
  for(let i=aftershockRings.length-1;i>=0;i--){
    const ar=aftershockRings[i];
    ar.r+=ar.spd;ar.y-=ar.spd*0.5; // rise as they expand
    const life=ar.r/ar.mr;
    if(life>=1){aftershockRings.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=ar.op*(1-life);
    ctx.strokeStyle=hsl(BINDU_HUE-5,45,50,1);ctx.lineWidth=2.5*(1-life);
    // Draw as half-arc (ground upward)
    ctx.beginPath();ctx.arc(ar.x,ar.y,ar.r,Math.PI,Math.PI*2);ctx.stroke();ctx.restore();
  }

  // Mirror word rendering — warm earth tones (NOT cool blue)
  if(activeMirrorWord){
    const age=t-activeMirrorWord.t;
    const fadeIn=Math.min(age/0.3,1);
    const fadeOut=Math.max(0,1-(age-activeMirrorWord.dur+0.5)/0.5);
    const alpha=Math.min(fadeIn,fadeOut)*0.85;
    if(alpha>0){
      const el=document.getElementById('mirrorWord');
      el.textContent=activeMirrorWord.word;
      el.style.color=`rgba(255,240,230,${alpha})`;
      el.style.textShadow=`0 0 40px rgba(255,200,150,${alpha*0.5})`;
    }
  }else{
    document.getElementById('mirrorWord').style.color='rgba(255,240,230,0)';
  }

  // Fracture at detonation (16.32s) — EARTH visual language
  if(t>=16&&t<20){
    if(!fractureActive){fractureActive=true;initFractures()}
    fractureT=Math.min((t-16)/1.5,1);
    const fadeOut=t>18?Math.max(0,1-(t-18)/2):1;
    drawFractures(fractureT,fadeOut*0.7);
  }

  // VX SYSTEM 5: Draw Bindu Memory constellation
  if(binduMemory.length>0){
    ctx.save();
    for(let i=0;i<binduMemory.length;i++){
      const m=binduMemory[i];
      const pos=wordToPosition(m.word);
      const age=(Date.now()-m.timestamp)/(1000*60*60*24*30);
      const alpha=Math.max(0.08,0.4/(1+age*0.5));
      const count=binduMemory.filter(b=>b.word.toLowerCase()===m.word.toLowerCase()).length;
      const brightness=Math.min(0.6,alpha*count);
      ctx.globalAlpha=brightness*(0.8+Math.sin(t*0.3+i)*0.2);
      ctx.fillStyle=hsl(BINDU_HUE+i*7,30,70,1);
      ctx.beginPath();ctx.arc(pos.x*W,pos.y*HT,1.5+count*0.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // Process hits
  while(hi<H.length&&t>=H[hi].t){
    const h=H[hi];
    if(t-h.t<0.4){
      spawnRing(h.i,bindu.x,bindu.y);
      bindu.ds=1+h.i*0.8;
      if(bloom>0.4&&h.i>0.3)spawnParticles(bindu.x,bindu.y,Math.floor(h.i*12),BINDU_HUE,h.i);
      if(h.i>0.3&&eb>0.25&&gaia.p>0.1)spawnGaiaRing(gaia.x,gaia.y,h.i*eb);
      // SCREEN SHAKE — the whole frame jolts on strong hits
      if(h.i>0.4){screenShakeX=(Math.random()-0.5)*h.i*12;screenShakeY=(Math.random()-0.5)*h.i*8}
      // BINDU GRAVITY DROP — slammed down on impact
      if(h.i>0.5)binduDropForce+=h.i*maxR*0.06;
      // DUST FROM BELOW — bass shakes particles up from the ground
      if(eb>0.3&&h.i>0.3){
        const nDust=Math.floor(h.i*8);
        for(let d=0;d<nDust;d++){
          dustParticles.push({x:Math.random()*W,y:HT+5,vy:-(1.5+Math.random()*3*h.i),vx:(Math.random()-0.5)*0.8,life:1,decay:0.005+Math.random()*0.01,r:1+Math.random()*2.5,hue:BINDU_HUE+Math.random()*20-10});
        }
        if(dustParticles.length>200)dustParticles.splice(0,dustParticles.length-200);
      }
      // UNDERGLOW FLASH — molten light from below
      if(h.i>0.4)underglowAlpha=Math.max(underglowAlpha,h.i*0.5);
      // SEISMIC LINES — horizontal distortion on heavy hits
      if(h.i>0.6){
        const nLines=2+Math.floor(h.i*3);
        for(let sl=0;sl<nLines;sl++){
          seismicLines.push({y:cy+Math.random()*HT*0.6-HT*0.3,width:W*0.6+Math.random()*W*0.4,alpha:h.i*0.4,speed:3+Math.random()*4,life:1});
        }
      }
      // AFTERSHOCK from the GROUND — strongest hits send rings up from below
      if(h.i>0.7){
        aftershockRings.push({x:cx+(Math.random()-0.5)*W*0.4,y:HT,r:10,mr:maxR*0.8,op:h.i*0.4,spd:5});
      }
      // DOUBLE-PULSE HAPTICS — da-DUM like a war drum
      if(h.i>0.4)try{navigator.vibrate&&navigator.vibrate([h.i*30|0,40,h.i*50|0])}catch(ex){}
    }
    hi++;
  }

  // ============================================================
  // ENSEMBLE POSITIONS — VX EXPANDED RANGES + GYROSCOPE
  // ============================================================
  // VX: Gravity shift from gyroscope
  const gyroX=gyroActive?(gyroGamma||0)/45*maxR*0.25*wp.fluidity:0;
  const gyroY=gyroActive?((gyroBeta||0)-45)/45*maxR*0.2*wp.fluidity:0;

  // Bindu CLIMBS from bottom to top (spatial narrative, word-seeded sway)
  const climbRange=HT*0.35;
  const baseBinduY=cy+climbRange*0.5-binduBaseY*climbRange;
  bindu.ty=baseBinduY-(pi-0.5)*maxR*0.25+gyroY+binduDropForce;
  bindu.tx=cx+Math.sin(t*0.4*wp.wavePeriod)*maxR*0.2+gyroX;
  bindu.x+=(bindu.tx-bindu.x)*0.04;
  bindu.y+=(bindu.ty-bindu.y)*0.04;

  // Gaia — WIDE horizontal sweep, bass-driven (VX: maxR*0.8)
  gaia.tp=bloom>0.12?Math.min((bloom-0.12)/0.15,1):0;
  gaia.tx=cx+Math.sin(t*0.3)*maxR*0.95*eb+Math.cos(t*0.18)*maxR*0.4+gyroX;
  gaia.ty=bindu.y+maxR*0.15+eb*maxR*0.1+gyroY*0.6;
  gaia.x+=(gaia.tx-gaia.x)*0.05;gaia.y+=(gaia.ty-gaia.y)*0.05;
  gaia.p+=(gaia.tp-gaia.p)*0.04;gaia.r=5+eb*4;

  // Sid — FULL ORBIT (VX: maxR*0.55)
  sid.tp=bloom>0.22?Math.min((bloom-0.22)/0.15,1):0;
  sid.oA+=0.012+e*0.005;
  sid.tx=cx+Math.cos(sid.oA)*maxR*0.65+gyroX*0.5;
  sid.ty=bindu.y+Math.sin(sid.oA)*maxR*0.55+gyroY*0.5;
  sid.x+=(sid.tx-sid.x)*0.04;sid.y+=(sid.ty-sid.y)*0.04;
  sid.p+=(sid.tp-sid.p)*0.04;

  // Arch — FULL mirror distance (VX: 1.4x)
  arch.tp=bloom>0.32?Math.min((bloom-0.32)/0.15,1):0;
  arch.tx=cx-(bindu.x-cx)*1.6+Math.sin(t*0.5)*maxR*0.2+gyroX*0.6;
  arch.ty=cy-(bindu.y-cy)*0.9+Math.cos(t*0.4)*em*maxR*0.25+gyroY*0.6;
  arch.x+=(arch.tx-arch.x)*0.06;arch.y+=(arch.ty-arch.y)*0.06;
  arch.p+=(arch.tp-arch.p)*0.04;arch.r=4.5+em*3;

  // Karishma — FULL SCREEN in silence (VX: maxR*0.7)
  const kE=Math.max(0,1-e*1.3);
  karishma.tp=kE;
  karishma.tx=cx+Math.sin(t*0.2)*maxR*0.85*kE+Math.cos(t*0.13)*maxR*0.4+gyroX*0.4;
  karishma.ty=bindu.y-maxR*0.15+Math.cos(t*0.17)*maxR*0.6*kE+gyroY*0.4;
  karishma.x+=(karishma.tx-karishma.x)*0.03;karishma.y+=(karishma.ty-karishma.y)*0.03;
  karishma.p+=(karishma.tp-karishma.p)*0.025;karishma.r=4+kE*5;

  // Sakshi — EDGE TO EDGE (VX: maxR*0.9 × maxR*0.7)
  sakshi.tp=bloom>0.45?Math.min((bloom-0.45)/0.2,1):0;
  sakshi.tx=cx+Math.cos(t*0.09)*maxR*1.05+gyroX*0.2;
  sakshi.ty=cy+Math.sin(t*0.07)*maxR*0.85+gyroY*0.2;
  sakshi.x+=(sakshi.tx-sakshi.x)*0.02;sakshi.y+=(sakshi.ty-sakshi.y)*0.02;
  sakshi.p+=(sakshi.tp-sakshi.p)*0.025;

  // Ashrey — centroid + web
  ashrey.tp=bloom>0.65?Math.min((bloom-0.65)/0.15,1):0;
  let ax=0,ay=0,n=0;
  for(const d of AD){if(d!==ashrey&&d.p>0.1){ax+=d.x;ay+=d.y;n++}}
  if(n>0){ashrey.tx=ax/n;ashrey.ty=ay/n}
  ashrey.x+=(ashrey.tx-ashrey.x)*0.03;ashrey.y+=(ashrey.ty-ashrey.y)*0.03;
  ashrey.p+=(ashrey.tp-ashrey.p)*0.02;
  ashrey.hue=(t*12)%360;

  // VX SYSTEM 7: ADAPTIVE RETURN — condition-based GROUNDING (descent, not evaporation)
  const isEnding=t>DUR*0.85&&e<0.15;
  const isSettling=accelSmoothed<0.3;
  const timeToEnd=DUR-t;

  if(timeToEnd<RETURN_START||(isEnding&&isSettling&&timeToEnd<30)){
    const rt=Math.min(timeToEnd,RETURN_START);
    const progress=1-rt/RETURN_START;
    // GROUNDING: everything descends (EARTH, not evaporation)
    const pullY=HT*0.4*progress;
    for(const d of AD){
      if(d!==bindu)d.ty+=pullY*0.5;
    }
    bindu.ty+=pullY*0.3;
    // Fade ensemble in order
    if(rt<15)ashrey.tp=Math.min(ashrey.tp,rt/15);
    if(rt<13)sakshi.tp=Math.min(sakshi.tp,(rt-2)/11);
    if(rt<11)arch.tp=Math.min(arch.tp,(rt-4)/7);
    if(rt<9)sid.tp=Math.min(sid.tp,(rt-6)/3);
    if(rt<7)gaia.tp=Math.min(gaia.tp,(rt-8)/2);
    if(rt<3)karishma.tp=Math.min(karishma.tp,rt/3);
  }

  // Update ghosts
  for(const d of AD)d.updateGhost();

  // ============================================================
  // ORGANISM LAYER — canvas breathes with bass
  // ============================================================
  const bassPulse=eb*0.07;
  if(bassPulse>0.005){
    ctx.save();
    ctx.translate(cx,cy);ctx.scale(1+bassPulse,1+bassPulse);ctx.translate(-cx,-cy);
  }

  // Vignette
  const vigR=Math.max(W,HT)*(0.6+e*0.3);
  const vig=ctx.createRadialGradient(cx,cy,vigR*0.3,cx,cy,vigR);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,`rgba(0,0,0,${0.2+bloom*0.15})`);
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,HT);

  // ============================================================
  // GAIA IMPACT RINGS
  // ============================================================
  for(let i=gaiaRings.length-1;i>=0;i--){
    const gr=gaiaRings[i];
    gr.r+=4.5;const life=gr.r/gr.mr;
    if(life>=1){gaiaRings.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=gr.op*(1-life)*(1+postMirrorBoost);
    ctx.strokeStyle=hsl(25,50,45,1);ctx.lineWidth=3.5*(1-life);
    ctx.beginPath();ctx.arc(gr.x,gr.y,gr.r,0,Math.PI*2);ctx.stroke();ctx.restore();
  }

  // ============================================================
  // ORBITAL RINGS — rotating concentric arcs (bloom S2+)
  // ============================================================
  if(bloom>0.3){
    orbitalBase+=0.003+e*0.008;
    const nRings=Math.min(Math.floor((bloom-0.3)*12),5);
    const orbAlpha=(bloom-0.3)*0.6*(1+postMirrorBoost);
    for(let i=0;i<nRings;i++){
      const r=maxR*(0.08+i*0.07)*(0.5+e*0.5);
      const rot=orbitalBase*(1+i*0.3)*(i%2?-1:1);
      const arcLen=Math.PI*(0.3+bloom*0.5);
      const segs=3+i;
      ctx.save();ctx.globalAlpha=orbAlpha*(0.5+i*0.1);
      ctx.strokeStyle=hsl(BINDU_HUE+i*15,40,55+bloom*15,1);
      ctx.lineWidth=0.8+bloom;
      for(let s=0;s<segs;s++){
        const segA=rot+s*(Math.PI*2/segs);
        ctx.beginPath();ctx.arc(bindu.x,bindu.y,r,segA,segA+arcLen/segs);ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ============================================================
  // RADIAL RAYS — bass-pulsed lines from Bindu (bloom S3+)
  // ============================================================
  if(bloom>0.5){
    const rayAlpha=(bloom-0.5)*0.7*eb*(1+postMirrorBoost);
    const nRays=12;
    const rayLen=maxR*(0.3+eb*0.5);
    ctx.save();
    for(let i=0;i<nRays;i++){
      const a=Math.PI*2*i/nRays+t*0.1;
      const pulse=1+Math.sin(t*3+i*0.7)*0.3;
      const len=rayLen*pulse;
      const grad=ctx.createLinearGradient(bindu.x,bindu.y,bindu.x+Math.cos(a)*len,bindu.y+Math.sin(a)*len);
      grad.addColorStop(0,hsl(BINDU_HUE,50,60,rayAlpha));
      grad.addColorStop(1,hsl(BINDU_HUE,50,60,0));
      ctx.strokeStyle=grad;ctx.lineWidth=1.5+eb*3;ctx.globalAlpha=1;
      ctx.beginPath();ctx.moveTo(bindu.x,bindu.y);
      ctx.lineTo(bindu.x+Math.cos(a)*len,bindu.y+Math.sin(a)*len);ctx.stroke();
    }
    ctx.restore();
  }

  // ============================================================
  // PARTICLES
  // ============================================================
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];
    pt.x+=pt.vx;pt.y+=pt.vy;
    pt.vx*=0.98;pt.vy*=0.98;
    pt.life-=pt.decay;
    if(pt.life<=0){particles.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=pt.life*0.6*(1+postMirrorBoost);
    ctx.fillStyle=hsl(pt.hue+pt.life*30,50,65,1);
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r*pt.life,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // Draw all dancers
  for(const d of AD)d.draw(t,e,ed,tn);

  // ============================================================
  // CROWN MANDALA — geometric patterns at bloom S4 (0.7+)
  // ============================================================
  if(bloom>0.7){
    const crAlpha=(bloom-0.7)*1.5*(1+postMirrorBoost);
    const crR=maxR*(0.4+bloom*0.25);
    ctx.save();ctx.globalAlpha=crAlpha*0.25;
    ctx.strokeStyle=hsl(BINDU_HUE,30,70,1);
    ctx.lineWidth=0.6;
    ctx.beginPath();ctx.arc(bindu.x,bindu.y,crR,0,Math.PI*2);ctx.stroke();
    const nTri=6;
    const triRot=t*0.15;
    ctx.globalAlpha=crAlpha*0.15;
    for(let i=0;i<nTri;i++){
      const a=triRot+Math.PI*2*i/nTri;
      const triR=crR*0.9;
      ctx.beginPath();
      for(let v=0;v<3;v++){
        const va=a+Math.PI*2*v/3;
        const x=bindu.x+Math.cos(va)*triR;
        const y=bindu.y+Math.sin(va)*triR;
        v===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.stroke();
    }
    ctx.globalAlpha=crAlpha*0.12;
    const nPetals=8;
    const petalRot=-t*0.08;
    for(let i=0;i<nPetals;i++){
      const a=petalRot+Math.PI*2*i/nPetals;
      const pr=crR*0.6;
      ctx.beginPath();
      ctx.arc(bindu.x+Math.cos(a)*pr*0.5,bindu.y+Math.sin(a)*pr*0.5,pr*0.5,a-Math.PI/3,a+Math.PI/3);
      ctx.stroke();
    }
    ctx.globalAlpha=crAlpha*0.2;
    const irR=crR*0.5;
    ctx.beginPath();ctx.arc(bindu.x,bindu.y,irR,0,Math.PI*2);ctx.stroke();
    const nNodes=12;
    for(let i=0;i<nNodes;i++){
      const a=t*0.05+Math.PI*2*i/nNodes;
      const nx=bindu.x+Math.cos(a)*irR;
      const ny=bindu.y+Math.sin(a)*irR;
      ctx.globalAlpha=crAlpha*0.3;
      ctx.fillStyle=hsl(BINDU_HUE,40,75,1);
      ctx.beginPath();ctx.arc(nx,ny,1.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // ============================================================
  // EXPANDING RINGS from hits
  // ============================================================
  const now=performance.now();
  for(let i=rings.length-1;i>=0;i--){
    const rn=rings[i];
    rn.r+=rn.spd/60;const life=rn.r/rn.mr;
    if(life>=1){rings.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=rn.op*(1-life*life)*(1+postMirrorBoost);
    ctx.strokeStyle=hsl(BINDU_HUE,50,55+bloom*20,1);
    ctx.lineWidth=rn.lw*(1-life*0.6);
    ctx.beginPath();
    const sg=48;
    for(let s=0;s<=sg;s++){
      const a=(s/sg)*Math.PI*2;
      const w=1+Math.sin(a*3+now*0.001)*0.02*(1-life);
      const rx=rn.x+Math.cos(a)*rn.r*w;
      const ry=rn.y+Math.sin(a)*rn.r*w;
      s===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
    }
    ctx.stroke();ctx.restore();
  }

  // ============================================================
  // ASHREY WEB — gradient threads + midpoint nodes (VX: maxR*1.5)
  // ============================================================
  if(ashrey.p>0.1){
    const viD=AD.filter(d=>d.p>0.1&&d!==ashrey);
    for(let i=0;i<viD.length;i++){
      for(let j=i+1;j<viD.length;j++){
        const d1=viD[i],d2=viD[j];
        const dist=Math.hypot(d1.x-d2.x,d1.y-d2.y);
        if(dist<maxR*1.5){
          const a=ashrey.p*0.12*(1-dist/(maxR*1.5))*(1+postMirrorBoost);
          ctx.save();ctx.globalAlpha=a;
          const wg=ctx.createLinearGradient(d1.x,d1.y,d2.x,d2.y);
          wg.addColorStop(0,hsl(d1.hue||BINDU_HUE,40,60,1));
          wg.addColorStop(1,hsl(d2.hue||BINDU_HUE,40,60,1));
          ctx.strokeStyle=wg;ctx.lineWidth=0.7;
          ctx.beginPath();ctx.moveTo(d1.x,d1.y);ctx.lineTo(d2.x,d2.y);ctx.stroke();
          const mx=(d1.x+d2.x)/2,my=(d1.y+d2.y)/2;
          ctx.globalAlpha=a*0.6;ctx.fillStyle=hsl(ashrey.hue,40,70,1);
          ctx.beginPath();ctx.arc(mx,my,1.5,0,Math.PI*2);ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  // ============================================================
  // RESONANCE FLASHES
  // ============================================================
  for(let i=0;i<AD.length;i++){
    for(let j=i+1;j<AD.length;j++){
      if(AD[i].p>0.1&&AD[j].p>0.1){
        const dist=Math.hypot(AD[i].x-AD[j].x,AD[i].y-AD[j].y);
        if(dist<maxR*0.08){
          const mx=(AD[i].x+AD[j].x)/2,my=(AD[i].y+AD[j].y)/2;
          ctx.save();ctx.globalAlpha=0.4*(1+postMirrorBoost);
          const rg=ctx.createRadialGradient(mx,my,0,mx,my,maxR*0.08);
          rg.addColorStop(0,hsl(BINDU_HUE,30,90,0.6));rg.addColorStop(1,hsl(BINDU_HUE,30,90,0));
          ctx.fillStyle=rg;ctx.beginPath();ctx.arc(mx,my,maxR*0.08,0,Math.PI*2);ctx.fill();ctx.restore();
        }
      }
    }
  }

  // Close organism layer
  if(bassPulse>0.005)ctx.restore();

  // Close screen shake transform
  if(screenShakeX||screenShakeY)ctx.restore();

  // Word reveal at peak
  if(t>=PEAK_T&&!wordRevealed){
    wordRevealed=true;
    const wr=document.getElementById('wordReveal');
    wr.textContent=userWord;
    wr.classList.add('visible');
    setTimeout(()=>wr.classList.add('dissolve'),3500);
  }

  // I Love You
  if(t>PEAK_T+5&&!loveShown){loveShown=true;document.getElementById('loveText').classList.add('visible')}

  // Binaural return
  if(t>DUR-5)fadeBinaural(false);

  // End fade — to warm earth, not black
  if(t>DUR-3){
    const f=Math.min((t-(DUR-3))/3,1);
    ctx.save();ctx.globalAlpha=f;
    ctx.fillStyle=hsl(BINDU_HUE,30,6,1);
    ctx.fillRect(0,0,W,HT);ctx.restore();
  }

  if(song.ended||t>DUR-0.3){
    if(!fruitShown){
      fruitShown=true;
      const w=userWord;
      const dwell=Math.round((Date.now()-wordStartTime)/1000*10)/10;
      const echo=getMostRepeated();

      // VX SYSTEM 9: ALIVE FRUIT
      let dwellMsg='';
      if(dwell<1.5)dwellMsg='You arrived without hesitation.';
      else if(dwell<5)dwellMsg='You paused before you arrived.';
      else dwellMsg='You searched before choosing to land.';

      const countMsg=danceCount===0?'This is your first arrival.':
        `You have arrived ${danceCount+1} time${danceCount>0?'s':''}.`;

      const echoMsg=echo&&echo!==w.toLowerCase()?` You keep returning to \u201C${echo}.\u201D`:'';

      document.getElementById('fruitText').innerHTML=
        `The iron in your blood is the same iron in the stars. You were never lost. You were planted. The ground was always yours. ${dwellMsg} ${motionLabel==='still'?'You held still.':motionLabel==='swaying'?'You were swaying with the ground.':'You were moving.'} ${countMsg}${echoMsg}`;

      // Save to Bindu Memory
      saveToBinduMemory(w,dwell,motionLabel);
      // Cross-panel state
      try{localStorage.setItem('tol-muladhara-dance','true');localStorage.setItem('tol-muladhara-dance-word',w)}catch(ex){}
      setTimeout(()=>{
        document.getElementById('fruitOverlay').style.background=hsl(BINDU_HUE,30,5,1);
        document.getElementById('fruitOverlay').classList.add('visible');
      },2500);
    }
  }

  requestAnimationFrame(animate);
}

// ============================================================
// START
// ============================================================
function go(){
  if(started)return;
  const wi=document.getElementById('wordInput');
  userWord=wi.value.trim();
  if(!userWord){wi.focus();return}
  started=true;
  wi.blur();
  wordStartTime=Date.now();

  // VX: Set word-seeded params
  wp=wordParams(userWord);
  // VX: Generate mirror words from offering
  setupMirrorWords(userWord);

  // Fullscreen
  try{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}

  // VX: Init device sensors
  initGyro();

  // Start binaural
  startBinaural();

  document.getElementById('wi').classList.remove('visible');
  document.getElementById('so').classList.add('hidden');
  clearTimeout(seedTimer);

  const song=document.getElementById('song');
  song.volume=0;

  setTimeout(()=>{
    song.play().then(()=>{
      function waitForAudio(){
        if(song.currentTime>0){
          hi=0;while(hi<H.length&&H[hi].t<song.currentTime-0.05)hi++;
          let v=0;const fi=setInterval(()=>{v=Math.min(v+0.01,0.8);song.volume=v;if(v>=0.8)clearInterval(fi)},50);
          fadeBinaural(true);
          requestAnimationFrame(animate);
        }else requestAnimationFrame(waitForAudio);
      }
      waitForAudio();
    }).catch(console.error);
  },3000);

  // Wake Lock
  (async()=>{try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}})();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')try{navigator.wakeLock.request('screen').then(w=>{wakeLock=w})}catch(e){}});
}

// Show word input after seed types
setTimeout(()=>document.getElementById('wi').classList.add('visible'),SEED.length*460+1500);

// Tap anywhere
document.addEventListener('touchend',e=>{
  if(!started&&document.getElementById('wi').classList.contains('visible')){go()}
},{passive:true});
document.addEventListener('click',()=>{
  if(!started&&document.getElementById('wi').classList.contains('visible'))go();
});
document.getElementById('wordInput').addEventListener('keydown',e=>{if(e.key==='Enter')go()});

</script>
