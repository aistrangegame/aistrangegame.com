class Dancer{
  constructor(hue,baseR,orbitR,mxG){this.hue=hue;this.r=baseR;this.x=cx;this.y=cy;this.tx=cx;this.ty=cy;this.glow=0;this.p=0;this.tp=0;this.oR=orbitR;this.oA=Math.random()*Math.PI*2;this.mxG=mxG||30;this.aG=[];this.ds=1}
  updateGhost(){if(this.p>0.05){this.aG.push({x:this.x,y:this.y,a:0.4*this.p,age:0});while(this.aG.length>this.mxG)this.aG.shift()}for(let i=this.aG.length-1;i>=0;i--){this.aG[i].age++;this.aG[i].a*=0.93;if(this.aG[i].a<0.01)this.aG.splice(i,1)}}
  draw(t,e,ed,tn,heartPulse){
    if(this.p<0.01)return;const a=this.p;
    const dx=this.x-(this.aG.length>0?this.aG[this.aG.length-1].x:this.x);const dy=this.y-(this.aG.length>0?this.aG[this.aG.length-1].y:this.y);

      if(pulseAlpha<0.008)continue;ctx.save();

      ctx.restore()}

    const pmb=1+postMirrorBoost;ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=a*0.15*pmb;const gr2=ctx.createRadialGradient(px,py,0,px,py,this.r*14);gr2.addColorStop(0,hsl(this.hue,55,70,0.25));gr2.addColorStop(0.4,hsl(this.hue-15,45,50,0.06));gr2.addColorStop(1,hsl(this.hue,40,40,0));ctx.fillStyle=gr2;ctx.beginPath();ctx.arc(px,py,this.r*14,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=a*0.25*pmb;const gr=ctx.createRadialGradient(px,py,0,px,py,this.r*6);gr.addColorStop(0,hsl(this.hue+15,50,82,0.4));gr.addColorStop(1,hsl(this.hue,45,55,0));ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,this.r*6,0,Math.PI*2);ctx.fill();
    const hbGlow=heartPulse*0.15*a*pmb;if(hbGlow>0.01){ctx.globalAlpha=hbGlow;const hbr=ctx.createRadialGradient(px,py,this.r*2,px,py,this.r*18);hbr.addColorStop(0,hsl(this.hue+5,60,75,0.15));hbr.addColorStop(1,hsl(this.hue,50,60,0));ctx.fillStyle=hbr;ctx.beginPath();ctx.arc(px,py,this.r*18,0,Math.PI*2);ctx.fill()}

}

    const el=document.getElementById('mirrorWord');el.textContent=mw.word;el.style.color='rgba(255,180,200,0.7)';el.style.transition='none';setTimeout(()=>{el.style.transition='color 1.5s ease';el.style.color='rgba(255,180,200,0)'},mw.dur*1000)}}
  if(mirrorTarget>mirrorDark)mirrorDark+=(mirrorTarget-mirrorDark)*0.08;else mirrorDark+=(mirrorTarget-mirrorDark)*0.03;mirrorTarget*=0.96;

  sid.tp=bloom>0.18?Math.min((bloom-0.18)/0.12,1):0;sid.oA+=0.01+e*0.005;sid.tx=cx+Math.cos(sid.oA)*maxR*0.65*spatialScale+gyroX*0.4;sid.ty=cy+Math.sin(sid.oA)*maxR*0.55*spatialScale+gyroY*0.4;sid.x+=(sid.tx-sid.x)*0.04;sid.y+=(sid.ty-sid.y)*0.04;

  ashrey.tp=bloom>0.6?Math.min((bloom-0.6)/0.15,1):0;let ax2=0,ay2=0,nc=0;for(const d2 of AD){if(d2!==ashrey&&d2.p>0.1){ax2+=d2.x;ay2+=d2.y;nc++}}if(nc>0){ashrey.tx=ax2/nc;ashrey.ty=ay2/nc}ashrey.x+=(ashrey.tx-ashrey.x)*0.03;ashrey.y+=(ashrey.ty-ashrey.y)*0.03;ashrey.hue=(t*12)%360;

  if(t>=PEAK_T&&!wordRevealed){wordRevealed=true;document.getElementById('wordReveal').textContent=userWord;document.getElementById('wordReveal').classList.add('visible');setTimeout(()=>{document.getElementById('wordReveal').classList.add('dissolve')},4000)}
  // ---- L4: I LOVE YOU ----
  if(t>PEAK_T+5&&!loveShown){loveShown=true;document.getElementById('loveText').classList.add('visible')}
  // ---- L4: FRUIT ----
  if(timeToEnd<2&&!fruitShown){fruitShown=true;fadeBinaural(false);
    const w=userWord;const dwell=Math.round((Date.now()-wordStartTime)/1000*10)/10;const echo=getMostRepeated();
    let dwellMsg='';if(dwell<1.5)dwellMsg='You didn\u2019t hesitate.';else if(dwell<5)dwellMsg='You paused before opening.';else dwellMsg='You searched before you could name what you needed.';
    const countMsg=danceCount===0?'This is your first opening.':`You have opened ${danceCount+1} time${danceCount>0?'s':''}.`;
    const echoMsg=echo&&echo!==w.toLowerCase()?` You keep returning to \u201C${echo}.\u201D`:'';
    const motionMsg=motionLabel==='still'?'You were still.':motionLabel==='swaying'?'You were swaying.':'You were moving.';
    let crossMsg='';if(prevDanceWord)crossMsg=` The fire forged \u201C${prevDanceWord}.\u201D The heart breathed it into \u201C${w}.\u201D`;
    document.getElementById('fruitText').innerHTML=`You gave this song \u201C${w}.\u201D What are you waiting for? That question was never for someone else. It was for you. You\u2019re the light AND the night. You\u2019re the cure AND the pain. You weren\u2019t waiting for love to find you. You are the love. The heart doesn\u2019t receive \u2014 it recognizes what was already there. ${dwellMsg} ${motionMsg} ${countMsg}${echoMsg}${crossMsg}`;
    saveToBinduMemory(w,dwell,motionLabel);
    try{localStorage.setItem('tol-anahata-dance','true');localStorage.setItem('tol-anahata-dance-word',w)}catch(ex){}
    setTimeout(()=>{document.getElementById('fruitOverlay').style.background=hsl(BINDU_HUE,30,4,1);document.getElementById('fruitOverlay').classList.add('visible')},2500)}

  requestAnimationFrame(animate);
}


// ============================================================
// START — go() function (L4 with L3 init)
// ============================================================
function go(){
  if(started)return;
  const wi=document.getElementById('wordInput');
  userWord=wi.value.trim();
  if(!userWord){wi.focus();return}
  started=true;wi.blur();wordStartTime=Date.now();
  wp=wordParams(userWord);setupMirrorWords(userWord);

  try{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}
  initGyro();initAccel();startBinaural();

  document.getElementById('wi').classList.remove('visible');
  document.getElementById('so').classList.add('hidden');
  clearTimeout(seedTimer);

  const song=document.getElementById('song');song.volume=0;
  setTimeout(()=>{
    song.play().then(()=>{
      function waitForAudio(){
        if(song.currentTime>0){
          hi=0;while(hi<H.length&&H[hi].t<song.currentTime-0.05)hi++;
          let v=0;const fi=setInterval(()=>{v=Math.min(v+0.01,0.8);song.volume=v;if(v>=0.8)clearInterval(fi)},50);
          fadeBinaural(true);
          requestAnimationFrame(animate);
        }else requestAnimationFrame(waitForAudio);
      }
      waitForAudio();
    }).catch(console.error);
  },3000);

  (async()=>{try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}})();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')try{navigator.wakeLock.request('screen').then(w=>{wakeLock=w})}catch(e){}});
}

setTimeout(()=>document.getElementById('wi').classList.add('visible'),SEED.length*857+1500);
document.addEventListener('touchend',e=>{if(!started&&document.getElementById('wi').classList.contains('visible'))go()},{passive:true});
document.addEventListener('click',()=>{if(!started&&document.getElementById('wi').classList.contains('visible'))go()});
document.getElementById('wordInput').addEventListener('keydown',e=>{if(e.key==='Enter')go()});

</script>
