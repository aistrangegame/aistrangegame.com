function wordParams(word){
  const vowels='aeiou';const w=word.toLowerCase();
  const vr=w.split('').filter(c=>vowels.includes(c)).length/Math.max(w.length,1);
  return{wavePeriod:0.3+w.length*0.08,fluidity:0.3+vr*0.7,hueShift:((w.charCodeAt(0)-97)%9)*3-12,density:Math.min(w.length/8,1)};
}

function generateMirrorWords(word){
  const consonants='bcdfghjklmnpqrstvwxyz';const w=word.toLowerCase();
  const skel=w.split('').filter(c=>consonants.includes(c)).join('');
  const families={
    'fl':['flame','flare','flash','forge','fuse'],'fr':['fire','fury','force','forge','freed'],
    'dr':['dare','drive','drawn','dried','drum'],'st':['stark','steel','stoke','storm','stand'],
    'br':['burn','brave','blaze','broke','brand'],'gr':['grit','gleam','glow','guard','grind'],
    'tr':['true','torch','trial','turn','trust'],'sl':['slow','smelt','smoke','spark','soot'],
    'sp':['spark','spent','split','spoke','spur'],'cr':['core','crack','crown','crude','crust'],
    'wr':['wrath','warm','weld','wild','will'],'bl':['blaze','blast','blind','blood','bolt'],
    'pr':['power','pride','proof','pulse','purge'],'wt':['wait','want','white','whet','wilt'],
    'th':['thaw','thick','thin','thorn','throw'],'sh':['shine','shock','shore','shout','shroud'],
    'ht':['heat','heart','hunt','hurt','haste'],'rn':['rage','raze','reach','reign','rise'],
    'lv':['lava','light','live','loud','lance'],'lk':['lick','like','lock','luck','lurk'],
    'nd':['need','nerve','night','nova','null'],'wn':['wane','want','warn','waste','wound'],
    'mn':['melt','mine','mold','muse','myth'],'lt':['last','leap','lost','lust','lyric'],
    'rc':['race','rage','rank','raze','reign'],'dp':['deep','dusk','dust','dawn','dark'],
    'ld':['lead','lend','load','loud','land']
  };
  const key=skel.substring(0,2);
  if(families[key])return families[key];
  const keys=Object.keys(families);return families[keys[w.length%keys.length]];
}

let gyroAlpha=0,gyroBeta=0,gyroGamma=0,gyroActive=false;
function handleOrientation(ev){gyroAlpha=ev.alpha||0;gyroBeta=ev.beta||0;gyroGamma=ev.gamma||0}
function initGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted'){window.addEventListener('deviceorientation',handleOrientation);gyroActive=true}}).catch(()=>{});
    }else{window.addEventListener('deviceorientation',handleOrientation);gyroActive=true}
  }
}

let accelMag=0,accelSmoothed=0,motionLabel='still';
function handleMotion(ev){const a=ev.accelerationIncludingGravity;if(a)accelMag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2)-9.8}
function initAccel(){
  if(typeof DeviceMotionEvent!=='undefined'){
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')window.addEventListener('devicemotion',handleMotion)}).catch(()=>{});
    }else{window.addEventListener('devicemotion',handleMotion)}
  }
}
function updateMotionState(){accelSmoothed+=(Math.abs(accelMag)-accelSmoothed)*0.1;if(accelSmoothed<0.5)motionLabel='still';else if(accelSmoothed<2)motionLabel='swaying';else motionLabel='moving'}

let binauralOsc=null,binauralGain=null,binauralPanner=null,audioCtx=null;
function startBinaural(){
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();binauralOsc=audioCtx.createOscillator();binauralGain=audioCtx.createGain();binauralPanner=audioCtx.createStereoPanner();
  binauralOsc.type='sine';binauralOsc.frequency.value=BINAURAL_HZ;binauralGain.gain.value=0;binauralPanner.pan.value=0;
  binauralOsc.connect(binauralGain);binauralGain.connect(binauralPanner);binauralPanner.connect(audioCtx.destination);binauralOsc.start()}catch(e){}
}
function updateBinauralPan(){
  if(!binauralPanner||!audioCtx)return;
  try{binauralPanner.pan.value=Math.max(-1,Math.min(1,(gyroGamma||0)/45));
  binauralGain.gain.value=Math.max(0,0.04+Math.sin(audioCtx.currentTime*3)*0.01)}catch(e){}
}
function fadeBinaural(fadeIn){
  if(!binauralGain||!audioCtx)return;
  try{binauralGain.gain.cancelScheduledValues(audioCtx.currentTime);
  binauralGain.gain.linearRampToValueAtTime(fadeIn?0.04:0,audioCtx.currentTime+3)}catch(e){}

const BM_COLS=25,BM_ROWS=35;
const burnHeat=new Float32Array(BM_COLS*BM_ROWS);
const burnFuel=new Float32Array(BM_COLS*BM_ROWS);
burnFuel.fill(1.0);
let burnCellW=1,burnCellH=1;
function initBurnMap(){burnCellW=W/BM_COLS;burnCellH=HT/BM_ROWS}

function addHeatAt(px,py,amount){
  const col=Math.floor(px/burnCellW),row=Math.floor(py/burnCellH);
  if(col>=0&&col<BM_COLS&&row>=0&&row<BM_ROWS){const idx=row*BM_COLS+col;if(burnFuel[idx]>0.05)burnHeat[idx]=Math.min(1,burnHeat[idx]+amount)}
}
function addHeatRadius(px,py,amount,radius){
  const cc=Math.floor(px/burnCellW),cr=Math.floor(py/burnCellH),r=Math.ceil(radius/Math.max(burnCellW,burnCellH));
  for(let dr=-r;dr<=r;dr++){for(let dc=-r;dc<=r;dc++){
    const col=cc+dc,row=cr+dr;
    if(col>=0&&col<BM_COLS&&row>=0&&row<BM_ROWS){const dist=Math.sqrt(dc*dc+dr*dr);if(dist<=r){const idx=row*BM_COLS+col;if(burnFuel[idx]>0.05)burnHeat[idx]=Math.min(1,burnHeat[idx]+amount*(1-dist/(r+0.5)))}}
  }}
}
function updateBurnMap(e){
  const spread=0.01+e*0.018,decay=0.004+e*0.003,fuelBurn=0.001+e*0.0012;
  for(let r=0;r<BM_ROWS;r++){for(let c=0;c<BM_COLS;c++){
    const idx=r*BM_COLS+c,h=burnHeat[idx];
    if(h>0.3&&burnFuel[idx]>0)burnFuel[idx]=Math.max(0,burnFuel[idx]-fuelBurn*h);
    if(burnFuel[idx]<0.05){burnHeat[idx]*=0.94;continue}
    if(h>0.12){const neighbors=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];for(const[nr,nc]of neighbors){if(nr>=0&&nr<BM_ROWS&&nc>=0&&nc<BM_COLS){const ni=nr*BM_COLS+nc;if(burnFuel[ni]>0.08&&burnHeat[ni]<h)burnHeat[ni]=Math.min(1,burnHeat[ni]+spread*h*0.25)}}}
    burnHeat[idx]=Math.max(0,h-decay);
  }}
}
function backdraft(){for(let i=0;i<burnHeat.length;i++){if(burnFuel[i]<0.5)burnFuel[i]=Math.min(1,burnFuel[i]+0.6);if(burnHeat[i]>0.04)burnHeat[i]=Math.min(1,burnHeat[i]+0.4)}}

const bmCvs=document.createElement('canvas');bmCvs.width=BM_COLS;bmCvs.height=BM_ROWS;
const bmCtx=bmCvs.getContext('2d');
// Intermediate canvas for two-stage burn map rendering
// Stage 1: scale tiny→full with source-over + smoothing (always works)
// Stage 2: composite smoothed result onto main canvas with lighter
const bmScaled=document.createElement('canvas');
const bmScaledCtx=bmScaled.getContext('2d');
function resizeBmScaled(){bmScaled.width=W;bmScaled.height=HT;bmScaledCtx.imageSmoothingEnabled=true;bmScaledCtx.webkitImageSmoothingEnabled=true;bmScaledCtx.imageSmoothingQuality='high'}
bmReady=true;resizeBmScaled();

function renderBurnMap(){
  const imgData=bmCtx.createImageData(BM_COLS,BM_ROWS);const px=imgData.data;
  for(let r=0;r<BM_ROWS;r++){for(let c=0;c<BM_COLS;c++){
    const idx=r*BM_COLS+c,h=burnHeat[idx],fuel=burnFuel[idx],pi=idx*4;
    if(h<0.02){px[pi]=px[pi+1]=px[pi+2]=0;px[pi+3]=0;continue}
    let rd,gn,bl,alpha;
    if(h>0.8){rd=255;gn=200;bl=80;alpha=h*0.22}
    else if(h>0.6){rd=255;gn=150;bl=20;alpha=h*0.18}
    else if(h>0.4){rd=230;gn=100;bl=10;alpha=h*0.15}
    else if(h>0.2){rd=190;gn=45;bl=5;alpha=h*0.12}
    else{rd=120;gn=20;bl=3;alpha=h*0.08}
    if(fuel<0.3){rd=Math.max(80,rd-40);gn=Math.max(10,gn-30);bl=Math.min(bl+15,60)}
    px[pi]=rd;px[pi+1]=gn;px[pi+2]=bl;px[pi+3]=Math.min(255,alpha*255)|0;
  }}
  bmCtx.putImageData(imgData,0,0);
  // Stage 1: smooth scale on intermediate canvas (source-over — smoothing always reliable)
  bmScaledCtx.clearRect(0,0,W,HT);
  bmScaledCtx.drawImage(bmCvs,0,0,W,HT);
  // Stage 2: composite smoothed result with lighter onto main canvas
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.drawImage(bmScaled,0,0,W,HT);ctx.restore();
}

// ============================================================
// LAYER 1 — DANCER CLASS (combustion ghost trails)
// ============================================================

class Dancer{
  constructor(hue,baseR,orbitR,mxG){
    this.hue=hue;this.r=baseR;this.x=cx;this.y=cy;this.tx=cx;this.ty=cy;
    this.glow=0;this.p=0;this.tp=0;this.oR=orbitR;this.oA=Math.random()*Math.PI*2;
    this.mxG=mxG||30;this.aG=[];this.ds=1;
  }
  updateGhost(){
    if(this.p>0.05){
      this.aG.push({x:this.x,y:this.y,a:0.4*this.p,age:0});
      while(this.aG.length>this.mxG)this.aG.shift();
    }
    for(let i=this.aG.length-1;i>=0;i--){
      this.aG[i].age++;
      this.aG[i].a*=0.92;
      if(this.aG[i].a<0.01)this.aG.splice(i,1);
    }
  }
  draw(t,e,ed,tn){
    if(this.p<0.01)return;
    const a=this.p;
    const dx=this.x-(this.aG.length>0?this.aG[this.aG.length-1].x:this.x);
    const dy=this.y-(this.aG.length>0?this.aG[this.aG.length-1].y:this.y);
    const spd=Math.hypot(dx,dy);
    const stretchX=1+Math.min(spd*0.02,0.3);
    const stretchY=1/stretchX;
    const moveAngle=Math.atan2(dy,dx);
    const tremor=(tn||0)*2;
    const tx2=tremor?Math.sin(t*15+this.hue)*tremor:0;
    const ty2=tremor?Math.cos(t*17+this.hue)*tremor:0;
    const px=this.x+tx2,py=this.y+ty2;

    // COMBUSTION GHOST TRAIL — three-phase ember rendering
    for(const g of this.aG){
      const lifePhase=Math.min(g.age/35,1);
      let gHue,gLit,gAlpha,gSize;

      if(lifePhase<0.15){ // IGNITE — bright flare, expands
        const ip=lifePhase/0.15;
        gHue=55-ip*15;gLit=88-ip*20;
        gAlpha=g.a*a*(0.6+ip*0.6);
        gSize=this.r*(0.5+ip*0.9);
      }else if(lifePhase<0.55){ // BURN — flicker, holds
        const bp=(lifePhase-0.15)/0.4;
        const flicker=1+Math.sin(t*22+g.x*0.13+g.y*0.11)*0.2;
        gHue=40-bp*30;gLit=68-bp*30;
        gAlpha=g.a*a*flicker*0.9;
        gSize=this.r*(1.4-bp*0.3);
      }else{ // ASH — shrink, darken, smoke rises
        const ap=(lifePhase-0.55)/0.45;
        gHue=8+ap*2;gLit=25-ap*12;
        gAlpha=g.a*a*(1-ap*0.6)*0.7;
        gSize=this.r*(1.1-ap*0.7);
      }
      if(gAlpha<0.008||gSize<0.3)continue;

      ctx.save();
      // Ignite+burn phases glow additively; ash is normal
      // postMirrorBoost makes trails pop after darkness
      if(lifePhase<0.45){
        ctx.globalCompositeOperation='lighter';
        ctx.globalAlpha=Math.min(gAlpha*(1+postMirrorBoost),0.6);
      }else{
        ctx.globalAlpha=Math.min(gAlpha*(1+postMirrorBoost*0.5),0.45);
      }
      ctx.fillStyle=hsl(gHue,75,gLit,1);
      ctx.beginPath();ctx.arc(g.x,g.y,Math.max(0.5,gSize),0,Math.PI*2);ctx.fill();

      // Smoke wisps from late ash phase
      if(lifePhase>0.65&&gAlpha>0.02){
        const smokeAge=(lifePhase-0.65)/0.35;
        const smokeY=g.y-smokeAge*18;
        const smokeX=g.x+Math.sin(t*2.5+g.x*0.05)*4*smokeAge;
        ctx.globalCompositeOperation='source-over';
        ctx.globalAlpha=gAlpha*0.12*(1-smokeAge);
        ctx.fillStyle=`rgba(90,75,60,1)`;
        ctx.beginPath();ctx.arc(smokeX,smokeY,gSize*0.5+smokeAge*1.5,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }

    // GLOW HALOS — these use 'lighter' (additive), separate from dot
    // postMirrorBoost makes dancers POP after mirror darkness events
    const pmb=1+postMirrorBoost;
    ctx.save();ctx.globalCompositeOperation='lighter';
    // Outer halo
    ctx.globalAlpha=a*0.15*pmb;
    const gr2=ctx.createRadialGradient(px,py,0,px,py,this.r*14);
    gr2.addColorStop(0,hsl(this.hue,70,65,0.25));
    gr2.addColorStop(0.4,hsl(this.hue-10,55,45,0.06));
    gr2.addColorStop(1,hsl(this.hue,50,35,0));
    ctx.fillStyle=gr2;ctx.beginPath();ctx.arc(px,py,this.r*14,0,Math.PI*2);ctx.fill();
    // Inner halo
    ctx.globalAlpha=a*0.25*pmb;
    const gr=ctx.createRadialGradient(px,py,0,px,py,this.r*6);
    gr.addColorStop(0,hsl(this.hue+10,65,78,0.4));
    gr.addColorStop(1,hsl(this.hue,55,50,0));
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,this.r*6,0,Math.PI*2);ctx.fill();
    ctx.restore();

    // DOT — normal compositing, NOT lighter
    ctx.save();ctx.globalAlpha=a;
    ctx.translate(px,py);ctx.rotate(moveAngle);ctx.scale(stretchX*this.ds,stretchY*this.ds);
    ctx.fillStyle=hsl(this.hue,70,62,1);
    ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();
    // Hot core
    ctx.globalAlpha=a*0.6;ctx.fillStyle=hsl(this.hue+15,35,90,1);
    ctx.beginPath();ctx.arc(0,0,this.r*0.35,0,Math.PI*2);ctx.fill();
    ctx.restore();
    this.ds+=(1-this.ds)*0.08;
  }
}

// ============================================================
// MERGED ANIMATE — all 4 layers composited with z-ordering
// ============================================================
function animate(){
  const song=document.getElementById('song');
  if(!started||song.paused)return requestAnimationFrame(animate);
  const t=song.currentTime;
  const e=SC(E,t),eb=SC(EB,t),em=SC(EM,t),eh=SC(EH,t);
  const br=SC(B,t),pi=SC(P,t),tn=SC(T,t),ed=SC(ED,t);

  // L3: update device state
  updateMotionState();
  updateBinauralPan();

  // Bloom
  const bt=Math.min(e*1.2,1);
  if(bt>bloom)bloom+=(bt-bloom)*0.06;else bloom+=(bt-bloom)*0.012;

  // Decays
  flashBurnAlpha*=0.75;heatBloomAlpha*=0.9;heatBloomR+=2;canvasWarpAmount*=0.88;
  if(mirrorDark<0.01)postMirrorBoost*=0.97;

  ctx.clearRect(0,0,W,HT);

  // ---- CANVAS WARP (wraps whole frame) ----
  const warpActive=canvasWarpAmount>0.002;
  if(warpActive){ctx.save();ctx.translate(cx,cy);ctx.scale(1+canvasWarpAmount*0.08,1+canvasWarpAmount*0.08);ctx.translate(-cx,-cy)}

  // ---- Z1: BACKGROUND (L2) ----
  initBurnMap();
  const bgBright=0.02+e*0.025;
  ctx.fillStyle=hsl(BINDU_HUE,15,bgBright*100+2,1);
  ctx.fillRect(0,0,W,HT);

  // ---- Z2: BURN MAP (L2) ----
  updateBurnMap(e);
  if(e>0.1)addHeatAt(bindu.x,bindu.y,e*0.06);
  renderBurnMap();

  // Ambient haptics from burn map
  let totalHeat=0;for(let i=0;i<burnHeat.length;i++)totalHeat+=burnHeat[i];
  ambientCrackle(totalHeat);

  // ---- MIRROR DARKNESS (L2+L4 combined) ----
  // Automatic triggers from tonal/energy
  if(tn<-0.1&&mirrorTarget<0.3)mirrorTarget=DARK_RATIO*0.4;
  if(e>0.4&&SC(E,t-2)<0.15)mirrorTarget=DARK_RATIO*0.6;
  // Mirror word triggers
  for(const mw of mirrorWords){
    if(t>=mw.t&&!mw.fired){mw.fired=true;activeMirrorWord=mw;mirrorTarget=DARK_RATIO}
  }
  if(mirrorTarget>mirrorDark)mirrorDark+=(mirrorTarget-mirrorDark)*0.08;
  else mirrorDark+=(mirrorTarget-mirrorDark)*0.03;
  mirrorTarget*=0.96;
  if(mirrorDark>0.01){ctx.save();ctx.globalAlpha=mirrorDark;ctx.fillStyle='#000';ctx.fillRect(0,0,W,HT);ctx.restore();postMirrorBoost=0.4}

  // Mirror word DOM rendering
  if(activeMirrorWord){
    const elapsed=t-activeMirrorWord.t;const dur=activeMirrorWord.dur;
    if(elapsed<dur){
      let alpha=1;if(elapsed<0.3)alpha=elapsed/0.3;else if(elapsed>dur-0.5)alpha=(dur-elapsed)/0.5;
      document.getElementById('mirrorWord').textContent=activeMirrorWord.word;
      document.getElementById('mirrorWord').style.color=hsl(BINDU_HUE,50,70,alpha*0.6);
    }else{document.getElementById('mirrorWord').style.color='rgba(255,200,100,0)';activeMirrorWord=null}
  }

  // ---- FIRST IGNITION at drop 1 (L2) ----
  if(!firstIgnitionFired&&t>=DROPS[0].t){
    firstIgnitionFired=true;
    for(let ring=0;ring<8;ring++){
      setTimeout(()=>{const r=maxR*(0.05+ring*0.08);const nPts=12+ring*4;for(let p=0;p<nPts;p++){const a=Math.PI*2*p/nPts;addHeatRadius(cx+Math.cos(a)*r,cy+Math.sin(a)*r,0.6-ring*0.05,burnCellW*2)}},ring*80);
    }
    spawnCombustionRing(cx,cy,1.0);setTimeout(()=>spawnCombustionRing(cx,cy,0.8),150);setTimeout(()=>spawnCombustionRing(cx,cy,0.6),300);
    spawnSparks(cx,cy,30,1.0);flashBurnAlpha=1.0;
  }

  // BACKDRAFTS at drops (L2+L3)
  for(let di=0;di<DROPS.length;di++){
    if(!dropsTriggered[di]&&t>=DROPS[di].t){
      dropsTriggered[di]=true;backdraft();flashBurnAlpha=1;
      spawnCombustionRing(cx,cy,1);spawnSparks(bindu.x,bindu.y,20,0.9);
      backdraftHaptic();
    }
  }

  // ---- PROCESS HITS (combined L1+L2+L3) ----
  while(hi<H.length&&t>=H[hi].t){
    const h=H[hi];
    if(t-h.t<0.4){
      // L1: rings, particles, dancer impact, gaia
      spawnRing(h.i,bindu.x,bindu.y);
      bindu.ds=1+h.i*0.8;
      if(bloom>0.3&&h.i>0.3)spawnParticles(bindu.x,bindu.y,Math.floor(h.i*12),BINDU_HUE,h.i);
      if(h.i>0.3&&eb>0.2&&gaia.p>0.1)spawnGaiaRing(gaia.x,gaia.y,h.i*eb);
      // L2: burn map, warp, flash, combustion, flare, sparks, firebrands
      if(h.i>0.3){heatBloomAlpha=h.i*0.5;heatBloomR=10;addHeatRadius(bindu.x,bindu.y,h.i*0.3,maxR*h.i*0.3)}
      if(h.i>0.5)canvasWarpAmount+=h.i*0.15;
      if(h.i>0.7)flashBurnAlpha=Math.max(flashBurnAlpha,h.i*0.5);
      if(h.i>0.55)spawnCombustionRing(bindu.x,bindu.y,h.i);
      if(h.i>0.75)spawnFlareEruption(bindu.x,bindu.y,h.i);
      if(h.i>0.25&&bloom>0.2)spawnSparks(bindu.x,bindu.y,Math.floor(h.i*10),h.i);
      if(h.i>0.5){const nBrands=Math.floor(h.i*4);for(let b=0;b<nBrands;b++)addHeatAt(Math.random()*W,Math.random()*HT,h.i*0.15)}
      // L3: haptics
      if(h.i>0.2)fireHaptic(h.i);
    }
    hi++;
  }

  // ---- ORGANISM LAYER (bass pulse) ----
  const bassPulse=eb*0.05;
  const orgActive=bassPulse>0.005;
  if(orgActive){ctx.save();ctx.translate(cx,cy);ctx.scale(1+bassPulse,1+bassPulse);ctx.translate(-cx,-cy)}

  // Vignette
  const vigR=Math.max(W,HT)*(0.55+e*0.35);
  const vig=ctx.createRadialGradient(cx,cy,vigR*0.25,cx,cy,vigR);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,`rgba(0,0,0,${0.25+bloom*0.15})`);
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,HT);

  // ---- Z3: L2 IMPACTS BEHIND DANCERS ----
  // Gaia impact rings (L1)
  for(let i=gaiaRings.length-1;i>=0;i--){
    const gr=gaiaRings[i];gr.r+=gr.spd/60;const life=gr.r/gr.mr;
    if(life>=1){gaiaRings.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=gr.op*(1-life)*(1+postMirrorBoost);ctx.strokeStyle=hsl(20,55,50,1);ctx.lineWidth=gr.lw*(1-life);
    ctx.beginPath();ctx.arc(gr.x,gr.y,gr.r,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  // Combustion rings (L2)
  for(let i=combRings.length-1;i>=0;i--){
    const cr=combRings[i];cr.r+=cr.spd;const life=cr.r/cr.mr;
    if(life>=1){combRings.splice(i,1);continue}
    if(life<0.7){const nPts=8;for(let p=0;p<nPts;p++){const a=Math.PI*2*p/nPts;addHeatAt(cr.x+Math.cos(a)*cr.r,cr.y+Math.sin(a)*cr.r,0.08*(1-life))}}
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=cr.op*(1-life)*(1+postMirrorBoost);
    ctx.strokeStyle=hsl(BINDU_HUE+life*20,72,52,1);ctx.lineWidth=2.5*(1-life);
    ctx.beginPath();const sg=28;for(let s=0;s<=sg;s++){const a2=(s/sg)*Math.PI*2;const wobble=1+Math.sin(a2*5+t*3)*0.1*(1-life);ctx.lineTo(cr.x+Math.cos(a2)*cr.r*wobble,cr.y+Math.sin(a2)*cr.r*wobble)}
    ctx.stroke();ctx.restore();
  }
  // Flare eruptions (L2)
  for(let i=flareEruptions.length-1;i>=0;i--){
    const fl=flareEruptions[i];if(fl.len<fl.maxLen)fl.len+=fl.spd;else fl.life-=0.03;
    if(fl.life<=0){flareEruptions.splice(i,1);continue}
    const tipX=fl.x+Math.cos(fl.angle)*fl.len,tipY=fl.y+Math.sin(fl.angle)*fl.len;
    addHeatAt(tipX,tipY,0.12*fl.life);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=fl.life*0.25*fl.intensity*(1+postMirrorBoost);
    const flGrad=ctx.createLinearGradient(fl.x,fl.y,tipX,tipY);flGrad.addColorStop(0,hsl(BINDU_HUE,72,68,1));flGrad.addColorStop(0.7,hsl(BINDU_HUE+20,58,52,1));flGrad.addColorStop(1,hsl(10,45,35,0));
    ctx.strokeStyle=flGrad;ctx.lineWidth=3+fl.intensity*4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(fl.x,fl.y);ctx.quadraticCurveTo(fl.x+Math.cos(fl.angle+0.3)*fl.len*0.5,fl.y+Math.sin(fl.angle+0.3)*fl.len*0.5,tipX,tipY);ctx.stroke();ctx.restore();
  }
  // Heat bloom (L2)
  if(heatBloomAlpha>0.02){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=heatBloomAlpha*0.25*(1+postMirrorBoost);
    const hbG=ctx.createRadialGradient(bindu.x,bindu.y,0,bindu.x,bindu.y,heatBloomR);
    hbG.addColorStop(0,hsl(48,30,88,0.4));hbG.addColorStop(0.3,hsl(BINDU_HUE,62,58,0.25));hbG.addColorStop(1,hsl(10,48,28,0));
    ctx.fillStyle=hbG;ctx.beginPath();ctx.arc(bindu.x,bindu.y,heatBloomR,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // ---- RESET TO source-over BEFORE dancers ----
  ctx.globalCompositeOperation='source-over';

  // ---- Z4: ENSEMBLE POSITIONS (L1 + L3 gyro + L4 word params) ----
  const gyroX=gyroActive?(gyroGamma||0)/45*maxR*0.25*wp.fluidity:0;
  const gyroY=gyroActive?((gyroBeta||0)-45)/45*maxR*0.2*wp.fluidity:0;

  // Bindu — center, ignition point
  bindu.ty=cy+Math.sin(t*0.35)*maxR*0.18-(pi-0.5)*maxR*0.2+gyroY;
  bindu.tx=cx+Math.cos(t*0.28)*maxR*0.15+Math.sin(t*0.7)*eh*maxR*0.08+gyroX;
  bindu.x+=(bindu.tx-bindu.x)*0.05;bindu.y+=(bindu.ty-bindu.y)*0.05;

  // Gaia
  gaia.tp=bloom>0.1?Math.min((bloom-0.1)/0.12,1):0;
  gaia.tx=cx+Math.sin(t*0.32)*maxR*0.95*eb+Math.cos(t*0.18)*maxR*0.4+gyroX;
  gaia.ty=cy+HT*0.12+Math.sin(t*0.15)*maxR*0.12+eb*maxR*0.15+gyroY;
  gaia.x+=(gaia.tx-gaia.x)*0.05;gaia.y+=(gaia.ty-gaia.y)*0.05;
  gaia.p+=(gaia.tp-gaia.p)*0.04;gaia.r=5.5+eb*4.5;

  // Sid
  sid.tp=bloom>0.18?Math.min((bloom-0.18)/0.12,1):0;
  sid.oA+=0.012+e*0.006;
  sid.tx=cx+Math.cos(sid.oA)*maxR*0.65+gyroX;sid.ty=cy+Math.sin(sid.oA)*maxR*0.55+gyroY;
  sid.x+=(sid.tx-sid.x)*0.04;sid.y+=(sid.ty-sid.y)*0.04;sid.p+=(sid.tp-sid.p)*0.04;

  // Arch
  arch.tp=bloom>0.25?Math.min((bloom-0.25)/0.12,1):0;
  arch.tx=cx-(bindu.x-cx)*1.6+Math.sin(t*0.5)*maxR*0.2+gyroX;
  arch.ty=cy-(bindu.y-cy)*0.9+Math.cos(t*0.4)*em*maxR*0.25+gyroY;
  arch.x+=(arch.tx-arch.x)*0.06;arch.y+=(arch.ty-arch.y)*0.06;
  arch.p+=(arch.tp-arch.p)*0.04;arch.r=5+em*3.5;

  // Karishma
  const kE=Math.max(0,1-e*1.3);karishma.tp=kE;
  karishma.tx=cx+Math.sin(t*0.2)*maxR*0.85*kE+Math.cos(t*0.13)*maxR*0.35+gyroX;
  karishma.ty=cy+Math.cos(t*0.17)*maxR*0.6*kE-maxR*0.1+gyroY;
  karishma.x+=(karishma.tx-karishma.x)*0.03;karishma.y+=(karishma.ty-karishma.y)*0.03;
  karishma.p+=(karishma.tp-karishma.p)*0.025;karishma.r=4.5+kE*5.5;

  // Sakshi
  sakshi.tp=bloom>0.3?Math.min((bloom-0.3)/0.15,1):0;
  sakshi.tx=cx+Math.cos(t*0.09)*maxR*1.05+gyroX;sakshi.ty=cy+Math.sin(t*0.07)*maxR*0.85+gyroY;
  sakshi.x+=(sakshi.tx-sakshi.x)*0.02;sakshi.y+=(sakshi.ty-sakshi.y)*0.02;sakshi.p+=(sakshi.tp-sakshi.p)*0.025;

  // Ashrey
  ashrey.tp=bloom>0.6?Math.min((bloom-0.6)/0.15,1):0;
  let ax=0,ay=0,n=0;for(const d2 of AD){if(d2!==ashrey&&d2.p>0.1){ax+=d2.x;ay+=d2.y;n++}}
  if(n>0){ashrey.tx=ax/n;ashrey.ty=ay/n}
  ashrey.x+=(ashrey.tx-ashrey.x)*0.03;ashrey.y+=(ashrey.ty-ashrey.y)*0.03;
  ashrey.p+=(ashrey.tp-ashrey.p)*0.02;ashrey.hue=(t*12)%360;

  // ---- FIRE RETURN (L1) ----
  const timeToEnd=DUR-t;
  if(timeToEnd<RETURN_START){
    const rt=Math.min(timeToEnd,RETURN_START);const progress=1-rt/RETURN_START;
    for(const d2 of AD){if(d2!==bindu){d2.hue=d2.hue*(1-progress*0.8)+5*progress*0.8;d2.x+=(d2.tx-d2.x)*0.04*(1-progress*0.7);d2.y+=(d2.ty-d2.y)*0.04*(1-progress*0.7)}}
    if(rt<16)ashrey.tp=Math.min(ashrey.tp,Math.max(0,rt-3)/13);
    if(rt<14)sakshi.tp=Math.min(sakshi.tp,Math.max(0,rt-3)/11);
    if(rt<11)arch.tp=Math.min(arch.tp,Math.max(0,rt-3)/8);
    if(rt<9)sid.tp=Math.min(sid.tp,Math.max(0,rt-3)/6);
    if(rt<7)gaia.tp=Math.min(gaia.tp,Math.max(0,rt-3)/4);
    if(rt<5)karishma.tp=Math.min(karishma.tp,Math.max(0,rt-3)/2);
    if(progress>0.6){const bf=(progress-0.6)/0.4;bindu.r=7*(1-bf*0.5);bindu.hue=BINDU_HUE*(1-bf)+5*bf}
    if(rt<4)bindu.tp=Math.min(bindu.tp,rt/4);
    // Force all dancers to zero at rt<3
    if(rt<3){for(const d2 of AD){d2.tp=0;d2.p*=0.85}}
    // L2: burn map fuel drain
    for(let i=0;i<burnFuel.length;i++)burnFuel[i]=Math.max(0,burnFuel[i]-0.003*progress);
  }

  // Update ghosts
  for(const d2 of AD)d2.updateGhost();

  // ---- Z4: DRAW ALL DANCERS (source-over) ----
  for(const d2 of AD)d2.draw(t,e,ed,tn);

  // ---- Z4: SACRED GEOMETRY (L1) ----
  // Fire orbital rings (S2+)
  if(bloom>0.25){
    orbitalBase+=0.003+e*0.008;const nRings=Math.min(Math.floor((bloom-0.25)*12),5);const orbAlpha=(bloom-0.25)*0.6*(1+postMirrorBoost);
    for(let i=0;i<nRings;i++){
      const r=maxR*(0.08+i*0.08)*(0.5+e*0.5);const rot=orbitalBase*(1+i*0.3)*(i%2?-1:1);const arcLen=Math.PI*(0.3+bloom*0.5);const segs=3+i;
      ctx.save();ctx.globalAlpha=orbAlpha*(0.4+i*0.12);ctx.strokeStyle=hsl(BINDU_HUE+i*12,55,55+bloom*15,1);ctx.lineWidth=0.8+bloom*1.2;
      for(let s=0;s<segs;s++){const segA=rot+s*(Math.PI*2/segs);ctx.beginPath();ctx.arc(bindu.x,bindu.y,r,segA,segA+arcLen/segs);ctx.stroke()}ctx.restore();
    }
  }
  // Fire radial rays (S3+)
  if(bloom>0.45){
    const rayAlpha=(bloom-0.45)*0.7*eb*(1+postMirrorBoost);const nRays=12;const rayLen=maxR*(0.3+eb*0.5);
    ctx.save();for(let i=0;i<nRays;i++){
      const a=Math.PI*2*i/nRays+t*0.08;const pulse=1+Math.sin(t*3+i*0.7)*0.3;const len=rayLen*pulse;const flicker=0.7+Math.sin(t*8+i*2.1)*0.3;
      const grad=ctx.createLinearGradient(bindu.x,bindu.y,bindu.x+Math.cos(a)*len,bindu.y+Math.sin(a)*len);
      grad.addColorStop(0,hsl(BINDU_HUE+5,60,65,rayAlpha*flicker));grad.addColorStop(0.6,hsl(BINDU_HUE-5,55,50,rayAlpha*flicker*0.5));grad.addColorStop(1,hsl(BINDU_HUE-10,45,40,0));
      ctx.strokeStyle=grad;ctx.lineWidth=1.5+eb*3;ctx.globalAlpha=1;ctx.beginPath();ctx.moveTo(bindu.x,bindu.y);
      ctx.quadraticCurveTo(bindu.x+Math.cos(a)*len*0.5+Math.sin(t*4+i)*maxR*0.008,bindu.y+Math.sin(a)*len*0.5+Math.cos(t*5+i)*maxR*0.008,bindu.x+Math.cos(a)*len,bindu.y+Math.sin(a)*len);ctx.stroke();
    }ctx.restore();
  }
  // Flame tongues (S3+)
  if(bloom>0.4&&eb>0.15){
    const nTongues=Math.min(Math.floor((bloom-0.4)*10),5);
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<nTongues;i++){
      const baseA=Math.PI*2*i/nTongues+t*0.06+Math.PI/nTongues;
      const baseX=bindu.x+Math.cos(baseA)*maxR*0.06,baseY=bindu.y+Math.sin(baseA)*maxR*0.06;
      const height=maxR*(0.1+eb*0.35+Math.sin(t*2.2+i*1.7)*0.08);
      ctx.globalAlpha=(bloom-0.4)*0.3*(0.2+eb*0.4)*(1+postMirrorBoost);ctx.strokeStyle=hsl(BINDU_HUE+i*8,72,50+bloom*15,1);ctx.lineWidth=1+bloom*2;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(baseX,baseY);
      for(let s=1;s<=10;s++){const p=s/10;ctx.lineTo(baseX+Math.sin(t*3.5+i*2.5+s*0.8)*maxR*0.03*p+Math.cos(t*4.3+i*1.3+s*1.2)*maxR*0.02*p,baseY-height*p)}ctx.stroke();
    }ctx.restore();
  }
  // Crown mandala (S4: bloom>0.7)
  if(bloom>0.7){
    const crAlpha=(bloom-0.7)*1.5*(1+postMirrorBoost);const crR=maxR*(0.4+bloom*0.25);
    ctx.save();
    ctx.globalAlpha=crAlpha*0.25;ctx.strokeStyle=hsl(BINDU_HUE,40,68,1);ctx.lineWidth=0.7;ctx.beginPath();ctx.arc(bindu.x,bindu.y,crR,0,Math.PI*2);ctx.stroke();
    // 6 triangles
    ctx.globalAlpha=crAlpha*0.18;ctx.strokeStyle=hsl(BINDU_HUE+10,45,62,1);ctx.lineWidth=0.6;
    const triRot=t*0.12;for(let i=0;i<6;i++){const a=triRot+Math.PI*2*i/6;ctx.beginPath();for(let v=0;v<3;v++){const va=a+Math.PI*2*v/3;const x=bindu.x+Math.cos(va)*crR*0.9,y=bindu.y+Math.sin(va)*crR*0.9;v===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.closePath();ctx.stroke()}
    // 8 petals
    ctx.globalAlpha=crAlpha*0.14;ctx.strokeStyle=hsl(BINDU_HUE-5,50,55,1);
    const petalRot=-t*0.06;for(let i=0;i<8;i++){const a=petalRot+Math.PI*2*i/8;const pr=crR*0.6;ctx.beginPath();ctx.arc(bindu.x+Math.cos(a)*pr*0.5,bindu.y+Math.sin(a)*pr*0.5,pr*0.5,a-Math.PI/3,a+Math.PI/3);ctx.stroke()}
    // Inner ring + nodes
    ctx.globalAlpha=crAlpha*0.22;ctx.strokeStyle=hsl(BINDU_HUE+5,42,65,1);const irR=crR*0.5;ctx.beginPath();ctx.arc(bindu.x,bindu.y,irR,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<12;i++){const na=t*0.04+Math.PI*2*i/12;ctx.globalAlpha=crAlpha*0.3;ctx.fillStyle=hsl(BINDU_HUE+10,50,75,1);ctx.beginPath();ctx.arc(bindu.x+Math.cos(na)*irR,bindu.y+Math.sin(na)*irR,1.5+bloom*0.5,0,Math.PI*2);ctx.fill()}
    // Solar corona
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<8;i++){
      const a2=Math.PI*2*i/8+t*0.05;const arcH=maxR*(0.08+Math.sin(t*0.8+i*2.3)*0.12+eb*0.18);
      ctx.globalAlpha=crAlpha*0.1;ctx.strokeStyle=hsl(BINDU_HUE+i*5,65,52+bloom*15,1);ctx.lineWidth=0.6+bloom;
      ctx.beginPath();for(let s=0;s<=8;s++){const sp2=s/8;const sa=a2-0.15+sp2*0.3;const sr=crR+arcH*Math.sin(sp2*Math.PI)*(1+Math.sin(t*2.5+i+s*0.5)*0.2);ctx.lineTo(bindu.x+Math.cos(sa)*sr,bindu.y+Math.sin(sa)*sr)}ctx.stroke();
    }
    ctx.restore();
  }

  // ---- Z5: ON-TOP EFFECTS ----
  // L2 sparks (seed burn map + render above dancers)
  for(let i=sparks.length-1;i>=0;i--){
    const sp=sparks[i];sp.x+=sp.vx;sp.y+=sp.vy;sp.vy+=0.06;sp.vx*=0.99;sp.life-=sp.decay;
    if(sp.life<=0||sp.y>HT+10){sparks.splice(i,1);continue}
    if(sp.vy>0&&sp.life<0.3)addHeatAt(sp.x,sp.y,0.015);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=sp.life*0.45*(1+postMirrorBoost);
    ctx.fillStyle=hsl(sp.hue+sp.life*25,68,58+sp.life*22,1);ctx.beginPath();ctx.arc(sp.x,sp.y,sp.r*sp.life,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  // L1 particles
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.06;pt.vx*=0.99;pt.life-=pt.decay;
    if(pt.life<=0||pt.y>HT+10){particles.splice(i,1);continue}
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=pt.life*0.5;
    ctx.fillStyle=hsl(pt.hue+pt.life*25,70,60+pt.life*25,1);ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r*pt.life,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // Expanding hit rings (L1)
  for(let i=rings.length-1;i>=0;i--){
    const rn=rings[i];rn.r+=rn.spd/60;const life=rn.r/rn.mr;
    if(life>=1){rings.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=rn.op*(1-life*life)*(1+postMirrorBoost);ctx.strokeStyle=hsl(BINDU_HUE,60,55+bloom*20,1);ctx.lineWidth=rn.lw*(1-life*0.6);
    ctx.beginPath();const sg=36;for(let s=0;s<=sg;s++){const a2=(s/sg)*Math.PI*2;const wobble=1+Math.sin(a2*4+t*2)*0.03*(1-life);ctx.lineTo(rn.x+Math.cos(a2)*rn.r*wobble,rn.y+Math.sin(a2)*rn.r*wobble)}
    ctx.stroke();ctx.restore();
  }

  // Ashrey web (L1)
  if(ashrey.p>0.1){
    const viD=AD.filter(d2=>d2.p>0.1&&d2!==ashrey);
    for(let i=0;i<viD.length;i++){for(let j=i+1;j<viD.length;j++){
      const d1=viD[i],d22=viD[j];const dist=Math.hypot(d1.x-d22.x,d1.y-d22.y);
      if(dist<maxR*1.5){const wa=ashrey.p*0.12*(1-dist/(maxR*1.5))*(1+postMirrorBoost);
        ctx.save();ctx.globalAlpha=wa;const wg=ctx.createLinearGradient(d1.x,d1.y,d22.x,d22.y);wg.addColorStop(0,hsl(d1.hue||BINDU_HUE,40,60,1));wg.addColorStop(1,hsl(d22.hue||BINDU_HUE,40,60,1));
        ctx.strokeStyle=wg;ctx.lineWidth=0.7;ctx.beginPath();ctx.moveTo(d1.x,d1.y);ctx.lineTo(d22.x,d22.y);ctx.stroke();
        ctx.globalAlpha=wa*0.6;ctx.fillStyle=hsl(ashrey.hue,40,70,1);ctx.beginPath();ctx.arc((d1.x+d22.x)/2,(d1.y+d22.y)/2,1.5,0,Math.PI*2);ctx.fill();ctx.restore();
      }
    }}
  }

  // Resonance flashes (L1)
  for(let i=0;i<AD.length;i++){for(let j=i+1;j<AD.length;j++){
    if(AD[i].p>0.1&&AD[j].p>0.1){const dist=Math.hypot(AD[i].x-AD[j].x,AD[i].y-AD[j].y);
      if(dist<maxR*0.08){const mx2=(AD[i].x+AD[j].x)/2,my2=(AD[i].y+AD[j].y)/2;
        ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.35*(1+postMirrorBoost);
        const rg=ctx.createRadialGradient(mx2,my2,0,mx2,my2,maxR*0.06);rg.addColorStop(0,hsl(BINDU_HUE+15,50,85,0.5));rg.addColorStop(1,hsl(BINDU_HUE,50,65,0));
        ctx.fillStyle=rg;ctx.beginPath();ctx.arc(mx2,my2,maxR*0.06,0,Math.PI*2);ctx.fill();ctx.restore();
      }
    }
  }}

  // ---- Z6: BINDU MEMORY constellation (L4) ----
  if(binduMemory.length>0){
    ctx.globalCompositeOperation='source-over';
    for(let i=0;i<binduMemory.length;i++){
      const m=binduMemory[i];const pos=wordToPosition(m.word);
      const count=binduMemory.filter(b=>b.word.toLowerCase()===m.word.toLowerCase()).length;
      const brightness=0.2+Math.min(count*0.15,0.6);const sz=1.5+count*0.5;
      ctx.save();ctx.globalAlpha=0.3*brightness;ctx.fillStyle=hsl(BINDU_HUE,60,50+brightness*30,1);
      ctx.beginPath();ctx.arc(pos.x*W,pos.y*HT,sz,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }

  // FLASH-BURN on very top (L2)
  if(flashBurnAlpha>0.02){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=flashBurnAlpha*0.6;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,HT);ctx.restore();
  }

  // ---- RESTORE organism + warp ----
  if(orgActive)ctx.restore();
  if(warpActive)ctx.restore();

  // ---- L4: WORD REVEAL at PEAK_T ----
  if(t>=PEAK_T&&!wordRevealed){wordRevealed=true;document.getElementById('wordReveal').textContent=userWord;document.getElementById('wordReveal').classList.add('visible');setTimeout(()=>{document.getElementById('wordReveal').classList.add('dissolve')},4000)}

  // ---- L4: I LOVE YOU ----
  if(t>PEAK_T+5&&!loveShown){loveShown=true;document.getElementById('loveText').classList.add('visible')}

  // ---- L4: FRUIT ----
  if(timeToEnd<2&&!fruitShown){
    fruitShown=true;
    // Kill all dancers — fruit needs clear canvas
    for(const d2 of AD){d2.p=0;d2.tp=0}
    // Fade binaural
    fadeBinaural(false);
    const w=userWord;const dwell=Math.round((Date.now()-wordStartTime)/1000*10)/10;const echo=getMostRepeated();
    let dwellMsg='';if(dwell<1.5)dwellMsg='You knew immediately.';else if(dwell<5)dwellMsg='You waited.';else dwellMsg='You searched before you could name it.';
    const countMsg=danceCount===0?'This is your first dance.':`This is your ${danceCount+1}${danceCount===0?'st':danceCount===1?'nd':danceCount===2?'rd':'th'} dance.`;
    const echoMsg=echo&&echo!==w.toLowerCase()?` You keep returning to \u201C${echo}.\u201D`:'';
    const motionMsg=motionLabel==='still'?'You were still.':motionLabel==='swaying'?'You were swaying.':'You were moving.';
    let crossMsg='';if(prevDanceWord)crossMsg=` The water held \u201C${prevDanceWord}.\u201D The fire transformed it into \u201C${w}.\u201D`;
    document.getElementById('fruitText').innerHTML=`You gave this fire \u201C${w}.\u201D It burned through everything that wasn\u2019t that. What\u2019s left is what couldn\u2019t be destroyed \u2014 and it\u2019s still warm. ${dwellMsg} ${motionMsg} ${countMsg}${echoMsg}${crossMsg}`;
    saveToBinduMemory(w,dwell,motionLabel);
    try{localStorage.setItem('tol-manipura-dance','true');localStorage.setItem('tol-manipura-dance-word',w)}catch(ex){}
    setTimeout(()=>{document.getElementById('fruitOverlay').style.background=hsl(BINDU_HUE,30,4,1);document.getElementById('fruitOverlay').classList.add('visible')},2500);
  }

  requestAnimationFrame(animate);
}

// START — go() function (L4 with L3 init)
// ============================================================
function go(){
  if(started)return;
  const wi=document.getElementById('wordInput');
  userWord=wi.value.trim();
  if(!userWord){wi.focus();return}
  started=true;wi.blur();wordStartTime=Date.now();
  wp=wordParams(userWord);setupMirrorWords(userWord);

  try{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}
  initGyro();initAccel();startBinaural();

  document.getElementById('wi').classList.remove('visible');
  document.getElementById('so').classList.add('hidden');
  clearTimeout(seedTimer);

  const song=document.getElementById('song');song.volume=0;
  setTimeout(()=>{
    song.play().then(()=>{
      function waitForAudio(){
        if(song.currentTime>0){
          hi=0;while(hi<H.length&&H[hi].t<song.currentTime-0.05)hi++;
          let v=0;const fi=setInterval(()=>{v=Math.min(v+0.01,0.8);song.volume=v;if(v>=0.8)clearInterval(fi)},50);
          fadeBinaural(true);
          requestAnimationFrame(animate);
        }else requestAnimationFrame(waitForAudio);
      }
      waitForAudio();
    }).catch(console.error);
  },3000);

  (async()=>{try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}})();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')try{navigator.wakeLock.request('screen').then(w=>{wakeLock=w})}catch(e){}});
}

setTimeout(()=>document.getElementById('wi').classList.add('visible'),SEED.length*857+1500);
document.addEventListener('touchend',e=>{if(!started&&document.getElementById('wi').classList.contains('visible'))go()},{passive:true});
document.addEventListener('click',()=>{if(!started&&document.getElementById('wi').classList.contains('visible'))go()});
document.getElementById('wordInput').addEventListener('keydown',e=>{if(e.key==='Enter')go()});

</script>
