<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>A Strange Game · The Tree of Life</title>
<meta name="description" content="A Strange Game · The Tree of Life" />
<meta http-equiv="refresh" content="3;url=the-welcome.html" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400&display=swap" rel="stylesheet" />

<style>
/* ═══════════════════════════════════════════════════════════
   GATEWAY · aistrangegame.com/tree-of-life/

   The invisible front door. The experiencer never stays here.
   Routes based on bindu-essence presence:
     - No essence → the-welcome.html (Mind door)
     - Essence present → the-road-home.html (Body door)

   A brief atmospheric hold (Bindu breathing in dark) prevents
   jarring white-flash before the redirect.
   ═══════════════════════════════════════════════════════════ */

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #100a08;
  color: rgba(240, 226, 188, 0.82);
  font-family: 'Lora', serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px;
}
.gateway-bindu {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #e8c568;
  box-shadow: 0 0 18px rgba(232, 197, 104, 0.4);
  margin-bottom: 28px;
  opacity: 0;
  animation: binduBreath 4s ease-in-out infinite, gatewayFadeIn 0.6s ease forwards;
}
@keyframes binduBreath {
  0%, 100% { opacity: 0.7; transform: scale(1.0); }
  50%      { opacity: 1.0; transform: scale(1.08); }
}
@keyframes gatewayFadeIn {
  to { opacity: 1; }
}
.gateway-line {
  font-style: italic;
  font-size: 20px;
  text-align: center;
  line-height: 1.6;
  opacity: 0;
  animation: gatewayFadeIn 0.8s ease 0.4s forwards;
  max-width: 480px;
}
noscript {
  font-style: italic;
  font-size: 16px;
  margin-top: 24px;
  color: rgba(240, 226, 188, 0.62);
  text-align: center;
}
noscript a {
  color: #c9a84c;
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="gateway-bindu" aria-hidden="true"></div>
<p class="gateway-line">One moment.</p>

<noscript>
  <p>This experience requires JavaScript. <a href="the-welcome.html">Continue to The Welcome</a>.</p>
</noscript>

<script>
(function() {
  'use strict';

  function hasEssence() {
    try {
      var raw = localStorage.getItem('bindu-essence');
      if (!raw) return false;
      var e = JSON.parse(raw);
      return !!(e && e.name && e.dateOfBirth && e.higherSelfName);
    } catch (err) { return false; }
  }

  var destination = hasEssence() ? 'the-road-home.html' : 'the-welcome.html';

  // Brief atmospheric hold (800ms) before redirect — prevents jarring flash
  // and lets the Bindu + "One moment" settle into the experiencer's view.
  setTimeout(function() {
    window.location.replace(destination);
  }, 800);
})();
</script>

</body>
</html>
