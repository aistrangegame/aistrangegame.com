function updateShape(t,e,bass){

    if(s.trigger==='drop'){for(const d of DROPS){if(Math.abs(t-d.t)<0.3&&d.intensity>0.4)triggered=true}}
    if(s.trigger==='valley'&&e<0.15&&valleyTimer>3)triggered=true;
    if(s.trigger==='return'&&t>DUR-RETURN_START-3)triggered=true;
    if(s.trigger==='custom'&&s.triggerT&&Math.abs(t-s.triggerT)<0.5)triggered=true;
    if(triggered){activeShape=s;shapeStartT=t;shapeAngle=0;break}}}
  if(e<0.15)valleyTimer+=0.016;else valleyTimer=0;
  if(activeShape){const elapsed=t-shapeStartT;const s=activeShape;let shouldEnd=false;
    if(s.duration>0&&elapsed>s.duration)shouldEnd=true;if(s.trigger==='valley'&&e>0.25)shouldEnd=true;
    if(shouldEnd){shapeBlend=Math.max(0,shapeBlend-0.02);if(shapeBlend<=0)activeShape=null}
