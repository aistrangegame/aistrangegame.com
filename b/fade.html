function lemniscateXY(t,r){const s=Math.sin(t),c=Math.cos(t),d=1+s*s;return[r*c/d,r*s*c/d]}
function spiralXY(t,r,turns){const progress=t/(Math.PI*2*turns);const radius=r*progress;return[radius*Math.cos(t),radius*Math.sin(t)]}
function roseXY(t,r,petals){const k=petals;const radius=r*Math.cos(k*t);return[radius*Math.cos(t),radius*Math.sin(t)]}
function circleXY(t,r){return[r*Math.cos(t),r*Math.sin(t)]}
const shapeLibrary={heart:heartXY,infinity:lemniscateXY,spiral:(t,r)=>spiralXY(t,r,3),circle:circleXY,flower:(t,r)=>roseXY(t,r,6)};

function updateShape(t,e,bass){
  if(!activeShape){for(const s of SHAPES){let triggered=false;
    if(s.trigger==='peak'&&Math.abs(t-s.triggerT)<0.5)triggered=true;
    if(s.trigger==='drop'){for(const d of DROPS){if(Math.abs(t-d.t)<0.3&&d.intensity>0.4)triggered=true}}
    if(s.trigger==='valley'&&e<0.15&&valleyTimer>3)triggered=true;
    if(s.trigger==='return'&&t>DUR-RETURN_START-3)triggered=true;
    if(s.trigger==='custom'&&s.triggerT&&Math.abs(t-s.triggerT)<0.5)triggered=true;
    if(triggered){activeShape=s;shapeStartT=t;shapeAngle=0;break}}}
  if(e<0.15)valleyTimer+=0.016;else valleyTimer=0;
  if(activeShape){const elapsed=t-shapeStartT;const s=activeShape;let shouldEnd=false;
    if(s.duration>0&&elapsed>s.duration)shouldEnd=true;if(s.trigger==='valley'&&e>0.25)shouldEnd=true;
    if(shouldEnd){shapeBlend=Math.max(0,shapeBlend-0.02);if(shapeBlend<=0)activeShape=null}
    else{const rp=Math.min(1,elapsed/s.rampIn);const tb=s.maxBlend*smoothstep(rp);shapeBlend+=(tb-shapeBlend)*0.04}
    if(activeShape){let speed=s.speed;if(s.speedScale==='energy')speed*=(0.5+e*1.5);if(s.speedScale==='bass')speed*=(0.5+bass*2);
      shapeAngle+=speed*0.016;let r=maxR*s.radius;if(s.radiusScale==='bloom')r*=(0.5+bloom*1.0);if(s.radiusScale==='invert')r*=Math.max(0.01,1-elapsed/(s.duration||1));
      const shapeFn=shapeLibrary[s.type];const[sx,sy]=shapeFn(shapeAngle,r);shapeX=sx;shapeY=sy}}
  else{shapeBlend=Math.max(0,shapeBlend-0.015)}}

function updateMirror(t,e,tension){mirrorTarget=0;
  const tDeriv=tension-prevTension;if(tDeriv<-0.12)mirrorTarget=Math.max(mirrorTarget,Math.min(0.5,Math.abs(tDeriv)*2));
  const thresholds=[0.5,0.7,0.9];for(let i=0;i<3;i++){if(bloom>thresholds[i]&&lastBloomCross[i]===0){lastBloomCross[i]=t;mirrorTarget=Math.max(mirrorTarget,0.4+i*0.1)}if(lastBloomCross[i]>0&&t-lastBloomCross[i]>8)lastBloomCross[i]=-1}
  if(prevE<0.1&&e>0.4)mirrorTarget=Math.max(mirrorTarget,0.6);
  if(Math.abs(t-PEAK_T)<4)mirrorTarget=Math.max(mirrorTarget,0.8*(1-Math.abs(t-PEAK_T)/4));
  if(mirrorTarget>mirrorAlpha)mirrorAlpha+=(mirrorTarget-mirrorAlpha)*0.06;else mirrorAlpha*=0.97;if(mirrorAlpha<0.005)mirrorAlpha=0;
  if(mirrorAlpha>0.1)postMirrorBoost=1;else postMirrorBoost*=0.98;prevTension=tension;prevE=e}

let wakeLock=null;
async function requestWake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&started)requestWake()});

function go(){if(started)return;userWord=wi.value.trim();if(!userWord)return;started=true;
  document.getElementById('song').volume=0;document.getElementById('so').classList.add('h');requestWake();
  const w=userWord;
  document.getElementById('ftx').innerHTML='You gave this song “{w}”.<br><br>Four minutes of {w} building so slowly you almost didn’t notice. Layer after layer, {w} accumulated — not rushing, not forcing, just arriving. And then, in the final breath, everything that wasn’t {w} faded away.<br><br>What’s left isn’t what survived. It’s what was always there, waiting for everything else to stop pretending it mattered more than {w}.'.replace(/\{w\}/g,w);
  document.getElementById('wr').textContent=w;
  const song=document.getElementById('song');
  song.play().then(()=>{function wt(){if(song.currentTime>0){hi=0;while(hi<H.length&&H[hi].t<song.currentTime-0.05)hi++;let v=0;const fi=setInterval(()=>{v=Math.min(v+0.015,0.8);song.volume=v;if(v>=0.8)clearInterval(fi)},50);requestAnimationFrame(anim)}else requestAnimationFrame(wt)}wt()}).catch(er=>console.error(er))}

function anim(){const song=document.getElementById('song');const t=song.currentTime;
  if(t<=0){requestAnimationFrame(anim);return}
  const e=SC(E,t),bass=SC(EB,t),mids=SC(EM,t),highs=SC(EH,t);
  const pitch=SC(P,t),tension=Math.max(0,SC(T,t)),accel=SC(ED,t);
  if(e>bloom)bloom+=(e-bloom)*0.06;else bloom+=(e-bloom)*0.012;
  const s1=Math.max(0,Math.min(1,(bloom-0.1)/0.2)),s2=Math.max(0,Math.min(1,(bloom-0.3)/0.2)),s3=Math.max(0,Math.min(1,(bloom-0.5)/0.2)),s4=Math.max(0,Math.min(1,(bloom-0.7)/0.3));
  sidSm+=(e-sidSm)*0.02;
  dF=0;for(const d of DROPS){const age=t-d.t;if(age>0&&age<2.5)dF=Math.max(dF,(1-age/2.5)*d.intensity)}
  updateMirror(t,e,tension);updateShape(t,e,bass);
  bindu.tp=Math.max(0.3,Math.min(1,bloom*1.5+0.3));gaia.tp=Math.max(0,Math.min(1,(bloom-0.12)/0.15));
  sid.tp=Math.max(0,Math.min(1,(bloom-0.22)/0.15));arch.tp=Math.max(0,Math.min(1,(bloom-0.32)/0.15));
  sakshi.tp=Math.max(0,Math.min(1,(bloom-0.45)/0.2));ashrey.tp=Math.max(0,Math.min(1,(bloom-0.65)/0.2));
  const kT=(e<0.3)?Math.min(1,(0.3-e)/0.25)*0.8:0;kA+=(kT-kA)*0.03;karishma.tp=kA;
  if(t>DUR-RETURN_START){const returnT=DUR-t;
    if(returnT<20)ashrey.tp=Math.min(ashrey.tp,returnT/20);if(returnT<18)sakshi.tp=Math.min(sakshi.tp,(returnT-2)/16);
    if(returnT<16)arch.tp=Math.min(arch.tp,(returnT-4)/12);if(returnT<14)sid.tp=Math.min(sid.tp,(returnT-6)/8);
    if(returnT<12)gaia.tp=Math.min(gaia.tp,(returnT-8)/4);
    if(returnT<8&&returnT>4)karishma.tp=Math.max(karishma.tp,0.7*(1-(8-returnT)/4));if(returnT<4)karishma.tp=Math.min(karishma.tp,returnT/4)}
  for(const d of AD){const r=d.tp>d.pr?0.04:0.015;d.pr+=(d.tp-d.pr)*r}
  ctx.clearRect(0,0,W,HH);const pD=pitch-pP;pP=pitch;
  if(bass>0.05&&bloom>0.05){ctx.save();ctx.globalAlpha=bass*0.05*bloom;ctx.fillStyle=`hsl(${BINDU_HUE},50%,35%)`;ctx.fillRect(0,0,W,HH);ctx.restore()}
  if(dF>0.05){ctx.save();ctx.globalAlpha=dF*0.3;ctx.fillStyle=`hsl(${BINDU_HUE},60%,55%)`;ctx.fillRect(0,0,W,HH);ctx.restore();if(dF>0.6)try{navigator.vibrate&&navigator.vibrate(100)}catch(ex){}}
  if(mirrorAlpha>0.005){ctx.save();ctx.globalAlpha=mirrorAlpha*0.35;const mg=ctx.createRadialGradient(cx,cy,0,cx,cy,maxR*1.8);mg.addColorStop(0,`hsla(${BINDU_HUE},15%,95%,1)`);mg.addColorStop(0.4,`hsla(${BINDU_HUE},25%,80%,0.6)`);mg.addColorStop(1,'hsla(0,0%,0%,0)');ctx.fillStyle=mg;ctx.fillRect(0,0,W,HH);ctx.restore()}
  const vR=Math.max(W,HH)*(0.4+bloom*0.4);const vig=ctx.createRadialGradient(cx,cy,vR*0.25,cx,cy,vR);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,`rgba(0,0,0,${0.55-bloom*0.2})`);ctx.fillStyle=vig;ctx.fillRect(0,0,W,HH);
  if(s3>0.05){ctx.save();ctx.globalAlpha=s3*0.08*bass;[0,HH*0.95].forEach(yy=>{const eg=ctx.createLinearGradient(0,yy,0,yy+(yy<1?HH*0.05:-HH*0.05));eg.addColorStop(0,`hsl(${BINDU_HUE},50%,55%)`);eg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=eg;ctx.fillRect(0,yy<1?0:HH*0.95,W,HH*0.05)});ctx.restore()}
  ctx.save();ctx.translate(cx,cy);ctx.rotate(pD*0.012*(1+bloom));ctx.translate(-cx,-cy);
  bindu.ty=cy-(pitch-0.5)*maxR*0.5;bindu.y+=(bindu.ty-bindu.y)*0.06;
  const pR=Math.abs(pitch-SC(P,Math.max(0,t-0.5)));bindu.tx=cx+Math.sin(t*0.4)*pR*maxR*0.4;bindu.x+=(bindu.tx-bindu.x)*0.04;
  if(shapeBlend>0.001){bindu.x=bindu.x*(1-shapeBlend)+(cx+shapeX)*shapeBlend;bindu.y=bindu.y*(1-shapeBlend)+(cy+shapeY)*shapeBlend;
    if(shapeBlend>0.1)bindu.mxG=30+Math.floor(shapeBlend*40);else bindu.mxG=30}else{bindu.mxG=30}
  const boostLum=postMirrorBoost*8;bindu.r=2.5+mids*3+bloom*5;bindu.lum=60+bloom*22+highs*8+boostLum;
  archBuf.push({t,x:bindu.x,y:bindu.y});while(archBuf.length>0&&archBuf[0].t<t-0.7)archBuf.shift();
  if(gaia.pr>0.01){gaia.y+=(bindu.y+maxR*(0.2+bass*0.12)-gaia.y)*0.03;gaia.x+=(cx+Math.sin(t*0.2)*maxR*0.06-gaia.x)*0.03;gaia.r=3+bass*10;gaia.lum=35+bass*20}
  if(sid.pr>0.01){sidA+=0.012;const oR=maxR*(0.2+sidSm*0.1);sid.x=bindu.x+Math.cos(sidA)*oR;sid.y=bindu.y+Math.sin(sidA)*oR*0.55;sid.r=2.8+sidSm*1.5;sid.lum=50+sidSm*10}
  if(arch.pr>0.01){const dl=archBuf.length>0?archBuf[0]:{x:bindu.x,y:bindu.y};arch.x+=(cx-(dl.x-cx)*0.65+Math.sin(t*0.55)*maxR*0.06-arch.x)*0.05;arch.y+=(dl.y+Math.sin(t*0.3)*maxR*0.05-arch.y)*0.05;arch.r=2+mids*5;arch.lum=52+mids*20}
  if(karishma.pr>0.02){const kD=maxR*(0.05+karishma.pr*0.15);karishma.x=bindu.x+Math.sin(t*0.18)*kD;karishma.y=bindu.y+Math.cos(t*0.14)*kD*0.7;karishma.r=1.5+karishma.pr*6;karishma.lum=62+karishma.pr*18}
  if(sakshi.pr>0.01){sakA+=0.003;sakshi.x=cx+Math.cos(sakA)*maxR*0.9;sakshi.y=cy*0.4+Math.sin(sakA*0.6)*maxR*0.2;sakshi.r=2+highs*2;sakshi.lum=75+highs*8}
  if(ashrey.pr>0.01){let ax2=0,ay2=0,cn=0;for(const d of AD){if(d!==ashrey&&d.pr>0.1){ax2+=d.x*d.pr;ay2+=d.y*d.pr;cn+=d.pr}}if(cn>0){ashrey.tx=ax2/cn;ashrey.ty=ay2/cn}ashrey.x+=(ashrey.tx-ashrey.x)*0.04;ashrey.y+=(ashrey.ty-ashrey.y)*0.04;ashrey.r=2+bloom*3;ashrey.hue=(290+t*8)%360;ashrey.lum=55+bloom*15}
  if(t-gT>0.2){gT=t;for(const d of AD)d.aG(t)}
  while(hi<H.length&&t>=H[hi].t){const h=H[hi];if(t-h.t<0.3){
    if(s2>0.05&&h.i>0.2){rings.push({b:t,mR:maxR*(0.15+h.i*0.4+s4*0.3),in:h.i*s2,sp:0.5+h.i*0.5,rot:Math.random()*Math.PI*2});if(rings.length>15)rings.shift()}
    if(s3>0.05&&h.i>0.15){const cn=Math.floor(2+h.i*7*s3);for(let p=0;p<cn;p++){const an=Math.random()*Math.PI*2,sp=0.3+Math.random()*1.8;particles.push({x:bindu.x,y:bindu.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,r:0.5+Math.random()*1.5,l:4+Math.random()*6,b:t})}if(particles.length>MAX_P)particles.splice(0,particles.length-MAX_P)}
    if(h.i>0.4)try{navigator.vibrate&&navigator.vibrate(h.i*20|0)}catch(ex){}}hi++}
  for(const d of AD)d.rG(t);
  if(sid.pr>0.05){ctx.save();ctx.globalAlpha=sid.pr*0.08;ctx.strokeStyle=`hsl(40,55%,55%)`;ctx.lineWidth=0.6;const oR=maxR*(0.2+sidSm*0.1);ctx.beginPath();ctx.ellipse(bindu.x,bindu.y,oR,oR*0.55,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
  for(let r=rings.length-1;r>=0;r--){const rn=rings[r],age=t-rn.b,ls=3/rn.sp;if(age>ls){rings.splice(r,1);continue}const pr=age/ls,rad=rn.mR*(0.3+pr*0.7),al=rn.in*(1-pr)*(1-pr*0.5)*0.3;ctx.save();ctx.globalAlpha=al;ctx.translate(bindu.x,bindu.y);ctx.rotate(rn.rot+t*0.12*(r%2?1:-1));ctx.strokeStyle=`hsl(${BINDU_HUE+(r%2)*15},${55+bloom*10}%,${65+bloom*15}%)`;ctx.lineWidth=1+s4*1.5;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.stroke();
  if(s4>0.1){const nt=6+Math.floor(s4*6);for(let n=0;n<nt;n++){const na=Math.PI*2*n/nt;ctx.beginPath();ctx.moveTo(Math.cos(na)*(rad-3),Math.sin(na)*(rad-3));ctx.lineTo(Math.cos(na)*(rad+4+s4*5),Math.sin(na)*(rad+4+s4*5));ctx.stroke()}}ctx.restore()}
  if(s3>0.05){const rc=8+Math.floor(s4*8),rl=maxR*(0.3+s3*0.4+s4*0.5)*bass*2,ra=s3*0.1*(0.5+bass*0.5);ctx.save();ctx.translate(bindu.x,bindu.y);ctx.rotate(t*0.05);for(let r=0;r<rc;r++){const an=Math.PI*2*r/rc,ln=rl*(0.7+Math.sin(t*2+r)*0.3);const lg=ctx.createLinearGradient(0,0,Math.cos(an)*ln,Math.sin(an)*ln);lg.addColorStop(0,`hsla(${BINDU_HUE},${55+bloom*15}%,${65+bloom*15}%,${ra})`);lg.addColorStop(1,'hsla(0,0%,0%,0)');ctx.strokeStyle=lg;ctx.lineWidth=1+s4*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(an)*ln,Math.sin(an)*ln);ctx.stroke()}ctx.restore()}
  for(let p=particles.length-1;p>=0;p--){const pt=particles[p],age=t-pt.b;if(age>pt.l){particles.splice(p,1);continue}pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.997;pt.vy*=0.997;const fI=Math.min(1,age/0.3),fO=age>pt.l-2?Math.max(0,(pt.l-age)/2):1;ctx.save();ctx.globalAlpha=fI*fO*0.3*s3;ctx.fillStyle=`hsla(${BINDU_HUE+15},55%,${70+bloom*10}%,1)`;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();ctx.restore()}
  if(s4>0.05){const mR=maxR*(0.6+s4*0.6),ma=s4*0.07;ctx.save();ctx.translate(bindu.x,bindu.y);ctx.globalAlpha=ma;ctx.strokeStyle=`hsl(${BINDU_HUE},${50+bloom*15}%,${70+bloom*15}%)`;ctx.lineWidth=0.5+s4;ctx.beginPath();ctx.arc(0,0,mR,0,Math.PI*2);ctx.stroke();
  const tR=mR*0.7;for(let tri=0;tri<3;tri++){ctx.save();ctx.rotate(t*0.08*(tri+1)*0.5+tri*Math.PI/3);ctx.globalAlpha=ma*(0.5+0.5*Math.sin(t+tri));ctx.beginPath();for(let v=0;v<3;v++){const va=Math.PI*2*v/3,vx=Math.cos(va)*tR,vy=Math.sin(va)*tR;v===0?ctx.moveTo(vx,vy):ctx.lineTo(vx,vy)}ctx.closePath();ctx.stroke();ctx.restore()}
  if(s4>0.3){const pc=12;ctx.globalAlpha=ma*s4*0.5;for(let p=0;p<pc;p++){const pa=Math.PI*2*p/pc+t*0.03,pr2=mR*0.4;ctx.beginPath();ctx.arc(Math.cos(pa)*pr2*0.5,Math.sin(pa)*pr2*0.5,pr2*0.3,0,Math.PI*2);ctx.stroke()}}ctx.restore()}
  if(ashrey.pr>0.02){const vis=AD.filter(d=>d.pr>0.1&&d!==ashrey);ctx.save();ctx.globalAlpha=ashrey.pr*0.09;ctx.lineWidth=0.7+ashrey.pr;for(let i=0;i<vis.length;i++){for(let j=i+1;j<vis.length;j++){const a=vis[i],b=vis[j];const lg=ctx.createLinearGradient(a.x,a.y,b.x,b.y);lg.addColorStop(0,`hsl(${a.hue},${a.sat}%,${a.lum}%)`);lg.addColorStop(1,`hsl(${b.hue},${b.sat}%,${b.lum}%)`);ctx.strokeStyle=lg;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
  if(ashrey.pr>0.3){ctx.globalAlpha=ashrey.pr*0.06;for(let i=0;i<vis.length;i++){for(let j=i+1;j<vis.length;j++){const mx2=(vis[i].x+vis[j].x)/2,my2=(vis[i].y+vis[j].y)/2;ctx.fillStyle=`hsla(${ashrey.hue},35%,70%,0.5)`;ctx.beginPath();ctx.arc(mx2,my2,1+ashrey.pr,0,Math.PI*2);ctx.fill()}}}ctx.restore()}
  const viD=AD.filter(d=>d.pr>0.15);for(let i=0;i<viD.length;i++){for(let j=i+1;j<viD.length;j++){const a=viD[i],b=viD[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<maxR*0.08){const inten=(1-dist/(maxR*0.08))*Math.min(a.pr,b.pr);ctx.save();ctx.globalAlpha=inten*0.2;const rg=ctx.createRadialGradient((a.x+b.x)/2,(a.y+b.y)/2,0,(a.x+b.x)/2,(a.y+b.y)/2,maxR*0.06);rg.addColorStop(0,'hsla(0,0%,100%,0.5)');rg.addColorStop(1,'hsla(0,0%,100%,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc((a.x+b.x)/2,(a.y+b.y)/2,maxR*0.06,0,Math.PI*2);ctx.fill();ctx.restore()}}}
  if(gaia.pr>0.1&&bass>0.4){ctx.save();ctx.globalAlpha=gaia.pr*(bass-0.4)*0.15;ctx.strokeStyle=`hsl(25,50%,${42+bass*15}%)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(gaia.x,gaia.y,gaia.r+Math.sin(t*8)*gaia.r*0.5+gaia.r*2,0,Math.PI*2);ctx.stroke();ctx.restore()}
  const bSx=1+Math.max(0,accel)*0.12;for(const d of AD)d.rD(d===bindu?bSx:1+Math.max(0,accel)*0.03*d.pr);
  if(t>PEAK_T-1&&!wS){wS=true;const wr=document.getElementById('wr');wr.classList.add('v');setTimeout(()=>{wr.classList.remove('v');wr.classList.add('d')},3500)}
  if(t>PEAK_T-3&&!lS){lS=true;document.getElementById('lt').classList.add('v')}
  if(t>DUR-RETURN_START){const fadeProgress=Math.max(0,(t-(DUR-4))/4);if(fadeProgress>0){ctx.save();ctx.globalAlpha=fadeProgress;ctx.fillStyle='#000';ctx.fillRect(0,0,W,HH);ctx.restore()}}
  else if(t>DUR-12){ctx.save();ctx.globalAlpha=Math.max(0,(t-(DUR-12))/12);ctx.fillStyle='#000';ctx.fillRect(0,0,W,HH);ctx.restore()}
  ctx.restore();
  if((song.ended||t>DUR-0.5)&&!fS){fS=true;setTimeout(()=>document.getElementById('fo').classList.add('v'),2500)}
  if(!song.ended)requestAnimationFrame(anim)}
wi.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
document.addEventListener('click',e=>{if(e.target===wi)return;go()});
document.addEventListener('touchend',e=>{if(e.target===wi)return;e.preventDefault();go()},{passive:false});
</script>
