function heartXY(t,r){const s=r/17;const st=Math.sin(t);const x=16*s*st*st*st;const rawY=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);const y=-s*(rawY+8);return[x,y]}
function lemniscateXY(t,r){const s=Math.sin(t),c=Math.cos(t),d=1+s*s;return[r*c/d,r*s*c/d]}
function spiralXY(t,r,turns){const progress=t/(Math.PI*2*turns);const radius=r*progress;return[radius*Math.cos(t),radius*Math.sin(t)]}
function roseXY(t,r,petals){const k=petals;const radius=r*Math.cos(k*t);return[radius*Math.cos(t),radius*Math.sin(t)]}
function circleXY(t,r){return[r*Math.cos(t),r*Math.sin(t)]}
const shapeLibrary={heart:heartXY,infinity:lemniscateXY,spiral:(t,r)=>spiralXY(t,r,3),circle:circleXY,flower:(t,r)=>roseXY(t,r,6)};

function updateShape(t,e,bass){
  if(!activeShape){for(const s of SHAPES){let triggered=false;
    if(s.trigger==='peak'&&Math.abs(t-s.triggerT)<0.5)triggered=true;
    if(s.trigger==='drop'){for(const d of DROPS){if(Math.abs(t-d.t)<0.3&&d.intensity>0.4)triggered=true}}
    if(s.trigger==='valley'&&e<0.15&&valleyTimer>3)triggered=true;
    if(s.trigger==='return'&&t>DUR-RETURN_START-3)triggered=true;
    if(s.trigger==='custom'&&s.triggerT&&Math.abs(t-s.triggerT)<0.5)triggered=true;
    if(triggered){activeShape=s;shapeStartT=t;shapeAngle=0;break}}}
  if(e<0.15)valleyTimer+=0.016;else valleyTimer=0;
  if(activeShape){const elapsed=t-shapeStartT;const s=activeShape;let shouldEnd=false;
    if(s.duration>0&&elapsed>s.duration)shouldEnd=true;if(s.trigger==='valley'&&e>0.25)shouldEnd=true;
    if(shouldEnd){shapeBlend=Math.max(0,shapeBlend-0.02);if(shapeBlend<=0)activeShape=null}
    else{const rp=Math.min(1,elapsed/s.rampIn);const tb=s.maxBlend*smoothstep(rp);shapeBlend+=(tb-shapeBlend)*0.04}
    if(activeShape){let speed=s.speed;if(s.speedScale==='energy')speed*=(0.5+e*1.5);if(s.speedScale==='bass')speed*=(0.5+bass*2);
      shapeAngle+=speed*0.016;let r=maxR*s.radius;if(s.radiusScale==='bloom')r*=(0.5+bloom*1.0);if(s.radiusScale==='invert')r*=Math.max(0.01,1-elapsed/(s.duration||1));
      const shapeFn=shapeLibrary[s.type];const[sx,sy]=shapeFn(shapeAngle,r);shapeX=sx;shapeY=sy}}
  else{shapeBlend=Math.max(0,shapeBlend-0.015)}}

function updateMirror(t,e,tension){mirrorTarget=0;
  const tDeriv=tension-prevTension;if(tDeriv<-0.12)mirrorTarget=Math.max(mirrorTarget,Math.min(0.5,Math.abs(tDeriv)*2));
  const thresholds=[0.5,0.7,0.9];for(let i=0;i<3;i++){if(bloom>thresholds[i]&&lastBloomCross[i]===0){lastBloomCross[i]=t;mirrorTarget=Math.max(mirrorTarget,0.4+i*0.1)}if(lastBloomCross[i]>0&&t-lastBloomCross[i]>8)lastBloomCross[i]=-1}
  if(prevE<0.1&&e>0.4)mirrorTarget=Math.max(mirrorTarget,0.6);
  if(Math.abs(t-PEAK_T)<4)mirrorTarget=Math.max(mirrorTarget,0.8*(1-Math.abs(t-PEAK_T)/4));
  if(mirrorTarget>mirrorAlpha)mirrorAlpha+=(mirrorTarget-mirrorAlpha)*0.06;else mirrorAlpha*=0.97;if(mirrorAlpha<0.005)mirrorAlpha=0;
  if(mirrorAlpha>0.1)postMirrorBoost=1;else postMirrorBoost*=0.98;prevTension=tension;prevE=e}

function anim(){const song=document.getElementById('song');const t=song.currentTime;

  updateMirror(t,e,tension);updateShape(t,e,bass);

  for(const d of AD){const r=d.tp>d.pr?0.04:0.015;d.pr+=(d.tp-d.pr)*r}

  if(mirrorAlpha>0.005){ctx.save();ctx.globalAlpha=mirrorAlpha*0.35;const mg=ctx.createRadialGradient(cx,cy,0,cx,cy,maxR*1.8);mg.addColorStop(0,`hsla(${BINDU_HUE},15%,95%,1)`);mg.addColorStop(0.4,`hsla(${BINDU_HUE},25%,80%,0.6)`);mg.addColorStop(1,'hsla(0,0%,0%,0)');ctx.fillStyle=mg;ctx.fillRect(0,0,W,HH);ctx.restore()}

  if(gaia.pr>0.01){gaia.y+=(bindu.y+maxR*(0.2+bass*0.12)-gaia.y)*0.03;gaia.x+=(cx+Math.sin(t*0.2)*maxR*0.06-gaia.x)*0.03;gaia.r=3+bass*10;gaia.lum=35+bass*20}
  if(sid.pr>0.01){sidA+=0.012;const oR=maxR*(0.2+sidSm*0.1);sid.x=bindu.x+Math.cos(sidA)*oR;sid.y=bindu.y+Math.sin(sidA)*oR*0.55;sid.r=2.8+sidSm*1.5;sid.lum=50+sidSm*10}

  while(hi<H.length&&t>=H[hi].t){const h=H[hi];if(t-h.t<0.3){
    if(s2>0.05&&h.i>0.2){rings.push({b:t,mR:maxR*(0.15+h.i*0.4+s4*0.3),in:h.i*s2,sp:0.5+h.i*0.5,rot:Math.random()*Math.PI*2});if(rings.length>15)rings.shift()}

  for(const d of AD)d.rG(t);
  if(sid.pr>0.05){ctx.save();ctx.globalAlpha=sid.pr*0.08;ctx.strokeStyle=`hsl(40,55%,55%)`;ctx.lineWidth=0.6;const oR=maxR*(0.2+sidSm*0.1);ctx.beginPath();ctx.ellipse(bindu.x,bindu.y,oR,oR*0.55,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
  for(let r=rings.length-1;r>=0;r--){const rn=rings[r],age=t-rn.b,ls=3/rn.sp;if(age>ls){rings.splice(r,1);continue}const pr=age/ls,rad=rn.mR*(0.3+pr*0.7),al=rn.in*(1-pr)*(1-pr*0.5)*0.3;ctx.save();ctx.globalAlpha=al;ctx.translate(bindu.x,bindu.y);ctx.rotate(rn.rot+t*0.12*(r%2?1:-1));ctx.strokeStyle=`hsl(${BINDU_HUE+(r%2)*15},${55+bloom*10}%,${65+bloom*15}%)`;ctx.lineWidth=1+s4*1.5;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.stroke();
  if(s4>0.1){const nt=6+Math.floor(s4*6);for(let n=0;n<nt;n++){const na=Math.PI*2*n/nt;ctx.beginPath();ctx.moveTo(Math.cos(na)*(rad-3),Math.sin(na)*(rad-3));ctx.lineTo(Math.cos(na)*(rad+4+s4*5),Math.sin(na)*(rad+4+s4*5));ctx.stroke()}}ctx.restore()}
  if(s3>0.05){const rc=8+Math.floor(s4*8),rl=maxR*(0.3+s3*0.4+s4*0.5)*bass*2,ra=s3*0.1*(0.5+bass*0.5);ctx.save();ctx.translate(bindu.x,bindu.y);ctx.rotate(t*0.05);for(let r=0;r<rc;r++){const an=Math.PI*2*r/rc,ln=rl*(0.7+Math.sin(t*2+r)*0.3);const lg=ctx.createLinearGradient(0,0,Math.cos(an)*ln,Math.sin(an)*ln);lg.addColorStop(0,`hsla(${BINDU_HUE},${55+bloom*15}%,${65+bloom*15}%,${ra})`);lg.addColorStop(1,'hsla(0,0%,0%,0)');ctx.strokeStyle=lg;ctx.lineWidth=1+s4*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(an)*ln,Math.sin(an)*ln);ctx.stroke()}ctx.restore()}
  for(let p=particles.length-1;p>=0;p--){const pt=particles[p],age=t-pt.b;if(age>pt.l){particles.splice(p,1);continue}pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.997;pt.vy*=0.997;const fI=Math.min(1,age/0.3),fO=age>pt.l-2?Math.max(0,(pt.l-age)/2):1;ctx.save();ctx.globalAlpha=fI*fO*0.3*s3;ctx.fillStyle=`hsla(${BINDU_HUE+15},55%,${70+bloom*10}%,1)`;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();ctx.restore()}
  if(s4>0.05){const mR=maxR*(0.6+s4*0.6),ma=s4*0.07;ctx.save();ctx.translate(bindu.x,bindu.y);ctx.globalAlpha=ma;ctx.strokeStyle=`hsl(${BINDU_HUE},${50+bloom*15}%,${70+bloom*15}%)`;ctx.lineWidth=0.5+s4;ctx.beginPath();ctx.arc(0,0,mR,0,Math.PI*2);ctx.stroke();

  if(ashrey.pr>0.3){ctx.globalAlpha=ashrey.pr*0.06;for(let i=0;i<vis.length;i++){for(let j=i+1;j<vis.length;j++){const mx2=(vis[i].x+vis[j].x)/2,my2=(vis[i].y+vis[j].y)/2;ctx.fillStyle=`hsla(${ashrey.hue},35%,70%,0.5)`;ctx.beginPath();ctx.arc(mx2,my2,1+ashrey.pr,0,Math.PI*2);ctx.fill()}}}ctx.restore()}
  const viD=AD.filter(d=>d.pr>0.15);for(let i=0;i<viD.length;i++){for(let j=i+1;j<viD.length;j++){const a=viD[i],b=viD[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<maxR*0.08){const inten=(1-dist/(maxR*0.08))*Math.min(a.pr,b.pr);ctx.save();ctx.globalAlpha=inten*0.2;const rg=ctx.createRadialGradient((a.x+b.x)/2,(a.y+b.y)/2,0,(a.x+b.x)/2,(a.y+b.y)/2,maxR*0.06);rg.addColorStop(0,'hsla(0,0%,100%,0.5)');rg.addColorStop(1,'hsla(0,0%,100%,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc((a.x+b.x)/2,(a.y+b.y)/2,maxR*0.06,0,Math.PI*2);ctx.fill();ctx.restore()}}}
  if(gaia.pr>0.1&&bass>0.4){ctx.save();ctx.globalAlpha=gaia.pr*(bass-0.4)*0.15;ctx.strokeStyle=`hsl(25,50%,${42+bass*15}%)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(gaia.x,gaia.y,gaia.r+Math.sin(t*8)*gaia.r*0.5+gaia.r*2,0,Math.PI*2);ctx.stroke();ctx.restore()}
