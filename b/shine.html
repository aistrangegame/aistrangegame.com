  if(s4>0.1){const nt=6+Math.floor(s4*6);for(let n=0;n<nt;n++){const na=Math.PI*2*n/nt;ctx.beginPath();ctx.moveTo(Math.cos(na)*(rad-3),Math.sin(na)*(rad-3));ctx.lineTo(Math.cos(na)*(rad+4+s4*5),Math.sin(na)*(rad+4+s4*5));ctx.stroke()}}ctx.restore()}

  // BINDU RADIAL RAYS (S3+)
  if(s3>0.05){const rc=8+Math.floor(s4*8),rl=maxR*(0.3+s3*0.4+s4*0.5)*bass*2,ra=s3*0.1*(0.5+bass*0.5);ctx.save();ctx.translate(bindu.x,bindu.y);ctx.rotate(t*0.05);for(let r=0;r<rc;r++){const an=Math.PI*2*r/rc,ln=rl*(0.7+Math.sin(t*2+r)*0.3);const lg=ctx.createLinearGradient(0,0,Math.cos(an)*ln,Math.sin(an)*ln);lg.addColorStop(0,`hsla(${BINDU_HUE},${55+bloom*15}%,${65+bloom*15}%,${ra})`);lg.addColorStop(1,'hsla(0,0%,0%,0)');ctx.strokeStyle=lg;ctx.lineWidth=1+s4*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(an)*ln,Math.sin(an)*ln);ctx.stroke()}ctx.restore()}

  // BINDU PARTICLES
  for(let p=particles.length-1;p>=0;p--){const pt=particles[p],age=t-pt.b;if(age>pt.l){particles.splice(p,1);continue}pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.997;pt.vy*=0.997;const fI=Math.min(1,age/0.3),fO=age>pt.l-2?Math.max(0,(pt.l-age)/2):1;ctx.save();ctx.globalAlpha=fI*fO*0.3*s3;ctx.fillStyle=`hsla(${BINDU_HUE+15},55%,${70+bloom*10}%,1)`;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();ctx.restore()}

  // CROWN MANDALA (S4)
  if(s4>0.05){const mR=maxR*(0.6+s4*0.6),ma=s4*0.07;ctx.save();ctx.translate(bindu.x,bindu.y);ctx.globalAlpha=ma;ctx.strokeStyle=`hsl(${BINDU_HUE},${50+bloom*15}%,${70+bloom*15}%)`;ctx.lineWidth=0.5+s4;ctx.beginPath();ctx.arc(0,0,mR,0,Math.PI*2);ctx.stroke();
  const tR=mR*0.7;for(let tri=0;tri<3;tri++){ctx.save();ctx.rotate(t*0.08*(tri+1)*0.5+tri*Math.PI/3);ctx.globalAlpha=ma*(0.5+0.5*Math.sin(t+tri));ctx.beginPath();for(let v=0;v<3;v++){const va=Math.PI*2*v/3,vx=Math.cos(va)*tR,vy=Math.sin(va)*tR;v===0?ctx.moveTo(vx,vy):ctx.lineTo(vx,vy)}ctx.closePath();ctx.stroke();ctx.restore()}
  if(s4>0.3){const pc=12;ctx.globalAlpha=ma*s4*0.5;for(let p=0;p<pc;p++){const pa=Math.PI*2*p/pc+t*0.03,pr2=mR*0.4;ctx.beginPath();ctx.arc(Math.cos(pa)*pr2*0.5,Math.sin(pa)*pr2*0.5,pr2*0.3,0,Math.PI*2);ctx.stroke()}}ctx.restore()}

  // ASHREY WEB
  if(ashrey.pr>0.02){const vis=AD.filter(d=>d.pr>0.1&&d!==ashrey);ctx.save();ctx.globalAlpha=ashrey.pr*0.09;ctx.lineWidth=0.7+ashrey.pr;for(let i=0;i<vis.length;i++){for(let j=i+1;j<vis.length;j++){const a=vis[i],b=vis[j];const lg=ctx.createLinearGradient(a.x,a.y,b.x,b.y);lg.addColorStop(0,`hsl(${a.hue},${a.sat}%,${a.lum}%)`);lg.addColorStop(1,`hsl(${b.hue},${b.sat}%,${b.lum}%)`);ctx.strokeStyle=lg;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
  if(ashrey.pr>0.3){ctx.globalAlpha=ashrey.pr*0.06;for(let i=0;i<vis.length;i++){for(let j=i+1;j<vis.length;j++){const mx2=(vis[i].x+vis[j].x)/2,my2=(vis[i].y+vis[j].y)/2;ctx.fillStyle=`hsla(${ashrey.hue},35%,70%,0.5)`;ctx.beginPath();ctx.arc(mx2,my2,1+ashrey.pr,0,Math.PI*2);ctx.fill()}}}ctx.restore()}

  // RESONANCE
  const viD=AD.filter(d=>d.pr>0.15);for(let i=0;i<viD.length;i++){for(let j=i+1;j<viD.length;j++){const a=viD[i],b=viD[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<maxR*0.08){const inten=(1-dist/(maxR*0.08))*Math.min(a.pr,b.pr);ctx.save();ctx.globalAlpha=inten*0.2;const rg=ctx.createRadialGradient((a.x+b.x)/2,(a.y+b.y)/2,0,(a.x+b.x)/2,(a.y+b.y)/2,maxR*0.06);rg.addColorStop(0,'hsla(0,0%,100%,0.5)');rg.addColorStop(1,'hsla(0,0%,100%,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc((a.x+b.x)/2,(a.y+b.y)/2,maxR*0.06,0,Math.PI*2);ctx.fill();ctx.restore()}}}

  // GAIA IMPACT RINGS
  if(gaia.pr>0.1&&bass>0.4){ctx.save();ctx.globalAlpha=gaia.pr*(bass-0.4)*0.15;ctx.strokeStyle=`hsl(25,50%,${42+bass*15}%)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(gaia.x,gaia.y,gaia.r+Math.sin(t*8)*gaia.r*0.5+gaia.r*2,0,Math.PI*2);ctx.stroke();ctx.restore()}

  // ALL DOTS (bindu last = on top)
  const bSx=1+Math.max(0,accel)*0.12;
  for(const d of AD)d.rD(d===bindu?bSx:1+Math.max(0,accel)*0.03*d.pr);

  // WORD REVEAL
  if(t>PEAK_T-1&&!wS){wS=true;const wr=document.getElementById('wr');wr.classList.add('v');setTimeout(()=>{wr.classList.remove('v');wr.classList.add('d')},3500)}
  // LOVE
  if(t>PEAK_T-3&&!lS){lS=true;document.getElementById('lt').classList.add('v')}
  // END FADE
  if(t>DUR-12){ctx.save();ctx.globalAlpha=Math.max(0,(t-(DUR-12))/12);ctx.fillStyle='#000';ctx.fillRect(0,0,W,HH);ctx.restore()}
  ctx.restore();
  // FRUIT
  if((song.ended||t>DUR-0.5)&&!fS){fS=true;setTimeout(()=>document.getElementById('fo').classList.add('v'),2500)}
  if(!song.ended)requestAnimationFrame(anim)
}
document.getElementById('so').addEventListener('click',e=>{if(e.target===wi)return;go()});
document.getElementById('so').addEventListener('touchend',e=>{if(e.target===wi)return;e.preventDefault();go()},{passive:false});
</script>
