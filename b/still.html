function heartXY(t,r){const s=r/17;const st=Math.sin(t);const x=16*s*st*st*st;const rawY=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);const y=-s*(rawY+8);return[x,y]}

    if(s.trigger==='custom'&&s.triggerT&&Math.abs(t-s.triggerT)<0.5)triggered=true;
    if(triggered){activeShape=s;shapeStartT=t;shapeAngle=0;break}}}
  if(e<0.15)valleyTimer+=0.016;else valleyTimer=0;

function updateMirror(t,e,tension){mirrorTarget=0;
  const tDeriv=tension-prevTension;if(tDeriv<-0.12)mirrorTarget=Math.max(mirrorTarget,Math.min(0.5,Math.abs(tDeriv)*2));

  const viD=AD.filter(d=>d.pr>0.15);for(let i=0;i<viD.length;i++){for(let j=i+1;j<viD.length;j++){const a=viD[i],b=viD[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<maxR*0.08){const inten=(1-dist/(maxR*0.08))*Math.min(a.pr,b.pr);ctx.save();ctx.globalAlpha=inten*0.2;const rg=ctx.createRadialGradient((a.x+b.x)/2,(a.y+b.y)/2,0,(a.x+b.x)/2,(a.y+b.y)/2,maxR*0.06);rg.addColorStop(0,'hsla(0,0%,100%,0.5)');rg.addColorStop(1,'hsla(0,0%,100%,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc((a.x+b.x)/2,(a.y+b.y)/2,maxR*0.06,0,Math.PI*2);ctx.fill();ctx.restore()}}}
  if(gaia.pr>0.1&&bass>0.4){ctx.save();ctx.globalAlpha=gaia.pr*(bass-0.4)*0.15;ctx.strokeStyle=`hsl(25,50%,${42+bass*15}%)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(gaia.x,gaia.y,gaia.r+Math.sin(t*8)*gaia.r*0.5+gaia.r*2,0,Math.PI*2);ctx.stroke();ctx.restore()}
  const bSx=1+Math.max(0,accel)*0.12;for(const d of AD)d.rD(d===bindu?bSx:1+Math.max(0,accel)*0.03*d.pr);
  if(t>PEAK_T-1&&!wS){wS=true;const wr=document.getElementById('wr');wr.classList.add('v');setTimeout(()=>{wr.classList.remove('v');wr.classList.add('d')},3500)}
  if(t>PEAK_T-3&&!lS){lS=true;document.getElementById('lt').classList.add('v')}
  if(t>DUR-RETURN_START){const fadeProgress=Math.max(0,(t-(DUR-4))/4);if(fadeProgress>0){ctx.save();ctx.globalAlpha=fadeProgress;ctx.fillStyle='#000';ctx.fillRect(0,0,W,HH);ctx.restore()}}
  else if(t>DUR-15){ctx.save();ctx.globalAlpha=Math.max(0,(t-(DUR-15))/15);ctx.fillStyle='#000';ctx.fillRect(0,0,W,HH);ctx.restore()}
  ctx.restore();
  if((song.ended||t>DUR-0.5)&&!fS){fS=true;setTimeout(()=>document.getElementById('fo').classList.add('v'),2500)}
  if(!song.ended)requestAnimationFrame(anim)}
wi.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
document.addEventListener('click',e=>{if(e.target===wi)return;go()});
document.addEventListener('touchend',e=>{if(e.target===wi)return;e.preventDefault();go()},{passive:false});
</script>
