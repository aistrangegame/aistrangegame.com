<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Not here — A Strange Game</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0910;--ink:#F5EFE6;--muted:rgba(245,239,230,.66);--faint:rgba(245,239,230,.14);--gold:#C9A84C;--serif:'Lora',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;background:var(--bg) radial-gradient(ellipse at 50% 60%,rgba(201,168,76,.12),transparent 60%);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;padding:40px 24px;text-align:center}
.pt{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 22px var(--gold);margin:0 auto 28px;animation:b 5.5s ease-in-out infinite}
@keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.k{font-family:var(--sans);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:400;font-size:clamp(30px,8vw,46px);margin:14px 0 10px}
p{max-width:32ch;margin:0 auto 32px;color:var(--muted);font-style:italic}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--faint);color:var(--ink);text-decoration:none;font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
a.go{border-color:var(--gold)}
a:hover,a:focus-visible{background:rgba(255,255,255,.05)}
@media (prefers-reduced-motion:reduce){.pt{animation:none}}
</style></head><body>
<main>
  <div class="pt" aria-hidden="true"></div>
  <div class="k">Not here</div>
  <h1>This door isn't open.</h1>
  <p>The page may have moved, or it hasn't arrived yet. Nothing is lost.</p>
  <nav><a class="go" href="/door/">The Door</a><a href="/">Home</a></nav>
</main>
</body></html>
