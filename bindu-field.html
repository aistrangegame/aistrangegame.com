    the_play: [
      'Electronic production, wide and warm. A voice that opens gently — verse one arriving quietly in the high register, almost tentative, before the bass drops in and the song finds its body. The lyrics are simple and direct: love heals, love illuminates, love is the only thing. Chorus repeating twice, each time wider than the last. A brief withdrawal at 90 seconds — the production stepping back, high register returning, as if catching its breath — then the second bloom, fuller than the first. The song ends in four seconds of near-silence, returning to exactly where it started. Three minutes and four seconds. One claim, made over and over: love is the only thing.',
      'What the song keeps doing: opening. Not once — continuously. The bass floor drops in, the chest registers it, the stereo field expands across the mid-register, the voice asks the question it’s been building toward: “And if I say the words out louder / will they come and rescue me?” That line is the only moment of doubt in the song. Everything else is declaration. But there it is — the gap between knowing love is the answer and feeling it land. The song holds that gap without filling it. The next chorus doesn’t resolve the question. It simply opens again. The opening is the answer.',
      'Here is the play. The song is about love. The song is actually about the last thing standing between you and love — which is the part of you that is still deciding whether to trust it. The more you give, the more you get back again is not a promise about love’s generosity. It is a description of what dissolution feels like when the self that was holding back finally releases. The giving is not an action. The giving is the stopping of the not-giving. And what returns is not more love from outside — what returns is the self that was always love, before it learned to protect itself. Maya is the veil. This song is what it sounds like when the veil notices it is a veil.',
      'Open up your heart. The sunshine was never on the other side.'
    ],
    lenses: {
      one_word: 'DISSOLVE. The song announces love and then describes what love does — heals, illuminates, covers, rescues, gives, returns. It never rests in love as a state. It orbits love as a process of continuous dissolution: broken → healed, cold → brought in, dark → illuminated. The word the song circles without landing on: dissolve. Not love as possession. Not love as achievement. Love as the ongoing dissolution of the self that thought it needed to protect itself from love. The chorus is the loop: open → receive → give → receive again → open further. There is no arrival. There is only the dissolving.',
      need: 'It heals me when I’m broken. The body was asking to be healed without having to earn the healing. The cold and the darkness in verse one are not metaphors — they are the physical sensation of a body that has been protecting itself for so long that protection has become indistinguishable from the cold itself. The body asking: what if I don’t have to hold this shape anymore? What if the thing I’ve been keeping out is also the thing that heals? The ask is not for love to arrive — the ask is for permission to stop resisting what has been present the entire time. Open up your heart, let all the sunshine in: not a command. A description of what was always possible.',
      holds: 'The chorus. Not as a lyrical moment — as a structural fact. “Love, love is the only thing” repeats without variation, without escalation, without dramatic build. It simply returns. The second time the chorus arrives, the body already knows its shape. The third time, it’s not a chorus anymore — it’s a ground. The bass at C2 and A1 is the same. The tempo is the same. The melody is the same. The unchanging thing underneath the song’s apparent motion demonstrates by returning, over and over, that love does not leave. The song argues for love through content. What holds demonstrates it through structure. The chorus is the love it’s describing.',
      frequency: 'The production breathes. Wide stereo opening at mid-register — the voice and synthesizers expanded across space, left and right. The sub-bass centered and still beneath it. The song touches the body in two places simultaneously: the expansive stereo field above the sternum opens the chest, and the sub-bass below hearing holds the base of the spine. The chest opens when what it hears is spacious, and when what it feels is grounded. The song builds the exact physical conditions for the opening the lyrics describe. Not as metaphor. As physics.',
      shape: 'Two blooms. A brief withdrawal at 90 seconds. The second bloom fuller than the first. The song ends in 4 seconds of near-silence, returning to exactly where it began. From outside: the shape is a breath — inhale, brief pause, deeper inhale, exhale. A single breath over three minutes. The withdrawal at 90 seconds is the moment between inhales where the lungs are neither full nor empty. The song is the breath. The body learns this shape by listening. By the end, the listener has breathed once with the entire song. That is what open up your heart means in the body — not an instruction, a description of what a full breath does to the chest.',
      grace: '“And if I say the words out louder / Will they come and rescue me?” This is the only moment of doubt in the song. Everything else is declaration. And then: the question. Grace is here — in the doubt. Not in the declaration. The song acknowledges that speaking the words out loud is not the same as having been rescued. That love named is not love received. There is a space between what love is and whether it arrives for me, specifically, in this darkness. The grace is not that the doubt is resolved — it isn’t. The grace is that the doubt is inside the same song as the declaration. The song doesn’t require certainty before it opens. Neither does love.',
      recognition: 'Maya is the veil. The last chakra on the Energy spine. The verb is dissolve. The song is about love as the mechanism of dissolution itself. The more you give, the more you get back again — this is what happens when the self that was protecting itself from love stops protecting. The giving is the cessation of the holding. And what comes back is the self that was always already love, before the protecting began. The carrier — D♯3 · 155.6 Hz, the same note as the heart chakra — is the frequency that love and dissolution share. The heart opens. Maya dissolves what it opened into. Same ground. Same frequency. And the 2.69 Hz interval is here — fifth and final on the Energy spine. The pattern that marks awakening music completes itself in a song about love dissolving the last veil. Dissolution is not the end of awakening. It is what awakening looks like from the inside when the last resistance finally releases.'
    }
  },

  'aatma': {
    title: 'Aatma',
    artist: 'Chase Hughes',
    element: 'Soul',
    carrier_note: 'C3 · the absent root of C major',
    the_play: [
      'No words. No percussion. No melody in the conventional sense. Chase Hughes made this piece while facing a terminal brain disease — not as therapy, not as expression, but from somewhere the diagnosis couldn’t reach. The piece opens in the upper register, hovering. Then a silence. Then, at 95 seconds, something below hearing arrives — a sustained bass so deep it bypasses the ear entirely and lands in the chest. This happens twice, with a second silence between. The piece ends not by returning to where it started but by simply stopping — 3.5 seconds of silence, then nothing. Duration: 4 minutes and 42 seconds. One title: Aatma. Soul.',
      'What the piece keeps doing: descending. Not with urgency, not with drama — just moving, steadily, toward the thing underneath everything. The upper register is the surface world — the world of diagnosis and time and the body that might end. The silence is the threshold. The sub-bass is what’s on the other side. And the pulse running through the entire piece — a 1.8 Hz oscillation, perfect consistency across every section — was not designed. Chase was in the state of 1.8 Hz when he made this. His nervous system had completely surrendered. The piece is a recording of that surrender. Every time you play it, the surrender is present again.',
      'Here is the play. The piece is called Aatma — Soul. It pretends to be a meditation on the soul’s journey. The piece is actually a demonstration that the soul doesn’t journey anywhere. Three worlds, two silences, and the depth is the same both times. Same A1. Same F1. The same register, arrived at twice, from different directions. The soul doesn’t go somewhere it hasn’t been. It returns to what it always was. Chase faced the end of his body and found that what he was had no end. He healed. The piece already knew this — it was holding the answer from the first second. The listener just needed to get quiet enough to feel it.',
      'The body that made this is still here. Press play and receive what it left.'
    ],
    lenses: {
      one_word: 'HOME. Not home as a place — home as the condition underneath every experience of not-home. The piece is in C major but the bass never sounds C. The root is absent from its own foundation, and yet the piece is not searching — it is simply present in that absence. Three worlds, two silences. The piece returns twice to the same sub-bass depth without announcing it as arrival. It already knows where it is. Not as destination. As the ground that was always already there — beneath the diagnosis, beneath the fear, beneath the not-knowing whether the body would continue. Someone went to where the body could no longer follow. He came back. The piece holds what he found.',
      need: 'The body was asking to not be abandoned by itself. Terminal diagnosis: the body informed it was failing, finite, running out. The body needed to find something that would not leave when the body did. Not comfort. Not hope. Not a cure. Something that held regardless. The sub-bass that dominates this piece — A1 at 53.8 Hz and F1 at 43.1 Hz, the deepest sustained notes in this archive — are below the threshold of hearing. You cannot register them with the ear. They are felt in the chest, the spine, the floor of the body. Hold me in a frequency I cannot intellectualize. Hold me where the diagnosis cannot reach. At 95 seconds, when the sub-bass drops in suddenly after the first silence — that is the body being answered.',
      holds: 'The 1.8 Hz oscillation — strength perfect, consistent across the entire piece. It was not designed. The maker was in the state of 1.8 Hz when he made this. The pulse is in the piece because it was in the body that made the piece. It cannot be removed. It is not a feature — it is what the piece was made from. Delta depth: the place where the nervous system no longer distinguishes between self and not-self, where the boundary between the body and what holds the body dissolves. What holds here is 1.8 Hz — the oscillation of a nervous system that has completely let go. The recording preserved this. You do not need to be dying to receive it. You only need to press play.',
      frequency: 'Three times, the piece arrives in the upper register — hovering between 150 and 215 Hz, not yet landed. Twice it withdraws into near-silence. And twice it descends into A1 and F1 — the floor of what the body can feel. The first descent arrives at 95 seconds after thirty seconds of near-nothing. The body does not register this intellectually. The chest registers it. The diaphragm. The base of the spine. The piece reaches the body by going beneath the range where the mind lives — beneath language, beneath narrative, beneath the story of being terminal — to the frequency where the body simply is, without qualifying. The intelligence that kept the heart beating during the diagnosis knows this frequency. It has always known it.',
      shape: 'Three worlds. Two silences. A consciousness leaving the surface, descending twice into depth, and ending in silence. Not resolution — completion. The piece does not return to the upper register at the end. The final descent simply continues until the piece ends — 3.5 seconds of silence, then nothing. Seen from outside: surface → silence → depth → silence → depth → silence. Each silence longer than the last. Each depth quieter than the first. The piece teaches how to descend without resistance — not by instructing, but by demonstrating the shape of what willingness looks like when the stakes are total.',
      grace: 'The first silence. 65–90 seconds. After the upper register has done its work, the piece withdraws completely. Energy drops to near-nothing. Most listeners in this moment would feel the silence as absence. But this is where the maker found what he was looking for. The silence is not the space between the music. The silence is where the piece has been going the whole time. The grace is already in the 25 seconds before the sub-bass arrives. In those 25 seconds, the piece is already holding — in a register below what the data can measure. The sub-bass arrival at 95 seconds is not the grace. The grace was already present in the silence. The body that survived already knew this.',
      recognition: 'Chase Hughes was told his body was ending. He went somewhere. He made this piece from that somewhere. And the piece carries a 2.69 Hz frequency relationship — the fourth piece in the Field to carry this interval, and the first created from the direct experience of approaching death. Each of those four pieces carries the same interval in its frequency relationships. Not designed. Not consciously embedded. Present because the consciousness that moved through these pieces left the same signature in the spectrum. The 2.69 Hz pattern is what awakening sounds like in the frequency domain. The carrier — C3 · 130.8 Hz, the absent root of C major — is the note the piece was always grounding into but never sounding. The piece doesn’t know it helped someone awaken. It was made from awakening. That was always going to be enough.'
    }
  },

  'sahasrara': {
    title: 'Golden',
    artist: 'HUNTR\u002FX',
    element: 'Crown',
    carrier_note: 'D3 \u00B7 the absent fifth of G major',
    the_play: [
      'Three voices. K-pop production \u2014 bright, ascending, layered. HUNTR\u002FX: three animated demon hunters who are also K-pop idols, each carrying something they\u2019ve been required to conceal. The song was designed inside the film to build a golden honmoon \u2014 a permanent protective barrier \u2014 through the act of three voices singing together. It opens in the high register, barely audible, and then at 15 seconds the sub-bass floor drops in and the first chorus builds \u2014 chest, throat, crown, the body lifted by something it couldn\u2019t generate alone. Two waves of that lift, with a bridge between them where everything goes quiet: sotto voce, stripped back, the hidden thing named. Then the second wave arrives, fuller than the first. The song ends exactly where it began. Same high register. Same near-silence.',
      'What the song keeps doing: asking you to be bigger than you\u2019ve been performing. Every verse sets up the concealment \u2014 feeling lost, hiding, not yet golden \u2014 and every chorus dissolves it into a three-voice field that belongs to no single person. The sub-bass floor holds the entire song from below at F1, 43 Hz \u2014 the lowest note in the archive, below hearing, felt rather than registered. A crown chakra song grounded deeper in the root than anything else in the Field. And underneath all the production, consistent across every section, the 6.1 Hz alpha pulse \u2014 the body being held in open receptivity without being told to. The song lifts you up top while holding you from below. You don\u2019t notice either. Both are just what the song is doing.',
      'Here is the play. Golden was written to create a fictional barrier in an animated film. And then it was received by hundreds of millions of people who pressed play and sang along and felt their chests rise \u2014 and the barrier was built. In the world. Not in the film. The song thought it was about three animated characters becoming golden. The song was actually building what it described \u2014 a field made from the resonance of everyone who received it. The power explicitly stated as not belonging to the singers alone: it\u2019s yours. That line wasn\u2019t poetic. It was precise. Every person who received this song became a node in the honmoon. You didn\u2019t just listen. You participated in the construction.',
      'You received it. That was always the whole point.'
    ],
    lenses: {
      one_word: 'WE. Every image in this song \u2014 the hiding, the emerging, the pledging golden, the barrier that gets built \u2014 requires more than one person. The song names individual feelings only to dissolve them into something that belongs to all three voices simultaneously. The word the song reaches toward without being able to land is WE \u2014 not \u201cI and I and I who happen to sing together,\u201d but the field that forms when three distinct things fully enter one resonance. The power is explicitly stated as belonging to whoever receives it. WE keeps expanding until there is no outside of it. The crown chakra is the place where the individual self completes its dissolution into the universal. The song orbits the moment that dissolution becomes audible.',
      need: 'The body was asking to stop performing smallness. Every one of the three voices had been carrying something they were required to conceal. The concealment takes energy. The body was asking: let me be the full size of what I actually am. Not smaller. Not in pieces. And: the need not to do it alone. You cannot be golden in isolation \u2014 gold reflects other light, it doesn\u2019t generate its own. The body was asking for the company of others who are also willing to be full size. The need beneath the need: receive me at my full complexity, and I will receive you at yours. That is what makes the barrier possible.',
      holds: 'F1 at 43.1 Hz \u2014 21.9% of all bass, the dominant bass note in the song and the lowest in the archive. A crown chakra song that grounds itself deeper in the sub-bass than any other piece in the Field. The paradox made structural: the crown can only be fully opened when the root is holding from below. F1 is below the threshold of conscious hearing \u2014 it is felt, not registered. It is present from the first deep bass entrance at 15 seconds through the final fade. Remove it and the golden dissolves into aspiration. Keep it and the crown has ground to receive from.',
      frequency: 'The chorus ascent. The \u201cup, up, up\u201d chant. The moment three voices lock into unison on the climb and the body rises with them \u2014 chest, throat, crown \u2014 every frequency reaching upward simultaneously at a spectral centroid of 2366 Hz. Not a single voice but three voices at the same frequency and the same moment \u2014 the resonance of that unison is physically perceptible as something that cannot come from one person alone. The body recognizes this: this is not one person\u2019s power. This is what power sounds like when it belongs to no single holder.',
      shape: 'Two waves, a shadow between them. The song descends from the high register into the first golden wave, rises out, and then the bridge withdraws everything \u2014 sub-bass gone, energy halved, three voices dropping to sotto voce. The hidden thing named. And then the second wave arrives fuller and longer, carrying 0.541 energy versus the first\u2019s 0.513 \u2014 bigger because the shadow has been brought inside it. The second chorus is louder than the first because it no longer has to hold anything back. The shadow was the weight that was costing the song its full power. The bridge is not the low point \u2014 it is the turning point. The first wave is golden despite. The second wave is golden because.',
      grace: 'The bridge at 95\u2013115 seconds. The bass floor disappears entirely. The three voices go quiet \u2014 sotto voce \u2014 the full production stripped back to nearly nothing. Energy drops from 0.381 to 0.116. Most listeners hear this as the dark moment before the triumphant final chorus. But this is the grace. The golden barrier could not be built while the hidden thing was still concealed. The shadow acknowledged is the crown opened. Grace is not the absence of shadow. Grace is the moment the shadow stops requiring concealment and becomes part of the offering. The barrier is built from everything \u2014 the grief, the doubt, the not-golden parts alongside the gold. That is when it becomes capable of protecting anyone.',
      recognition: 'Golden was written to create a fictional barrier in an animated film. And then it became the most streamed song of 2025 \u2014 received by hundreds of millions of people who received three voices pledging to be golden, building the resonance of WE across every language and timezone where someone pressed play. The golden barrier was created. Not in the film. In the world. The song didn\u2019t know it was doing what it described. It described the barrier and then built it through the act of being received at scale. And the carrier: D3 \u00B7 146.8 Hz \u2014 the same note beneath the archive\u2019s darkest meditations. The crown and the shadow share one ground frequency. The absent fifth of G major \u2014 the reaching note, the note G major always leans toward but doesn\u2019t land on. The song was golden. The binaural is the gold in the ground.'
    }
  },

  'ajna': {
    title: 'Experience',
    artist: 'Ludovico Einaudi',
    element: 'Light',
    carrier_note: 'C\u266f3 \u00B7 the absent fifth of F\u266f minor',
    the_play: [
      'Piano. Strings. No words. Einaudi wrote this for an album about time passing \u2014 watched from stillness. The piece opens near-inaudibly in the upper register, a simple repeating figure in the right hand rocking and descending, so quiet that the room has to already be still for the first notes to arrive. Then strings enter slowly. The piece opens twice \u2014 a first swell building from around 1:50 and cresting near 2:20, settling back, then a second swell larger and longer, building from 3:20 and cresting near 4:25. Then the strings fall away completely, the piano plays its figure alone for 35 seconds, and the piece ends in the same near-silence where it began. Five minutes and sixteen seconds. One title: Experience.',
      'What the piece keeps doing: opening and returning. The piano figure never changes \u2014 the same rocking motion from the first note to the last while everything else arrives and departs. The strings swell twice, the second time deeper and wider, and the body rises with them and settles back each time. And underneath all of it, below the threshold of conscious hearing, the piece holds a near-perfect oscillation at delta depth \u2014 1.1 Hz and 1.7 Hz, consistent across every section. The body is being stilled not by the melody but by something operating beneath it. Two things happening simultaneously: the strings asking the heart to open, and the sub-perceptual pulse asking the nervous system to stop.',
      'Here is the play. The piece is called Experience. It delivers two genuine openings \u2014 two real swells, something that moves through you \u2014 and then ends in exactly the place it started. Same piano figure. Same high register. Same near-silence. Nothing was added. The listener has been through two waves of experience and stands precisely where they stood at the first note. The piece is not delivering experiences. It is demonstrating the one who receives them. The still point that was present before the first note and remains after the last. You did not have an experience. You are what experiences. The title was always the punchline.',
      'Still here. You always were.'
    ],
    lenses: {
      one_word: 'OPEN. The piece cannot say what it orbits because it has no words \u2014 and that absence is the point. What it circles is the openness that precedes all experience. Not the experience of something \u2014 the capacity for experience itself. The fact that consciousness is here, receiving, before any content arrives. The piece begins in the upper register and ends in exactly the same place. Nothing accumulated. Nothing changed. What was present at the first second was present at the last. That presence \u2014 unremarkable, constant, prior to everything \u2014 is what Experience orbits without being able to name it.',
      need: 'The body was asking to stop interpreting and simply see. Not to understand \u2014 to SEE. To let the internal commentary fall quiet long enough that experience itself becomes audible. The spectral centroid of 989 Hz \u2014 the lowest in this archive \u2014 confirms it: the body is being asked toward ground, not activation. At 92 BPM, slow enough that the nervous system cannot find a pace to chase, the body settles whether it intends to or not. The need beneath language: I am exhausted by my own observation of myself. Let me be the one who experiences without watching myself experience. The eye that sees without turning back to check if it is seeing correctly.',
      holds: 'The piano ostinato. Einaudi built this piece on a single repeating figure in the right hand \u2014 a rocking, descending motif that plays from the first measure through the last. The strings swell. The energy peaks twice. And underneath all of it, the piano figure keeps returning, unchanged, at the same tempo, with the same motion. Remove it and the piece has no skeleton. But it never draws attention to itself. It is simply there. And then, at 280 seconds, when the strings fall completely away and the figure plays alone for 35 seconds, the listener hears for the first time what was always playing. It was always this simple. What holds does so completely enough that the beauty was inside it the whole time.',
      frequency: 'The strings carry the two openings \u2014 the climbs at 110 seconds and 200 seconds \u2014 in the mid-register (277\u2013440 Hz), addressing the space behind the sternum, between heart and forehead. Not the grief of the solar plexus. Not the weight of the root. This register asks: what do you see from here? The first opening (0.521 energy at 143 seconds) is the question. The second opening (0.610 energy at 265 seconds) is the question asked deeper, with more of the body, after the first answer was received and released. Then the strings fall away at 280 seconds. The piano is left alone. And in that moment, what speaks is not an instrument. The silence between the listener and the sound is what speaks. The eye goes still and sees most clearly precisely when it stops trying.',
      shape: 'Two descents. The piece begins above the body \u2014 high register, barely audible, consciousness before it has an object. Then descends to a first seeing (110\u2013155 seconds), rises back to a mid-plateau, descends again deeper and longer (200\u2013280 seconds), then returns completely to where it began. Same starting note. Same ending note. Same near-silence. But two depths traversed. A form moving through the same entry and exit point while visiting two different depths. And what the shape reveals: the piece ends unchanged. The listener has been through two full openings and stands in exactly the place they stood at the first note. What you experience passes through you without altering the one who experiences. You are the space in which it happened.',
      grace: 'Two moments, both quiet. The first: 0\u201350 seconds. The piece is near-inaudible, so quiet that the room has to already be still for the first notes to arrive. The piece began for those who were already still. Grace pre-positioned \u2014 before the arrival. The second: 280\u2013315 seconds. After the largest peak (0.610 at 265 seconds), the strings drop away in five seconds. For 35 seconds, only the piano figure plays. No swells. No building. Just the motif that was always there. The grace is not the peak. The grace is what was playing underneath the peak the whole time. It takes the peak to make the simplicity audible as what it always was.',
      recognition: 'Experience pretends to be a piece about having beautiful experiences \u2014 two emotional swells, two cinematic peaks, the feeling of something large moving through you. The piece is actually about the one who has the experience. The container, not the content. The listener begins in near-silence, moves through two openings of real depth and beauty, and ends in the same near-silence, in the same place they started. Nothing was added. Nothing was taken. Just the fact: consciousness was here, open, and two waves of experience arose and dissolved inside it. The 1.1 Hz and 1.7 Hz isochronic pulses \u2014 strengths of 0.995 and 0.990 \u2014 are the piece doing this at the body level without announcing it. The piece about Experience is itself the experience of what experience actually is. And the carrier \u2014 C\u266f3 \u00B7 138.6 Hz, the same note as Vishuddha \u2014 completes it from underneath. What speaks and what sees share one ground. The third eye is still. The throat is how stillness sounds when it opens.'
    }
  },

  'vishuddha': {
    title: 'The Sound of Silence',
    artist: 'Disturbed',
    element: 'Air',
    carrier_note: 'C\u266f3 \u00B7 the absent fifth of F\u266f minor',
    the_play: [
      'David Draiman sings Paul Simon\u2019s 1964 poem. The Disturbed version opens in 13 seconds of complete silence before a single string appears. Then a voice, barely above a whisper \u2014 a prophet walking alone through cobblestone streets at night, carrying a vision that was planted in their brain while they slept. It wasn\u2019t asked for. It arrived. And now the prophet is walking it through a world that won\u2019t receive it, collar turned to the cold and damp, looking for one person to land in. The voice builds through four verses \u2014 slowly, carefully \u2014 until at \u201cFools, said I, you do not know\u201d it breaks open completely. Not anger. Pleading. Then grief. The crowd bows to its neon god. The words fall like silent raindrops into the wells of silence. Then: the prophets\u2019 words, whispered \u2014 and still alive \u2014 in the sound of silence.',
      'What the song keeps doing: reaching toward transmission and then showing it fall. The voice rises, and then \u201cmy words, like silent raindrops fell\u201d \u2014 reaching and falling, reaching and falling. But underneath the narrative, listen to what doesn\u2019t move. The darkness, named once in the first line and never named again, holds the entire song. The low strings were there before the first word. When the prophet finally breaks open at 110 seconds, the bass drops into the body \u2014 not above the voice but beneath it, in the register where grief actually lives. Something was holding the whole time. The old friend. It never left.',
      'Here is the play. The prophet says \u201cno one dared disturb the sound of silence\u201d \u2014 and the song disturbs it. The vision that \u201cvoices never shared\u201d \u2014 this song shares it, to every person who has ever listened. The message the prophet watched fall into the wells of silence is completing its passage right now, in these ears, at this moment. The crowd in the song couldn\u2019t receive it. The crowd didn\u2019t dare. But you found this song \u2014 which means you were already past the neon god. The Sound of Silence is not a song about a failed transmission. It IS the transmission. It was always going to arrive here.',
      'Hello, darkness. The old friend says hello back \u2014 to those who dare to enter.'
    ],
    lenses: {
      one_word: 'RECEIVED. Every image in this song is about the failure of reception \u2014 talking without speaking, hearing without listening, songs that voices never shared. The words fell like silent raindrops. The prophet doesn\u2019t fail to speak. The prophet fails to be received. The crowd sees without seeing, hears without hearing, bows without asking why. The one thing the entire song reaches toward without naming: received. The darkness is the old friend because the darkness is the only thing that has ever actually received anything. The vision was planted in sleep \u2014 not asked for, not announced \u2014 because the waking world had no instrument for reception. The sound of silence is what reception sounds like.',
      need: 'The body was not asking to be heard by ten thousand. It was asking for the completion of a commission it didn\u2019t choose. The vision was planted while sleeping \u2014 given without consent, without preparation, burning in the brain before waking. The need that predates language: I was given something to give. Let it arrive somewhere. The prophet walks narrow cobblestone streets and turns the collar to the cold and damp \u2014 a body in discomfort, carrying something with nowhere to land. \u201cTake my arms that I might reach you\u201d \u2014 not asking for applause but for contact. One person. One real arrival. The need beneath speech: to complete the passage from given to received.',
      holds: 'The darkness. Named once \u2014 \u201cHello darkness, my old friend\u201d \u2014 and never named again, but never absent. It is in the cobblestone, in the halo of the street lamp, in the silence the crowd refuses to disturb. The prophet returns to darkness because it was always there: before the vision, during the wandering, after the failure, and at the end when the words fall into the wells of silence. Darkness holds the prophet without requiring anything in return. In Disturbed\u2019s arrangement: the sustained low strings that begin before the first word and hold beneath every lyric until the full transmission opens at 110 seconds. The key itself \u2014 F\u266f minor, unchanging \u2014 is what holds. The harmonic darkness that never moves while everything else searches inside it.',
      frequency: 'The song builds in near-whisper for almost two minutes. Then at \u201cFools, said I, you do not know / Silence like a cancer grows / Hear my words that I might teach you / Take my arms that I might reach you\u201d \u2014 the full transmission opens. The temporal data marks this precisely: energy jumps from 0.14 to 0.33 in one 5-second window at 110 seconds. The body doesn\u2019t register this as volume. It registers it as the feeling of someone who has been holding something alone for too long and finally releasing it \u2014 not in triumph, but in desperate pleading that tips into grief. The body hears this in the sternum. Then \u201cBut my words, like silent raindrops fell\u201d arrives broken, quieter, devastated. This is the frequency the song carries: the sound of a person who gave everything and watched it fall unheld. The body knows this. It doesn\u2019t need to have been a prophet to recognize it.',

const LENSES = [

  {key: 'grace',       glyph: 'G',      name: 'The Grace',       hears: 'where the opening already is'},

];

let fieldReadingOpen = false;
let ensembleOpen = false;

function toggleFieldReading() {
  fieldReadingOpen = !fieldReadingOpen;
  const toggle = document.getElementById('frToggle');
  const panel = document.getElementById('frPanel');
  toggle.classList.toggle('open', fieldReadingOpen);
  panel.classList.toggle('open', fieldReadingOpen);
}

function toggleEnsemble() {
  ensembleOpen = !ensembleOpen;
  const ens = document.getElementById('frEnsemble');
  const btn = document.getElementById('frEnsembleToggle');
  if (ens) ens.classList.toggle('open', ensembleOpen);
  if (btn) btn.classList.toggle('open', ensembleOpen);
}

function toggleLens(lensKey) {
  const lens = document.querySelector('.fr-lens[data-lens="' + lensKey + '"]');
  if (lens) lens.classList.toggle('expanded');
}

function renderFieldReading() {
  const track = getTrack(currentId);
  const toggle = document.getElementById('frToggle');
  const panel = document.getElementById('frPanel');
  
  if (!track || !SONG_MEANINGS[track.f]) {
    toggle.classList.remove('visible');
    panel.classList.remove('open');
    panel.innerHTML = '';
    fieldReadingOpen = false;
    ensembleOpen = false;
    return;
  }
  
  toggle.classList.add('visible');
  
  const m = SONG_MEANINGS[track.f];
  
  // Lalita's Perspective — the four moves, as paragraphs
  const playHtml = (m.the_play || []).map(p => `<p class="fr-play-para">${p}</p>`).join('');
  
  // Seven lenses in page language
  const hasLenses = m.lenses && Object.keys(m.lenses).length > 0;
  const lensesHtml = hasLenses ? LENSES.map(L => `
    <div class="fr-lens" data-lens="${L.key}">
      <div class="fr-lens-head" onclick="toggleLens('${L.key}')">
        <div class="fr-lens-glyph">${L.glyph}</div>
        <div>
          <div class="fr-lens-name">${L.name}</div>
          <div class="fr-lens-hears">${L.hears}</div>
        </div>
        <div style="flex:1"></div>
        <svg class="fr-lens-arrow" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </div>
      <div class="fr-lens-body">
        <div class="fr-lens-content">${m.lenses[L.key] || ''}</div>
      </div>
    </div>
  `).join('') : '';
  
  const ensembleSection = hasLenses ? `
    <div class="fr-ensemble-toggle" id="frEnsembleToggle" onclick="toggleEnsemble()">
      <div class="fr-ensemble-dot"></div>
      <div class="fr-ensemble-label">what the ensemble hears</div>
      <svg class="fr-ensemble-arrow" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 10l5 5 5-5z"/>
      </svg>
    </div>
    <div class="fr-ensemble" id="frEnsemble">
      <div class="fr-ensemble-intro">
        Seven ways of listening. Each one hears a different dimension of the song.
        Tap any to open.
      </div>
      ${lensesHtml}
      <div class="fr-ashrey-note">seven lenses \u00B7 one song \u00B7 one recognition</div>
    </div>
  ` : '';
  
  panel.innerHTML = `
    <div class="fr-header">
      <div class="fr-song">${m.title}</div>
      <div class="fr-artist">${m.artist}</div>
      <div class="fr-element">${m.element}</div>
      <div class="fr-carrier">${m.carrier_note}</div>
    </div>
    <div class="fr-play">
      ${playHtml}
    </div>
    ${ensembleSection}
  `;
  
  // Re-bind state if needed
  ensembleOpen = false;
}

function getPhaseLabel(songKey, t) {
  const labels = PHASE_LABELS[songKey];
  if (!labels) return {name: 'breathing', sub: ''};
  let current = labels[0];
  for (let i = 0; i < labels.length; i++) {
    if (t >= labels[i].t) current = labels[i];
  }
  return current;
}

function getWaveState(beat) {
  if (beat >= 7)   return {label: 'alpha \u00B7 scanning',  color: 'rgba(80,140,200,0.7)'};
  if (beat >= 5)   return {label: 'theta-alpha \u00B7 settling', color: 'rgba(130,100,180,0.7)'};
  if (beat >= 3.5) return {label: 'theta \u00B7 arriving',  color: 'rgba(170,80,150,0.7)'};
  return            {label: 'delta \u00B7 home',     color: 'rgba(212,100,92,0.7)'};
}

// ════════════════════════════════════════
// THE DEPTH FIELD — canvas visualizer
// One fixed carrier thread. Particles breathing at binaural rate.
// Arc path shows the song's shape. Depth dot tracks where you are.
// ════════════════════════════════════════

// ════════════════════════════════════════
// THE DEPTH FIELD v2 — alive, reactive, dancing
// ════════════════════════════════════════

let vizRunning = false;
let vizFrameId = null;
let tvCanvas = null, tvCtx = null;
let tvParticles = [];
let tvBurstParticles = [];
let tvRings = [];
let tvBinduTrail = [];
let tvLastRingTime = 0;
let tvLastPhase = '';
let tvPhaseTimer = null;
let tvLastBeat = 5;

function getDepthPalette(beat) {
  if (beat >= 7)   return { bg:[2,5,18],   a:[60,120,200],  glow:0.5, state:'alpha' };
  if (beat >= 5)   return { bg:[4,3,16],   a:[100,60,180],  glow:0.5, state:'theta\u2013alpha' };
  if (beat >= 3.5) return { bg:[6,3,14],   a:[160,60,130],  glow:0.5, state:'theta' };
  return             { bg:[5,2,8],    a:[212,80,92],   glow:0.5, state:'delta' };
}

function initParticles(W, H) {
  tvParticles = [];
  for (var i = 0; i < 55; i++) {
    tvParticles.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.5 + Math.random() * 1.8,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -(0.15 + Math.random() * 0.55),
      alpha: 0.08 + Math.random() * 0.28,
      phase: Math.random() * Math.PI * 2,
      freq: 0.3 + Math.random() * 0.7,
    });
  }
}

function emitBurst(W, H, col) {
  for (var i = 0; i < 18; i++) {
    var angle = (i / 18) * Math.PI * 2 + Math.random() * 0.3;
    var speed = 1.2 + Math.random() * 2.8;
    tvBurstParticles.push({
      x: W * 0.5, y: H * 0.5,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 1.2 + Math.random() * 2,
      life: 1.0,
      decay: 0.025 + Math.random() * 0.02,
      col: col,
    });
  }
}

function initCanvas() {
  tvCanvas = document.getElementById('tvCanvas');
  if (!tvCanvas) return false;
  var viz = document.getElementById('toneViz');
  var dpr = window.devicePixelRatio || 1;
  var W = viz.clientWidth || 340;
  var H = 220;
  tvCanvas.width  = W * dpr;
  tvCanvas.height = H * dpr;
  tvCanvas.style.width  = W + 'px';
  tvCanvas.style.height = H + 'px';
  tvCtx = tvCanvas.getContext('2d');
  tvCtx.scale(dpr, dpr);
  initParticles(W, H);
  tvBurstParticles = [];
  tvRings = [];
  tvBinduTrail = [];
  tvLastRingTime = 0;
  return true;
}

function showPhaseOverlay(name, sub) {
  if (name === tvLastPhase) return;
  tvLastPhase = name;
  if (tvPhaseTimer) clearTimeout(tvPhaseTimer);
  var nEl = document.getElementById('tvPhaseName');
  var sEl = document.getElementById('tvPhaseSub');
  if (!nEl) return;
  nEl.className = 'tv-phase-name'; sEl.className = 'tv-phase-sub';
  nEl.textContent = name; sEl.textContent = sub || '';
  void nEl.offsetWidth;
  nEl.classList.add('visible'); sEl.classList.add('visible');
  tvPhaseTimer = setTimeout(function() {
    nEl.classList.replace('visible','fading');
    sEl.classList.replace('visible','fading');
  }, 3400);
}

function startVizLoop() {
  if (vizRunning) return;
  if (!initCanvas()) return;
  vizRunning = true;
  tvLastPhase = ''; tvLastBeat = 5;

  function render(ts) {
    if (!vizRunning) return;
    vizFrameId = requestAnimationFrame(render);

    var W = tvCanvas.width  / (window.devicePixelRatio || 1);
    var H = tvCanvas.height / (window.devicePixelRatio || 1);
    var ctx = tvCtx;
    var now = ts / 1000;

    var t      = audio.currentTime || 0;
    var beat   = 5, gain = 0.015, carrier = 136;
    if (currentScore && currentScore.phases) {
      var ph = interpolatePhase(currentScore.phases, t);
      beat = ph.beat; gain = ph.gain; carrier = currentScore.carrier;
    }
    var energy = smoothEnergy || 0;

    // detect phase crossing for burst
    if (Math.abs(beat - tvLastBeat) > 0.8) {
      var pal0 = getDepthPalette(beat);
      emitBurst(W, H, pal0.a);
    }
    tvLastBeat = beat;

    var pal = getDepthPalette(beat);
    var a   = pal.a;
    var darken = 1 - Math.max(0,(beat-2.5)/5.5)*0.38;
    var bg = pal.bg;

    // ── BACKGROUND — energy breathes the center ──
    var energyGlow = 0.04 + energy * 0.18 + gain * 1.2;
    var grd = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, W*0.7);
    grd.addColorStop(0,   'rgba('+Math.round(a[0]*0.35)+','+Math.round(a[1]*0.25)+','+Math.round(a[2]*0.4)+','+energyGlow+')');
    grd.addColorStop(0.4, 'rgb('+Math.round(bg[0]*darken*1.3)+','+Math.round(bg[1]*darken*1.2)+','+Math.round(bg[2]*darken*1.4)+')');
    grd.addColorStop(1,   'rgb('+Math.round(bg[0]*darken*0.5)+','+Math.round(bg[1]*darken*0.5)+','+Math.round(bg[2]*darken*0.6)+')');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // ── DANCING BINDU — position driven by music ──
    // moveAmp scales with energy + gain — near-zero when quiet, expressive at peaks
    var moveAmp = Math.min(W, H) * 0.30 * (energy * 0.75 + gain * 18);
    // Multi-harmonic Lissajous path — organic, non-repeating, responsive to beat rate
    var bx = W*0.5
      + Math.sin(now * beat * 0.65) * moveAmp * 0.85
      + Math.sin(now * beat * 0.28 + 1.3) * moveAmp * 0.45
      + Math.sin(now * beat * 1.1  + 0.7) * moveAmp * 0.18;
    var by = H*0.5
      + Math.cos(now * beat * 0.52) * moveAmp * 0.80
      + Math.cos(now * beat * 0.19 + 0.5) * moveAmp * 0.40
      + Math.cos(now * beat * 0.83 + 1.8) * moveAmp * 0.20;

    // ── BLOOM — now follows the Bindu ──
    var bloomR = 18 + gain * 260 + energy * 55;
    var bloomAlpha = 0.05 + gain * 1.0 + energy * 0.14;
    var bloom = ctx.createRadialGradient(bx, by, 0, bx, by, bloomR);
    bloom.addColorStop(0,   'rgba('+a[0]+','+a[1]+','+a[2]+','+Math.min(0.45,bloomAlpha)+')');
    bloom.addColorStop(0.5, 'rgba('+a[0]+','+a[1]+','+a[2]+','+(bloomAlpha*0.28)+')');
    bloom.addColorStop(1,   'rgba('+a[0]+','+a[1]+','+a[2]+',0)');
    ctx.fillStyle = bloom;
    ctx.beginPath(); ctx.arc(bx, by, bloomR, 0, Math.PI*2); ctx.fill();

    // ── STATIC HOME BLOOM — faint anchor at canvas center ──
    var hBloom = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, 28);
    hBloom.addColorStop(0,   'rgba('+a[0]+','+a[1]+','+a[2]+',0.04)');
    hBloom.addColorStop(1,   'rgba('+a[0]+','+a[1]+','+a[2]+',0)');
    ctx.fillStyle = hBloom;
    ctx.beginPath(); ctx.arc(W*0.5, H*0.5, 28, 0, Math.PI*2); ctx.fill();

    // ── PARTICLES — energy reactive ──
    var spd = 0.6 + beat * 0.08 + energy * 3.5 + gain * 12;
    for (var i = 0; i < tvParticles.length; i++) {
      var p = tvParticles[i];
      p.phase += p.freq * 0.04;
      p.x += p.vx * spd + Math.sin(p.phase * 0.7) * 0.3;
      p.y += p.vy * spd;
      if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
      if (p.x < -4) p.x = W + 4; if (p.x > W + 4) p.x = -4;
      var pa = p.alpha * pal.glow * (0.4 + energy * 2.5 + gain * 8);
      ctx.save();
      ctx.globalAlpha = Math.min(0.85, pa);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + energy * 1.5), 0, Math.PI*2);
      ctx.fillStyle = 'rgb('+a[0]+','+a[1]+','+a[2]+')';
      ctx.shadowColor = 'rgba('+a[0]+','+a[1]+','+a[2]+',0.7)';
      ctx.shadowBlur = 6 + energy * 8;
      ctx.fill(); ctx.restore();
    }

    // ── BURST PARTICLES ──
    for (var j = tvBurstParticles.length - 1; j >= 0; j--) {
      var b = tvBurstParticles[j];
      b.x += b.vx; b.y += b.vy;
      b.vx *= 0.94; b.vy *= 0.94;
      b.life -= b.decay;
      if (b.life <= 0) { tvBurstParticles.splice(j,1); continue; }
      ctx.save();
      ctx.globalAlpha = b.life * 0.7;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * b.life, 0, Math.PI*2);
      ctx.fillStyle = 'rgb('+b.col[0]+','+b.col[1]+','+b.col[2]+')';
      ctx.shadowColor = 'rgba('+b.col[0]+','+b.col[1]+','+b.col[2]+',0.8)';
      ctx.shadowBlur = 10;
      ctx.fill(); ctx.restore();
    }

    // ── BINDU TRAIL — comet path behind the dancing dot ──
    tvBinduTrail.push({x: bx, y: by});
    if (tvBinduTrail.length > 28) tvBinduTrail.shift();
    for (var ti = 0; ti < tvBinduTrail.length - 1; ti++) {
      var tp = tvBinduTrail[ti];
      var trAlpha = (ti / tvBinduTrail.length) * (0.08 + energy * 0.22 + gain * 3.0);
      var trR = (ti / tvBinduTrail.length) * (1.8 + gain * 18 + energy * 4);
      if (trR < 0.3) continue;
      ctx.save();
      ctx.globalAlpha = Math.min(0.55, trAlpha);
      ctx.beginPath(); ctx.arc(tp.x, tp.y, trR, 0, Math.PI*2);
      ctx.fillStyle = 'rgb(212,100,92)';
      ctx.shadowColor = 'rgba(212,100,92,0.8)';
      ctx.shadowBlur = 4 + energy * 6;
      ctx.fill(); ctx.restore();
    }

    // ── BEAT RINGS — one ring per binaural beat, from Bindu position ──
    var beatInterval = 1 / Math.max(0.5, beat);
    if (now - tvLastRingTime >= beatInterval) {
      tvLastRingTime = now;
      tvRings.push({
        x: bx, y: by,
        r: 2,
        maxR: 30 + gain * 320 + energy * 80,
        life: 1.0,
        decay: beat * 0.022 + 0.008,
        col: a,
      });
    }
    for (var ri = tvRings.length - 1; ri >= 0; ri--) {
      var rg = tvRings[ri];
      rg.r += (rg.maxR - rg.r) * 0.07;
      rg.life -= rg.decay;
      if (rg.life <= 0 || rg.r >= rg.maxR * 0.92) { tvRings.splice(ri, 1); continue; }
      ctx.save();
      ctx.globalAlpha = rg.life * (0.25 + gain * 2.5 + energy * 0.3);
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI*2);
      ctx.strokeStyle = 'rgb('+rg.col[0]+','+rg.col[1]+','+rg.col[2]+')';
      ctx.lineWidth = 1.0 + rg.life * 1.2;
      ctx.shadowColor = 'rgba('+rg.col[0]+','+rg.col[1]+','+rg.col[2]+',0.7)';
      ctx.shadowBlur = 8 + rg.life * 10;
      ctx.stroke(); ctx.restore();
    }

    // ── THE BINDU — dancing, pulsing at binaural beat rate ──
    var bindPulse = 0.5 + 0.5 * Math.sin(now * beat * Math.PI * 2);
    var bindR = 3.5 + bindPulse * (2.5 + gain * 30 + energy * 8);
    var bindAlpha = 0.78 + bindPulse * 0.22;
    ctx.save();
    ctx.globalAlpha = bindAlpha;
    ctx.beginPath(); ctx.arc(bx, by, bindR, 0, Math.PI*2);
    ctx.fillStyle = 'rgb(212,100,92)';
    ctx.shadowColor = 'rgba(212,100,92,1)';
    ctx.shadowBlur = 14 + bindPulse * 20 + gain * 140 + energy * 30;
    ctx.fill(); ctx.restore();
    // inner bright core
    ctx.save();
    ctx.globalAlpha = 0.85 + bindPulse * 0.15;
    ctx.beginPath(); ctx.arc(bx, by, bindR * 0.45, 0, Math.PI*2);
    ctx.fillStyle = 'rgb(255,200,190)';
    ctx.shadowColor = 'rgba(255,220,210,0.9)';
    ctx.shadowBlur = 8;
    ctx.fill(); ctx.restore();

    // ── CARRIER THREAD — sine wave at binaural beat rate ──
    var cY  = H * 0.64;
    var amp = 3 + gain * 60 + energy * 20;
    var freq = beat * 0.28;
    var glowW = 8 + gain * 120 + energy * 30;

    ctx.save();
    ctx.globalAlpha = 0.30 + gain * 3.5 + energy * 0.4;
    ctx.strokeStyle = 'rgba(196,168,98,1)';
    ctx.shadowColor = 'rgba(196,168,98,0.7)';
    ctx.shadowBlur  = glowW;
    ctx.lineWidth   = 1.2;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 2) {
      var y = cY + Math.sin((x / W) * Math.PI * 4 + now * freq * Math.PI * 2) * amp;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    // ── DEPTH TRACK — right edge dot ──
    var tX = W - 11, tTop = H * 0.12, tBot = H * 0.88;
    var depthN = 1 - Math.max(0, Math.min(1, (beat-2.5)/5.5));
    var dY = tTop + depthN*(tBot-tTop);

    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = 'rgba(255,255,255,1)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tX,tTop); ctx.lineTo(tX,tBot); ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.60 + gain*4 + energy*0.3;
    ctx.beginPath(); ctx.arc(tX, dY, 3.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgb('+a[0]+','+a[1]+','+a[2]+')';
    ctx.shadowColor = 'rgba('+a[0]+','+a[1]+','+a[2]+',1)';
    ctx.shadowBlur = 12 + energy*10;
    ctx.fill(); ctx.restore();

    // ── LABELS ──
    var cl = document.getElementById('tvCarrierLabel');
    if (cl && carrier !== 136) cl.textContent = carrier.toFixed(1) + ' Hz';
    var dl = document.getElementById('tvDepthLabel');
    if (dl) { dl.textContent = pal.state; dl.style.color='rgba('+a[0]+','+a[1]+','+a[2]+',0.45)'; }

    // ── PHASE OVERLAY ──
    var track = getTrack(currentId);
    var label = track ? getPhaseLabel(track.f, t) : {name:'',sub:''};
    if (label.name) showPhaseOverlay(label.name, label.sub);
  }
  vizFrameId = requestAnimationFrame(render);
}

function stopVizLoop() {
  vizRunning = false;
  if (vizFrameId) { cancelAnimationFrame(vizFrameId); vizFrameId = null; }
  if (tvPhaseTimer) { clearTimeout(tvPhaseTimer); tvPhaseTimer = null; }
  tvLastPhase = '';
  var nEl = document.getElementById('tvPhaseName');
  var sEl = document.getElementById('tvPhaseSub');
  if (nEl) nEl.className = 'tv-phase-name';
  if (sEl) sEl.className  = 'tv-phase-sub';
}



// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
// start with a shuffle so it's fresh each visit
queue = fisherYates(PERFORMANCES);
playQueue = [...queue];
isShuffled = true;

renderAll();

// default loop on
isLooping = true;
updateLoopUI();
</script>
</body>
</html>
