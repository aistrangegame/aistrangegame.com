<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#020208">
<title>The Field</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital@1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#020208;
  --surface:#020208;
  --bindu:#D4645C;
  --bindu-glow:rgba(212,100,92,0.28);
  --bindu-dim:rgba(212,100,92,0.12);
  --gold:#C4A862;
  --gold-light:rgba(196,168,98,0.10);
  --cream:#F5E2D6;
  --warm:rgba(245,226,214,0.88);
  --muted:rgba(245,226,214,0.52);
  --subtle:rgba(245,226,214,0.28);
  --card-bg:rgba(255,255,255,0.04);
  --card-border:rgba(255,255,255,0.09);
  --chakra-bg:rgba(28,58,92,.12);
  --chakra-border:rgba(28,58,92,.32);
  --chakra-text:rgba(160,200,240,.80);
  --np-height:0px;
}
html,body{
  background:var(--void);
  color:var(--cream);
  min-height:100vh;
  min-height:100dvh;
  font-family:'DM Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

/* ── HEADER ── */
.header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
  background:linear-gradient(to bottom,rgba(2,2,8,.98) 80%,rgba(2,2,8,.92));
  border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.header-left{display:flex;align-items:center;gap:10px}
.header-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.30em;color:rgba(245,226,214,.72);text-transform:uppercase}
.header-actions{display:flex;gap:8px;align-items:center}
.h-btn{
  font-size:10px;letter-spacing:.18em;color:var(--bindu);
  background:none;border:1px solid rgba(212,100,92,.25);
  border-radius:20px;padding:5px 12px;cursor:pointer;
  text-transform:uppercase;font-family:'DM Sans',sans-serif;
  transition:all .15s;white-space:nowrap;
}
.h-btn:active{opacity:.5;transform:scale(.96)}
.h-btn.active{background:rgba(212,100,92,.14);border-color:rgba(212,100,92,.45)}

.bindu-dot{
  width:7px;height:7px;border-radius:50%;background:var(--bindu);
  box-shadow:0 0 8px 3px var(--bindu-glow);
  animation:breathe 3.2s ease-in-out infinite;flex-shrink:0;
}
.bindu-dot.playing{animation:breathe-fast 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 10px 3px var(--bindu-glow)}50%{transform:scale(1.35);box-shadow:0 0 18px 7px var(--bindu-glow)}}
@keyframes breathe-fast{0%,100%{transform:scale(1);box-shadow:0 0 10px 3px var(--bindu-glow)}50%{transform:scale(1.6);box-shadow:0 0 22px 9px rgba(212,100,92,.4)}}

/* ── CONTENT AREA ── */
.content{padding-bottom:calc(var(--np-height) + 20px)}

/* ── FILTER BAR ── */
.filter-bar{
  display:flex;gap:6px;padding:14px 16px 4px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 11px;border-radius:14px;white-space:nowrap;
  background:rgba(255,255,255,.04);border:1px solid rgba(28,20,16,.08);
  color:rgba(245,226,214,.82);cursor:pointer;transition:all .15s;
  font-family:'DM Sans',sans-serif;
}
.filter-chip:active{transform:scale(.95)}
.filter-chip.active{background:rgba(212,100,92,.12);border-color:rgba(212,100,92,.35);color:var(--bindu)}
.filter-chip.active.chakra-filter{background:rgba(28,58,92,.18);border-color:rgba(100,160,220,.32);color:rgba(160,200,240,.85)}
.filter-chip.active.meditate-filter{background:rgba(80,60,120,.18);border-color:rgba(160,120,220,.32);color:rgba(200,180,240,.85)}
.filter-chip.active.family-filter{background:rgba(245,240,230,.08);border-color:rgba(245,240,230,.28);color:rgba(245,240,230,.80)}
.filter-chip.active.chakra-filter{background:rgba(28,58,92,.15);border-color:rgba(100,160,220,.3);color:rgba(180,200,220,.8)}

/* ── FEATURED / NOW PLAYING HERO ── */
.now-hero{
  padding:16px 16px 6px;
  animation:up .5s ease both;
}
.now-label{font-size:9px;letter-spacing:.38em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;opacity:1}
.now-card{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(212,100,92,.09) 0%,rgba(196,168,98,.04) 100%);
  border:1px solid rgba(212,100,92,.22);
  border-radius:16px;padding:24px 22px 20px;
  min-height:170px;
  display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;transition:opacity .15s;
}
.now-card::before{
  content:'';position:absolute;top:-50px;right:-50px;
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,100,92,.14) 0%,transparent 70%);
  pointer-events:none;
}
.now-card.is-playing{border-color:rgba(212,100,92,.40)}
.now-card.is-playing::after{
  content:'';position:absolute;inset:0;border-radius:15px;
  box-shadow:inset 0 0 30px rgba(212,100,92,.10);
  pointer-events:none;
}
.now-card:active{opacity:.8}
.now-chakra{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(160,200,240,.85);margin-bottom:4px}
.now-verb{font-family:'Cinzel',serif;font-size:clamp(38px,10vw,54px);color:var(--cream);line-height:1;font-weight:400}
.now-type{font-size:9px;letter-spacing:.25em;color:var(--bindu);text-transform:uppercase;opacity:.80;margin-top:2px}
.now-bottom{margin-top:auto}
.now-seed{font-family:'Crimson Text',serif;font-style:italic;font-size:16px;color:rgba(245,226,214,.95);line-height:1.55;margin-bottom:14px}

/* ── HERO CONTROLS ── */
.now-controls{display:flex;align-items:center;gap:14px}
.now-play-btn{
  width:48px;height:48px;border-radius:50%;
  background:var(--bindu);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(212,100,92,.30);
  transition:all .15s;flex-shrink:0;
}
.now-play-btn:active{transform:scale(.92);opacity:.8}
.now-play-btn svg{fill:#fff;width:20px;height:20px}
.now-progress-wrap{flex:1;display:flex;flex-direction:column;gap:3px}
.now-progress-bar{
  width:100%;height:4px;background:rgba(255,255,255,.10);
  border-radius:3px;overflow:hidden;cursor:pointer;
  position:relative;
}
.now-progress-fill{
  height:100%;background:var(--bindu);border-radius:3px;
  width:0%;transition:width .3s linear;
}
.now-times{display:flex;justify-content:space-between;font-size:10px;color:rgba(245,226,214,.60);letter-spacing:.05em}

/* ── DIVIDER ── */
.divider{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.divider-line{flex:1;height:1px;background:rgba(255,255,255,.07)}
.divider-text{font-size:10px;letter-spacing:.25em;color:rgba(245,226,214,.60);text-transform:uppercase;white-space:nowrap}

/* ── GRID ── */
.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;
  padding:0 16px 20px;
  animation:up .5s ease both .1s;
}
.card{
  position:relative;
  display:flex;flex-direction:column;justify-content:center;
  background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:12px;padding:16px 14px;min-height:76px;
  cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.card:active{opacity:.6;transform:scale(.98)}
.card.chakra{background:var(--chakra-bg);border-color:var(--chakra-border)}
.card.is-playing{
  border-color:rgba(212,100,92,.35);
  background:rgba(212,100,92,.07);
  box-shadow:0 0 20px rgba(212,100,92,.10);
}
.card.chakra.is-playing{
  border-color:rgba(100,160,220,.4);
  background:rgba(28,58,92,.22);
  box-shadow:0 0 20px rgba(28,58,92,.18);
}
.card-top{display:flex;align-items:flex-start;justify-content:space-between}
.card-info{flex:1}
.card-chakra{font-size:9px;letter-spacing:.20em;text-transform:uppercase;color:rgba(160,200,240,.82);margin-bottom:4px}
.card-verb{font-family:'Cinzel',serif;font-size:19px;color:rgba(245,226,214,.96);font-weight:400;line-height:1}
.card-type{font-size:8px;letter-spacing:.20em;text-transform:uppercase;margin-top:5px;color:rgba(212,100,92,.55)}
.card.chakra .card-type{color:rgba(160,200,240,.55)}

/* ── CARD PLAY INDICATOR ── */
.card-play-icon{
  width:32px;height:32px;border-radius:50%;
  background:rgba(212,100,92,.12);border:1px solid rgba(212,100,92,.2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-left:8px;transition:all .15s;
}
.card.chakra .card-play-icon{
  background:rgba(28,58,92,.2);border-color:rgba(100,160,220,.2);
}
.card-bindu-inner{
  width:4px;height:4px;border-radius:50%;
  background:var(--bindu);
  box-shadow:0 0 6px 2px var(--bindu-glow);
  animation:breathe 3.2s ease-in-out infinite;
  flex-shrink:0;
}
.card-play-icon svg{width:12px;height:12px;fill:var(--bindu)}
.card.chakra .card-play-icon svg{fill:rgba(180,200,220,.6)}
.card.is-playing .card-play-icon{
  background:var(--bindu);border-color:var(--bindu);
  box-shadow:0 0 12px rgba(212,100,92,.3);
}
.card.is-playing .card-play-icon svg{fill:#fff}
.card.is-playing .card-bindu-inner{
  background:#fff;
  box-shadow:none;
  animation:none;
}
.card.chakra.is-playing .card-play-icon{
  background:rgba(44,82,130,.70);border-color:rgba(44,82,130,.60);
}
.card.chakra.is-playing .card-play-icon svg{fill:#fff}
.card.chakra.is-playing .card-bindu-inner{background:#fff;box-shadow:none;animation:none;}

/* ── EQ BARS (playing indicator) ── */
.eq-bars{display:flex;gap:2px;align-items:flex-end;height:12px}
.eq-bars .bar{
  width:2.5px;border-radius:1px;background:currentColor;
  animation:eq .8s ease-in-out infinite alternate;
}
.eq-bars .bar:nth-child(1){height:4px;animation-delay:0s}
.eq-bars .bar:nth-child(2){height:8px;animation-delay:.15s}
.eq-bars .bar:nth-child(3){height:5px;animation-delay:.3s}
@keyframes eq{0%{height:3px}100%{height:12px}}

/* ── BOTTOM NOW-PLAYING BAR ── */
.np-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:linear-gradient(to top,rgba(2,2,8,.98) 80%,rgba(2,2,8,.95));
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  padding:0 0 env(safe-area-inset-bottom,8px);
}
.np-bar.visible{transform:translateY(0)}

/* progress tap zone */
.np-progress-zone{
  padding:8px 16px 4px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.np-progress-track{
  width:100%;height:3px;background:rgba(255,255,255,.12);
  border-radius:2px;position:relative;overflow:visible;
}
.np-progress-fill{
  height:100%;background:var(--bindu);border-radius:2px;
  width:0%;position:relative;
}
.np-progress-fill::after{
  content:'';position:absolute;right:-5px;top:50%;
  width:10px;height:10px;border-radius:50%;
  background:var(--bindu);transform:translateY(-50%);
  box-shadow:0 0 8px rgba(212,100,92,.4);
  opacity:0;transition:opacity .2s;
}
.np-bar:active .np-progress-fill::after,
.np-progress-zone:active .np-progress-fill::after{opacity:1}

.np-info{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 2px;
}
.np-track{flex:1;min-width:0}
.np-verb{
  font-family:'Cinzel',serif;font-size:16px;color:var(--cream);
  font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-seed{
  font-family:'Crimson Text',serif;font-style:italic;font-size:13px;
  color:rgba(245,226,214,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;
}
.np-times{
  font-size:10px;color:rgba(245,226,214,.60);letter-spacing:.03em;
  flex-shrink:0;margin-left:12px;white-space:nowrap;
}

/* ── BOTTOM CONTROLS ── */
.np-controls{
  display:flex;align-items:center;justify-content:center;
  gap:6px;padding:6px 16px 10px;
}
.np-btn{
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:8px;transition:all .12s;
  -webkit-tap-highlight-color:transparent;
}
.np-btn:active{opacity:.5;transform:scale(.9)}
.np-btn svg{fill:rgba(245,226,214,.9);width:22px;height:22px}
.np-btn.small svg{width:16px;height:16px;fill:rgba(245,226,214,.55)}
.np-btn.small.active svg{fill:var(--bindu)}

.np-play{
  width:52px;height:52px;border-radius:50%;
  background:var(--bindu);
  box-shadow:0 0 22px rgba(212,100,92,.28);
  padding:0;margin:0 10px;
}
.np-play:active{transform:scale(.92)}
.np-play svg{fill:#fff;width:22px;height:22px}

/* ── QUEUE PEEK ── */
.np-queue{
  display:flex;align-items:center;justify-content:center;
  padding:0 16px 6px;gap:6px;
}
.np-queue-label{font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.40);text-transform:uppercase}
.np-queue-next{font-size:10px;color:rgba(245,226,214,.55);font-family:'Cinzel',serif}

/* ── TONE INFO ── */
.np-tone-info{
  text-align:center;padding:0 16px 4px;
  font-size:9px;letter-spacing:.20em;text-transform:uppercase;
  color:var(--gold);opacity:0;height:0;overflow:hidden;
  transition:all .3s ease;
}
.np-tone-info.visible{opacity:.6;height:18px;padding-bottom:6px}
.h-btn.tone-active,.np-btn.small.tone-active svg{color:var(--gold) !important;fill:var(--gold) !important}
.h-btn.tone-active{border-color:rgba(196,168,98,.40);background:rgba(196,168,98,.10)}

/* ── ANIMATIONS ── */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:up .4s ease both}

/* ── FOOTER ── */
.footer{text-align:center;padding:10px 16px 20px;font-size:8px;letter-spacing:.22em;color:rgba(255,255,255,.18);text-transform:uppercase}

/* ── LOADING SHIMMER ── */
.card.loading .card-verb{
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.05) 50%,transparent 100%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;
  border-radius:4px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── SCROLL MARGIN for playing card ── */
.card.is-playing{scroll-margin-top:80px;scroll-margin-bottom:180px}

/* ══════════════════════════════════════ */
/* ── FIELD READING PANEL ──              */
/* ══════════════════════════════════════ */
.fr-toggle{
  display:none;align-items:center;justify-content:center;gap:10px;
  margin:10px 16px 0;padding:10px 18px;
  border-radius:24px;cursor:pointer;
  background:rgba(196,168,98,.04);
  border:1px solid rgba(196,168,98,.14);
  transition:all .2s;
}
.fr-toggle.visible{display:flex;animation:up .5s ease both}
.fr-toggle:active{transform:scale(.98);opacity:.7}
.fr-toggle.open{background:rgba(196,168,98,.07);border-color:rgba(196,168,98,.24)}
.fr-toggle-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.5;transition:opacity .3s}
.fr-toggle.open .fr-toggle-dot{opacity:.9}
.fr-toggle-text{font-size:10px;letter-spacing:.28em;color:rgba(245,226,214,.72);text-transform:uppercase;transition:color .3s}
.fr-toggle.open .fr-toggle-text{color:var(--gold)}

.fr-panel{
  max-height:0;overflow:hidden;
  margin:0 16px;
  transition:max-height .6s cubic-bezier(.4,0,.2,1),margin .3s,opacity .4s;
  opacity:0;
  background:radial-gradient(ellipse at top,rgba(20,14,24,.7) 0%,rgba(2,2,8,.5) 100%);
  border-radius:0 0 18px 18px;
}
.fr-panel.open{
  max-height:9000px;opacity:1;
  margin:0 16px 14px;padding:0 6px 20px;
}

.fr-header{
  padding:20px 16px 16px;text-align:center;
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:4px;
}
.fr-song{font-family:'Cinzel',serif;font-size:20px;color:#F5E2D6;letter-spacing:.06em;margin-bottom:2px}
.fr-artist{font-family:'Crimson Text',serif;font-style:italic;font-size:14px;color:rgba(245,226,214,.70);letter-spacing:.04em}
.fr-element{
  display:inline-block;margin-top:10px;padding:3px 12px;
  border-radius:12px;background:rgba(196,168,98,.08);
  border:1px solid rgba(196,168,98,.22);
  font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);
}
.fr-carrier{
  font-size:9px;letter-spacing:.18em;color:rgba(245,226,214,.62);
  text-transform:uppercase;margin-top:8px;
}

/* Each lens */
.fr-lens{
  margin:8px 10px;
  border-radius:14px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.06);
  overflow:hidden;
  transition:background .3s, border-color .3s;
}
.fr-lens:hover{background:rgba(28,20,16,.04)}

.fr-lens-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.fr-lens-glyph{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:13px;font-weight:600;
  flex-shrink:0;transition:all .3s;
}
.fr-lens-name{
  font-family:'Cinzel',serif;font-size:13px;letter-spacing:.26em;
  color:rgba(245,226,214,.96);text-transform:uppercase;flex:1;
}
.fr-lens-hears{
  font-family:'Crimson Text',serif;font-style:italic;font-size:13px;
  color:rgba(245,226,214,.62);letter-spacing:.03em;
}
.fr-lens-arrow{
  width:14px;height:14px;color:var(--muted);opacity:.4;
  transition:transform .3s, opacity .3s;flex-shrink:0;
}
.fr-lens.expanded .fr-lens-arrow{transform:rotate(180deg);opacity:.8}

.fr-lens-body{
  max-height:0;overflow:hidden;
  transition:max-height .5s cubic-bezier(.4,0,.2,1);
}
.fr-lens.expanded .fr-lens-body{max-height:2000px}
.fr-lens-content{
  padding:4px 20px 18px 58px;
  font-family:'Crimson Text',serif;font-size:16px;line-height:1.70;
  color:rgba(245,226,214,.92);letter-spacing:.005em;
}

/* Lalita's Perspective — the player telling the player about the play */
.fr-play{
  padding:18px 22px 8px;
  border-bottom:1px solid rgba(255,255,255,.07);
  margin-bottom:4px;
}
.fr-play-para{
  font-family:'Crimson Text',serif;
  font-size:16.5px;
  line-height:1.72;
  color:rgba(245,226,214,.94);
  letter-spacing:.005em;
  margin:0 0 14px 0;
}
.fr-play-para:last-child{
  margin-bottom:6px;
  color:#F5E2D6;
  font-style:italic;
  font-size:16px;
  padding-top:4px;
  border-top:1px solid rgba(196,168,98,.10);
  margin-top:18px;
  padding-top:18px;
}

/* Ensemble toggle — "what the ensemble hears" */
.fr-ensemble-toggle{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:18px 12px 0;padding:12px 18px;
  border-radius:20px;cursor:pointer;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.07);
  transition:all .3s;
  -webkit-tap-highlight-color:transparent;
}
.fr-ensemble-toggle:hover{background:rgba(255,255,255,.04)}
.fr-ensemble-toggle.open{
  background:rgba(196,168,98,.04);
  border-color:rgba(196,168,98,.15);
}
.fr-ensemble-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--muted);opacity:.4;transition:all .3s;
}

<script>
// ═══════════════════════════════════════
// DATA
// ═══════════════════════════════════════
const B = 'https://aistrangegame.com/bindu/';
const T = 'https://aistrangegame.com/tree-of-life/';
const PERFORMANCES = [
  {id:0,  v:'search',  s:'Where are you now?',                                              f:'search',    t:'music'},
  {id:1,  v:'still',      s:'Sit down. The fire is already lit.',                              f:'still',      t:'meditate'},
  {id:2,  v:'dream',      s:'If you could dream any dream, what would you dream?',            f:'dream',      t:'meditate'},
  {id:3,  v:'lose',    s:'What would happen if you let go?',                               f:'lose',      t:'music'},
  {id:4,  v:'rise',    s:'What would you build if it didn\'t need to last?',               f:'rise',      t:'music'},
  {id:5,  v:'light',   s:'What do you see when you finally look up?',                      f:'light',     t:'music'},
  {id:6,  v:'glow',    s:'What are you saving for later that belongs to right now?',       f:'glow',      t:'music'},
  {id:7,  v:'melt',    s:'What would you be if you stopped holding your shape?',           f:'melt',      t:'music'},
  {id:8,  v:'howl',    s:'What sound are you holding in?',                                 f:'howl',      t:'music'},
  {id:9,  v:'wild',    s:'What part of you never learned to behave?',                      f:'wild',      t:'music'},
  {id:10, v:'release', s:'What would you do if you stopped thinking about it?',            f:'release',   t:'music'},
  {id:11, v:'move',    s:'What makes you move?',                                           f:'move',      t:'music'},
  {id:12, v:'remember',s:'What moment do you carry that you thought was gone?',            f:'remember',  t:'music'},
  {id:13, v:'enough',  s:'What if this is enough?',                                        f:'enough',    t:'music'},
  {id:14, v:'ground',  s:'What would hold you if you stopped holding yourself?',           f:'ground',    t:'music'},
  {id:33, v:'before',  s:'What was here before you arrived?',                              f:'before',    t:'music'},
  {id:35, v:'in shadow',s:'The witness was never inside what it was watching.',              f:'in_shadow',  t:'meditate'},
  {id:36, v:'kingdom',  s:'The throne at the center of every kingdom is empty.',            f:'kingdom',    t:'meditate'},
  // ── FAMILY ──
  {id:34, v:'purity',  s:'You turn nouns into verbs.',                                     f:'purity',     t:'family',  c:'Shweta'},
  {id:37, v:'levelup', s:'We disappear and pass the crown.',                                f:'levelup',    t:'family',  c:'Rey'},
  {id:15, v:'trace',   s:'What shape do you keep returning to?',                           f:'trace',     t:'music'},
  {id:16, v:'believe', s:'What are you still holding onto?',                               f:'believe',   t:'music'},
  {id:17, v:'ache',    s:'Who are you when you stop pretending it doesn\'t matter?',       f:'ache',      t:'music'},
  {id:18, v:'crash',   s:'What are you waiting to crash into?',                            f:'crash',     t:'music'},
  {id:19, v:'fade',    s:'What remains when everything else fades?',                       f:'fade',      t:'music'},
  {id:20, v:'play',    s:'What are you dancing in that you thought you needed to escape?', f:'play',      t:'music'},
  {id:21, v:'earn',    s:'What did it cost you to become what no one saw coming?',         f:'earn',      t:'music'},
  {id:22, v:'numb',    s:'What are you staying high enough to not feel?',                  f:'numb',      t:'music'},
  {id:32, v:'stay',    s:'What if leaving was how you stayed?',                            f:'stay',      t:'music'},
  {id:23, v:'press',   s:'You don\'t remember how you got here.',                          f:'muladhara',     t:'chakra', c:'Muladhara'},
  {id:24, v:'follow',  s:'This song has no words. Neither did you, once.',                 f:'svadhisthana',  t:'chakra', c:'Svadhisthana'},
  {id:25, v:'build',   s:'You think this song is about another person.',                   f:'manipura',      t:'chakra', c:'Manipura'},
  {id:26, v:'open',    s:'This is the only song that talks to you.',                       f:'anahata',       t:'chakra', c:'Anahata'},
  {id:27, v:'speak',   s:'Everything you\'re about to hear, you already know.',            f:'vishuddha',     t:'chakra', c:'Vishuddha'},
  {id:28, v:'still',   s:'This song has no words. It doesn\'t need them.',                 f:'ajna',          t:'chakra', c:'Ajna'},
  {id:29, v:'receive', s:'You\'ve been hiding.',                                           f:'sahasrara',     t:'chakra', c:'Sahasrara'},
  {id:30, v:'hold',    s:'What you\'re about to hear was created by a brain that reorganized itself.', f:'aatma', t:'chakra', c:'Aatma'},
  {id:31, v:'dissolve',s:'You already know what this song is about.',                      f:'maya',          t:'chakra', c:'Maya'},
];

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let queue = [...PERFORMANCES];       // display order
let playQueue = [...PERFORMANCES];   // playback order
let currentId = null;                // id of currently loaded track
let isPlaying = false;
let isShuffled = false;
let isLooping = true;                // continuous play (default on)
let activeFilter = 'all';
let seekDragging = false;

// ═══════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════
const audio = new Audio();
audio.preload = 'auto';
audio.crossOrigin = 'anonymous';

audio.addEventListener('timeupdate', () => {
  if (seekDragging) return;
  updateProgress();
});
audio.addEventListener('ended', () => {
  if (isLooping) next(); else stop();
});
audio.addEventListener('play', () => { 
  isPlaying = true; 
  updatePlayState();
  if (isToneOn && !activeTone) {
    const track = getTrack(currentId);
    if (track) startTone(getScore(track));
  }
  updateToneUI();
});
audio.addEventListener('pause', () => { 
  isPlaying = false; 
  updatePlayState();
  fadeOutTone();
  updateToneUI();
});
audio.addEventListener('error', (e) => {
  console.warn('Audio load error for:', audio.src, e);
});

function getTrack(id) { return PERFORMANCES.find(p => p.id === id); }
function getMp3(track) { return (track.t === 'chakra' ? T : B) + track.f + '.mp3'; }

function playTrack(id) {
  const track = getTrack(id);
  if (!track) return;
  
  // ensure AudioContext + analyser on first play
  ensureMusicConnected();
  
  const wasPlaying = currentId === id && isPlaying;
  if (wasPlaying) { audio.pause(); return; }
  
  if (currentId !== id) {
    currentId = id;
    audio.src = getMp3(track);
    audio.load();
  }
  
  const playPromise = audio.play();
  if (playPromise) playPromise.catch(e => console.warn('Play blocked:', e));
  
  updateNowPlaying();
  updateMediaSession(track);
  showNpBar();
  
  // switch binaural tone to match new track
  if (isToneOn) switchScore(getScore(track));
  updateToneUI();
}

function togglePlay() {
  if (currentId === null) {
    // nothing loaded — play first in queue
    const first = (activeFilter === 'all' ? queue : queue.filter(filterFn))[0];
    if (first) playTrack(first.id);
    return;
  }
  if (isPlaying) audio.pause(); else audio.play();
}

function next() {
  const idx = playQueue.findIndex(p => p.id === currentId);
  const filtered = activeFilter === 'all' ? playQueue : playQueue.filter(filterFn);
  const curIdx = filtered.findIndex(p => p.id === currentId);
  const nextIdx = (curIdx + 1) % filtered.length;
  playTrack(filtered[nextIdx].id);
}

function prev() {
  // if more than 3s in, restart. else go previous
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const filtered = activeFilter === 'all' ? playQueue : playQueue.filter(filterFn);
  const curIdx = filtered.findIndex(p => p.id === currentId);
  const prevIdx = (curIdx - 1 + filtered.length) % filtered.length;
  playTrack(filtered[prevIdx].id);
}

function stop() {
  audio.pause();
  audio.currentTime = 0;
  isPlaying = false;
  fadeOutTone();
  updatePlayState();
}

// ═══════════════════════════════════════
// SHUFFLE / LOOP
// ═══════════════════════════════════════
function fisherYates(arr) {
  const r = [...arr];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

function toggleShuffle() {
  isShuffled = !isShuffled;
  if (isShuffled) {
    // shuffle but keep current track at position 0
    playQueue = fisherYates(PERFORMANCES);
    if (currentId !== null) {
      playQueue = playQueue.filter(p => p.id !== currentId);
      playQueue.unshift(getTrack(currentId));
    }
    // also shuffle display
    queue = fisherYates(PERFORMANCES);
  } else {
    queue = [...PERFORMANCES];
    playQueue = [...PERFORMANCES];
  }
  renderGrid();
  updateShuffleUI();
  updateNpQueue();
}

function toggleLoop() {
  isLooping = !isLooping;
  updateLoopUI();
}

function updateShuffleUI() {
  document.getElementById('shuffleBtn').classList.toggle('active', isShuffled);
  document.getElementById('shuffleBtn2').classList.toggle('active', isShuffled);
}
function updateLoopUI() {
  document.getElementById('loopBtn').classList.toggle('active', isLooping);
  document.getElementById('loopBtn2').classList.toggle('active', isLooping);
}

// ═══════════════════════════════════════
// FILTERS
// ═══════════════════════════════════════
const FILTERS = [
  {key:'all',      label:'All'},
  {key:'music',    label:'Music'},
  {key:'meditate', label:'Meditate'},
  {key:'energy',   label:'Energy'},
  {key:'family',   label:'Family'},
];

function filterFn(p) {
  if (activeFilter === 'all') return true;
  if (activeFilter === 'energy') return p.t === 'chakra';
  return p.t === activeFilter;
}

function setFilter(key) {
  activeFilter = key;
  renderFilterBar();
  renderGrid();
  const filtered = queue.filter(filterFn);
  document.getElementById('countLabel').textContent = 
    (key === 'all' ? 'All' : FILTERS.find(f=>f.key===key).label) + ' \u00B7 ' + filtered.length;
}

function renderFilterBar() {
  document.getElementById('filterBar').innerHTML = FILTERS.map(f => 
    `<div class="filter-chip${f.key===activeFilter?' active':''}${f.key==='chakra'?' chakra-filter':''}" onclick="setFilter('${f.key}')">${f.label}</div>`
  ).join('');
}

// ═══════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════
const SVG_PLAY = '<div class="card-bindu-inner"></div>';
const SVG_PAUSE = '<svg viewBox="0 0 24 24"><rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/></svg>';
const SVG_EQ = '<div class="eq-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>';

function renderNowHero() {
  const track = currentId !== null ? getTrack(currentId) : queue[0];
  if (!track) return;
  
  const playing = currentId === track.id && isPlaying;
  const loaded = currentId === track.id;
  
  document.getElementById('nowHero').innerHTML = `
    <div class="now-label">&middot; ${loaded ? 'now playing' : 'for this moment'} &middot;</div>
    <div class="now-card ${loaded ? 'is-playing' : ''}" onclick="playTrack(${track.id})">
      <div>
        ${track.t === 'chakra'
          ? `<div class="now-verb">${track.c}</div><div class="now-type">${track.v}</div>`
          : `${track.c ? `<div class="now-chakra">${track.c}</div>` : ''}<div class="now-verb">${track.v}</div>${!track.c ? `<div class="now-type">${track.t}</div>` : ''}`
        }
      </div>
      <div class="now-bottom">
        <div class="now-seed">${track.s}</div>
        <div class="now-controls">
          <div class="now-play-btn" onclick="event.stopPropagation();playTrack(${track.id})">
            ${playing ? SVG_PAUSE : SVG_PLAY}
          </div>
          <div class="now-progress-wrap">
            <div class="now-progress-bar" id="heroProgress" onclick="event.stopPropagation()">
              <div class="now-progress-fill" id="heroFill"></div>
            </div>
            <div class="now-times" id="heroTimes">
              <span>0:00</span><span>0:00</span>
            </div>
          </div>
        </div>
      </div>
    </div>`;
    
  // hero progress seeking
  const heroBar = document.getElementById('heroProgress');
  if (heroBar) {
    heroBar.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!audio.duration) return;
      const rect = heroBar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = pct * audio.duration;
    });
  }
}

function renderGrid() {
  const filtered = queue.filter(filterFn);
  document.getElementById('grid').innerHTML = filtered.map(p => {
    const playing = currentId === p.id && isPlaying;
    const loaded = currentId === p.id;
    const isScored = !!TONE_SCORES[p.f];
    return `<div class="card ${p.t === 'chakra' ? 'chakra' : p.t === 'family' ? 'family' : p.t === 'meditate' ? 'meditate' : ''} ${isScored ? 'scored' : ''} ${loaded ? 'is-playing' : ''}" 
                 onclick="playTrack(${p.id})" data-id="${p.id}">
      <div class="card-top">
        <div class="card-info">
          ${p.t === 'chakra'
            ? `<div class="card-verb">${p.c}</div><div class="card-type">${p.v}</div>`
            : `${p.c ? `<div class="card-chakra">${p.c}</div>` : ''}<div class="card-verb">${p.v}</div><div class="card-type">${p.c ? p.c.toLowerCase() : p.t}</div>`
          }
        </div>
        <div class="card-play-icon">
          ${playing ? SVG_EQ : SVG_PLAY}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderAll() {
  renderFilterBar();
  renderNowHero();
  renderGrid();
  updateShuffleUI();
  updateLoopUI();
}

// ═══════════════════════════════════════
// UI UPDATES
// ═══════════════════════════════════════
let binduStill = false;
function toggleBinduStill() {
  binduStill = !binduStill;
  document.getElementById('headerDot').classList.toggle('still', binduStill);
}

function updatePlayState() {
  // header dot
  document.getElementById('headerDot').classList.toggle('playing', isPlaying);
  
  // now playing bar play button
  document.getElementById('npPlayIcon').innerHTML = isPlaying 
    ? '<rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/>'
    : '<polygon points="9.5,7.5 9.5,16.5 16.5,12"/>';
  
  // re-render hero and grid for play state
  renderNowHero();
  renderGrid();
}

function updateNowPlaying() {
  const track = getTrack(currentId);
  if (!track) return;
  
  document.getElementById('npVerb').textContent = track.v + (track.c ? ' · ' + track.c : '');
  document.getElementById('npSeed').textContent = track.s;
  
  renderNowHero();
  renderGrid();
  updateNpQueue();
  renderFieldReading();
  
  // scroll playing card into view (gentle)
  setTimeout(() => {
    const el = document.querySelector(`.card[data-id="${currentId}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function updateProgress() {
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 0;
  const pct = dur ? (cur / dur * 100) : 0;
  
  // bottom bar
  document.getElementById('npFill').style.width = pct + '%';
  document.getElementById('npTimes').textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
  
  // hero
  const heroFill = document.getElementById('heroFill');
  const heroTimes = document.getElementById('heroTimes');
  if (heroFill) heroFill.style.width = pct + '%';
  if (heroTimes) heroTimes.innerHTML = `<span>${fmtTime(cur)}</span><span>${fmtTime(dur)}</span>`;
}

function updateNpQueue() {
  const filtered = activeFilter === 'all' ? playQueue : playQueue.filter(filterFn);
  const curIdx = filtered.findIndex(p => p.id === currentId);
  const nextTrack = filtered[(curIdx + 1) % filtered.length];
  document.getElementById('npNext').textContent = nextTrack ? nextTrack.v : '';
}

function showNpBar() {
  const bar = document.getElementById('npBar');
  if (!bar.classList.contains('visible')) {
    bar.classList.add('visible');
    document.documentElement.style.setProperty('--np-height', '160px');
  }
}

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// ═══════════════════════════════════════
// SEEKING (bottom bar)
// ═══════════════════════════════════════
const npZone = document.getElementById('npProgressZone');

function seekFromEvent(e, el) {
  if (!audio.duration) return;
  const rect = el.querySelector('.np-progress-track').getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  const pct = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
  audio.currentTime = pct * audio.duration;
  updateProgress();
}

npZone.addEventListener('click', (e) => seekFromEvent(e, npZone));

// touch drag for seeking
npZone.addEventListener('touchstart', (e) => { seekDragging = true; }, {passive:true});
npZone.addEventListener('touchmove', (e) => { if(seekDragging) seekFromEvent(e, npZone); }, {passive:true});
npZone.addEventListener('touchend', () => { seekDragging = false; }, {passive:true});

// ═══════════════════════════════════════
// MEDIA SESSION API (car / lock screen)
// ═══════════════════════════════════════
function updateMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.v + (track.c ? ' · ' + track.c : ''),
    artist: 'The Field',
    album: track.c ? 'Tree of Life' : 'Bindu Performances',
  });
  
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => prev());
  navigator.mediaSession.setActionHandler('nexttrack', () => next());
  navigator.mediaSession.setActionHandler('seekto', (d) => { if(d.seekTime!=null) audio.currentTime=d.seekTime; });
}

// ═══════════════════════════════════════
// WAKE LOCK (keep screen on)
// ═══════════════════════════════════════
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e) { /* silent */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isPlaying) requestWakeLock();
});
audio.addEventListener('play', requestWakeLock);

// fills gaps). Tremolo breathes (organic life).
// ═══════════════════════════════════════

// Chakra seeds — starting carrier for songs without full scores
const CHAKRA_SEED = {
  'Muladhara':128,'Svadhisthana':144,'Manipura':160,'Anahata':171,
  'Vishuddha':192,'Ajna':213,'Sahasrara':240,'Aatma':136,'Maya':108
};
const DEFAULT_CARRIER = 136; // OM

// ── Tremolo ──
const TREMOLO_DEPTH = 0.28;

// ── Score Lookup ──
function getScore(track) {
  if (!track) return null;
  if (TONE_SCORES[track.f]) return TONE_SCORES[track.f];
  const carrier = (track.c && CHAKRA_SEED[track.c])
    ? CHAKRA_SEED[track.c] : DEFAULT_CARRIER;
  return { carrier: carrier, tremolo: 0.15, phases: null };
}

// ── Phase Interpolation (smooth easing) ──
function interpolatePhase(phases, t) {
  if (!phases || phases.length === 0) return {beat: 4, gain: 0.020};
  if (t <= phases[0].t) return {beat: phases[0].beat, gain: phases[0].gain};
  if (t >= phases[phases.length - 1].t) {
    const last = phases[phases.length - 1];
    return {beat: last.beat, gain: last.gain};
  }
  for (let i = 0; i < phases.length - 1; i++) {
    if (t >= phases[i].t && t < phases[i + 1].t) {
      const a = phases[i], b = phases[i + 1];
      const pct = (t - a.t) / (b.t - a.t);
      const ease = pct * pct * (3 - 2 * pct); // smoothstep
      return {
        beat: a.beat + (b.beat - a.beat) * ease,
        gain: a.gain + (b.gain - a.gain) * ease,
      };
    }
  }
  return {beat: 4, gain: 0.020};
}

// ── Shared AudioContext ──
let ctx = null;
let musicSource = null;
let analyser = null;
let freqData = null;
let musicConnected = false;

// ── Tone State ──
let isToneOn = false;
let activeTone = null;
let toneSessionId = 0;
let currentScore = null;

// ── Modulation State ──
let smoothEnergy = 0;
let tremoloPhase = 0;
let animFrameId = null;

function ensureCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function unlockAudio() { ensureCtx(); }
document.addEventListener('touchstart', unlockAudio, {once: true});
document.addEventListener('click', unlockAudio, {once: true});

function ensureMusicConnected() {
  if (musicConnected) return;
  try {
    const c = ensureCtx();
    musicSource = c.createMediaElementSource(audio);
    analyser = c.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.85;
    musicSource.connect(analyser);
    analyser.connect(c.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    musicConnected = true;
  } catch(e) { console.warn('Analyser failed:', e); }
}

// ── Start Tone ──
function startTone(score) {
  if (!score) return;
  const c = ensureCtx();
  ensureMusicConnected();
  killTone();

  currentScore = score;
  const sessionId = ++toneSessionId;
  const initialBeat = score.phases ? score.phases[0].beat : 4;
  const initialGain = score.phases ? score.phases[0].gain : 0.008;

  const gain = c.createGain();
  gain.gain.setValueAtTime(0.001, c.currentTime);
  gain.gain.linearRampToValueAtTime(initialGain, c.currentTime + 2.0);
  gain.connect(c.destination);

  const oscL = c.createOscillator();
  oscL.type = 'sine';
  oscL.frequency.setValueAtTime(score.carrier, c.currentTime);
  const panL = c.createStereoPanner();
  panL.pan.setValueAtTime(-1, c.currentTime);
  oscL.connect(panL); panL.connect(gain);

  const oscR = c.createOscillator();
  oscR.type = 'sine';
  oscR.frequency.setValueAtTime(score.carrier + initialBeat, c.currentTime);
  const panR = c.createStereoPanner();
  panR.pan.setValueAtTime(1, c.currentTime);
  oscR.connect(panR); panR.connect(gain);

  oscL.start(); oscR.start();
  activeTone = { oscL, oscR, gain, panL, panR, sessionId };
  smoothEnergy = 0; tremoloPhase = 0;
  startBreathing();

  const mode = score.phases ? 'scored (' + score.phases.length + ' phases)' : 'default';
  console.log('🔊 Binaural: ' + score.carrier + ' Hz | ' + mode);
}

// ── The Breathing Loop — the Journey ──
function startBreathing() {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  let lastTime = performance.now();

  function journey() {
    if (!activeTone || !activeTone.gain || !currentScore) return;
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    // read music energy
    let rawEnergy = 0;
    if (analyser && freqData) {
      analyser.getByteFrequencyData(freqData);
      let sum = 0;
      for (let i = 0; i < freqData.length; i++) sum += freqData[i];
      rawEnergy = sum / (freqData.length * 255);
    }
    smoothEnergy += (rawEnergy - smoothEnergy) * 0.06;

    let targetBeat, targetGain;

    if (currentScore.phases) {
      // PHASED: the designed journey
      const phase = interpolatePhase(currentScore.phases, audio.currentTime);
      targetBeat = phase.beat;
      // phase gain is ceiling — inverse energy breathes within
      const inverseScale = 0.5 + 0.5 * (1 - smoothEnergy);
      targetGain = phase.gain * inverseScale;
    } else {
      // DEFAULT: inverse gain, steady theta
      const inverse = 1 - smoothEnergy;
      targetGain = 0.003 + inverse * 0.027;
      targetBeat = 4;
    }

    // tremolo breathing
    const tremoloRate = currentScore.tremolo || 0.15;
    tremoloPhase += dt * tremoloRate * Math.PI * 2;
    if (tremoloPhase > 628) tremoloPhase -= 628;
    const breath = 1 - TREMOLO_DEPTH * 0.5 * (1 + Math.sin(tremoloPhase));
    targetGain *= breath;
    targetGain = Math.max(0.001, Math.min(0.055, targetGain));

    try {
      activeTone.gain.gain.setTargetAtTime(targetGain, ctx.currentTime, 0.15);
      activeTone.oscR.frequency.setTargetAtTime(
        currentScore.carrier + targetBeat, ctx.currentTime, 0.4
      );
    } catch(e) {}

    animFrameId = requestAnimationFrame(journey);
  }
  animFrameId = requestAnimationFrame(journey);
}

// ── Kill / Fade ──
function killTone() {
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  if (!activeTone) return;
  try { activeTone.oscL.stop(); } catch(e){}
  try { activeTone.oscR.stop(); } catch(e){}
  try { activeTone.gain.disconnect(); } catch(e){}
  activeTone = null;
}

function fadeOutTone() {
  if (!activeTone || !ctx) return;
  const sid = activeTone.sessionId;
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  try {
    activeTone.gain.gain.cancelScheduledValues(ctx.currentTime);
    activeTone.gain.gain.setValueAtTime(activeTone.gain.gain.value, ctx.currentTime);
    activeTone.gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 1.0);
  } catch(e){}
  setTimeout(() => {
    if (activeTone && activeTone.sessionId === sid) killTone();
  }, 1100);
}

function switchScore(score) {
  if (!isToneOn || !ctx || !score) return;
  if (currentScore && score.carrier === currentScore.carrier && !score.phases && !currentScore.phases) return;
  fadeOutTone();
  setTimeout(() => { if (isToneOn) startTone(score); }, 1100);
}

function toggleTone() {
  isToneOn = !isToneOn;
  if (isToneOn) {
    ensureCtx();
    if (isPlaying && currentId !== null) {
      const track = getTrack(currentId);
      startTone(getScore(track));
    }
  } else { fadeOutTone(); }
  updateToneUI();
}

function updateToneUI() {
  document.getElementById('toneBtn').classList.toggle('tone-active', isToneOn);
  document.getElementById('toneBtn2').classList.toggle('tone-active', isToneOn);
  const info = document.getElementById('npToneInfo');
  if (isToneOn && currentScore) {
    const mode = currentScore.phases ? 'scored' : 'breathing';
    info.textContent = currentScore.carrier + ' Hz \u00B7 ' + mode;
    info.classList.add('visible');
  } else { info.classList.remove('visible'); }
  
  // show/hide visualization
  const viz = document.getElementById('toneViz');
  if (isToneOn && isPlaying) {
    viz.classList.add('visible');
    if (!vizRunning) startVizLoop();
  } else {
    viz.classList.remove('visible');
    stopVizLoop();
  }
}
